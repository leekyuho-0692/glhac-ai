<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL-HAC AI · 할랄·샤리아 인증 플랫폼</title>
<style>
  :root{
    --shell:#0F172A; --shell2:#1E293B; --line:#E2E8F0; --line2:#CBD5E1;
    --bg:#F1F5F9; --card:#FFFFFF; --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8;
    --accent:#2563EB; --accent2:#1D4ED8; --accent-soft:#EFF6FF;
    --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7;
    --bad:#DC2626; --bad-soft:#FEE2E2; --gold:#B45309; --gold-soft:#FEF3C7;
    --nav-active:#334155; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
    --radius:12px;
  }
  html[data-theme="dark"]{
    --bg:#0B1120; --card:#111827; --ink:#E5E7EB; --ink2:#94A3B8; --ink3:#64748B;
    --line:#1F2937; --line2:#334155; --accent-soft:#0F1E3D;
    --ok-soft:#052e16; --warn-soft:#3a2606; --bad-soft:#3a0d0d; --gold-soft:#3a2606;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh}
  aside{width:264px;flex:0 0 264px;background:var(--shell);color:#CBD5E1;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:18px 20px 10px}
  .brand b{color:#fff;font-size:17px;letter-spacing:-.3px}
  .brand small{display:block;color:#64748B;font-size:11px;margin-top:2px}
  nav{padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;
    color:#CBD5E1;text-decoration:none;font-size:14.5px;cursor:pointer;transition:.12s;white-space:nowrap}
  nav a .en{color:#64748B;font-size:12px;margin-left:auto}
  nav a:hover{background:#1E293B;color:#fff}
  nav a.active{background:var(--nav-active);color:#fff;font-weight:600}
  nav a.active .en{color:#93C5FD}
  .navfoot{margin-top:auto;padding:12px 20px;color:#475569;font-size:11px;border-top:1px solid #1E293B}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:66px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:5}
  .crumb{font-size:14.5px;color:var(--ink2)}
  .crumb b{color:var(--ink)}
  .topbar .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line2);color:var(--ink2);background:var(--card);cursor:pointer}
  .pill.live{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
  .pill select{border:none;background:transparent;color:inherit;font-size:12px;outline:none;max-width:160px}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
  .content{padding:26px;display:none}
  .content.show{display:block}
  .page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:4px}
  .page-h h1{font-size:26px;margin:0;letter-spacing:-.4px}
  .page-h .en{color:var(--ink3);font-size:16px;font-weight:500}
  .roles{font-size:13px;color:var(--ink3);margin-bottom:20px}
  .roles b{color:var(--accent)}
  .grid{display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;
    display:flex;align-items:center;gap:8px}
  .card h3 .en{color:var(--ink3);font-weight:400;font-size:13px}
  .card h3 .r{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:400}
  .card .body{padding:18px}
  .card .body.tight{padding:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
  th{color:var(--ink3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;
    background:color-mix(in srgb,var(--bg) 55%,transparent);position:sticky;top:0}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:none}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
  .t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
  .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--accent-soft);color:var(--accent)}
  .t-gold{background:var(--gold-soft);color:var(--gold)} .t-mute{background:color-mix(in srgb,var(--ink3) 15%,transparent);color:var(--ink2)}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:10px 15px;
    border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent2);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn.ok:hover{filter:brightness(.94);color:#fff}
  .btn.bad{background:var(--bad);border-color:var(--bad);color:#fff} .btn.bad:hover{filter:brightness(.94);color:#fff}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff} .btn.gold:hover{filter:brightness(.94);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .kpi{display:flex;flex-direction:column;gap:3px}
  .kpi .n{font-size:32px;font-weight:700;letter-spacing:-.5px}
  .kpi .l{font-size:13px;color:var(--ink3)}
  .muted{color:var(--ink3)} .small{font-size:13px}
  .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:5px;background:var(--accent)}
  .chip{font-size:11px;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--bg) 60%,transparent);
    border:1px solid var(--line);color:var(--ink2)}
  .divide{height:1px;background:var(--line);margin:14px 0}
  .flow{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .step{flex:1;min-width:92px;text-align:center;padding:10px 6px;border-radius:9px;font-size:11.5px;
    border:1px solid var(--line);background:var(--card);position:relative}
  .step.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
  .step.now{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow)}
  .step .s{display:block;font-size:15px;margin-bottom:2px}
  .arrow{color:var(--ink3);padding:0 4px;font-size:13px}
  .list{display:flex;flex-direction:column}
  .li{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
  .li:last-child{border-bottom:none}
  .li .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 28px;font-size:13px}
  .li .tx{flex:1;min-width:0}
  .li .tx b{font-size:13.5px;font-weight:600} .li .tx div{font-size:12.5px;color:var(--ink3)}
  .li .when{font-size:12px;color:var(--ink3);white-space:nowrap}
  .pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;border-top:1px solid var(--line)}
  .pager .btn{padding:8px 14px}
  .two{grid-template-columns:1fr 1fr}
  .side{grid-template-columns:1.55fr 1fr}
  .side-r{grid-template-columns:1fr 1.55fr}
  .three{grid-template-columns:1fr 1fr 1fr}
  .four{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1080px){.two,.side,.side-r,.three,.four{grid-template-columns:1fr}}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:4px}
  .field .v{border:1px solid var(--line2);border-radius:8px;padding:8px 11px;background:var(--card);font-size:13px}
  input.v,select.v{width:100%;font-family:inherit}
  .radioset{display:flex;gap:8px}
  .radioset .opt{flex:1;border:1.5px solid var(--line2);border-radius:9px;padding:10px;font-size:12px;cursor:pointer}
  .radioset .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .radioset .opt b{display:block;font-size:12.5px}
  .radioset .opt span{color:var(--ink3);font-size:11px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .mapwrap{position:relative;height:300px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(circle at 40% 55%,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--accent-soft))}
  .mapbubble{transition:.12s}
  .mapbubble:hover{filter:brightness(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);z-index:2}
  .stagebars{display:flex;flex-direction:column;gap:12px}
  .sb{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:10px;font-size:12px}
  .sb .bar{margin:0}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .thumb{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);background:
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card));
    display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--ink2)}
  .check{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .check:last-child{border:none}
  .cbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);flex:0 0 17px;display:grid;place-items:center;font-size:11px}
  .cbox.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .cbox.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .chatlog{display:flex;flex-direction:column;gap:10px;padding:4px 2px;max-height:360px;overflow:auto}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.a cite{display:block;margin-top:6px;font-size:10.5px;color:var(--accent);font-style:normal}
  .inputbar{display:flex;gap:8px;margin-top:12px}
  .inputbar .box{flex:1;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .cert{border:2px solid var(--gold);border-radius:14px;padding:22px;text-align:center;
    background:linear-gradient(180deg,var(--gold-soft),var(--card))}
  .cert .seal{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;
    background:radial-gradient(circle at 50% 40%,var(--gold),#7c3f06);color:#fff;display:grid;place-items:center;font-size:24px}
  .cert h2{margin:2px 0;font-size:17px;color:var(--gold)}
  .cert .no{font-family:ui-monospace,monospace;font-size:12px;color:var(--ink2);margin-top:8px}
  .banner{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:500}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.info{background:var(--accent-soft);color:var(--accent)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  .banner.ok{background:var(--ok-soft);color:var(--ok)}
  .committee{display:flex;flex-direction:column;gap:9px}
  .mem{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
  .scorebox{display:flex;align-items:baseline;gap:6px}
  .scorebox .big{font-size:30px;font-weight:700}
  .scope-pill{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:4px 11px;align-self:center}
  .ro-badge{font-size:10px;font-weight:700;color:var(--ink3);background:color-mix(in srgb,var(--ink3) 16%,transparent);
    border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
  .clickable{cursor:pointer;transition:.12s}
  tr.clickable:hover{background:var(--accent-soft)}
  .card.clickable:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(37,99,235,.15);transform:translateY(-1px)}
  .go-arrow{opacity:0;color:var(--accent);font-weight:700;transition:.12s;margin-left:2px}
  .clickable:hover .go-arrow,tr.clickable:hover .go-arrow{opacity:1}
  .chipbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px}
  .fchip b{cursor:pointer;font-size:13px;opacity:.7;line-height:1}
  .fchip b:hover{opacity:1}
  .fchip.clear{background:transparent;border:1px solid var(--line2);color:var(--ink2);cursor:pointer}
  .detail-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .dt-title h1{margin:0;font-size:20px;letter-spacing:-.3px}
  .dt-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink2)}
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .tabbtn{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink3);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn:hover{color:var(--ink)}
  .tabbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .kv:last-child{border:none}.kv span{color:var(--ink3)}
  .filegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:760px){.filegrid{grid-template-columns:1fr}}
  .filecard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;transition:.12s}
  .filecard:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .fico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
  .fmeta b{font-size:12.5px;display:block}
  html[data-lang="ko"] .en{display:none !important}
  #loginView{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--shell),#1e3a8a)}
  .loginbox{width:min(520px,94vw);background:var(--card);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:44px 42px}
  .loginbox h1{font-size:34px;margin:0 0 6px;letter-spacing:-.5px}
  .loginbox .sub{color:var(--ink3);font-size:15px;margin-bottom:26px}
  .loginbox input{width:100%;border:1.5px solid var(--line2);border-radius:11px;padding:15px 16px;font-size:16px;margin-bottom:13px;font-family:inherit;background:var(--card);color:var(--ink)}
  .loginbox input:focus{outline:none;border-color:var(--accent)}
  .loginbox>button[type="submit"]{font-size:16px;padding:15px !important;border-radius:11px}
  .loginbox .demo{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);line-height:1.7}
  .loginbox .demo>b{color:var(--ink2);font-size:13px}
  .demogrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .demogrid .btn{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;font-size:14px}
  .demogrid .btn span{font-size:11.5px;color:var(--ink3);font-weight:400;font-family:ui-monospace,monospace}
  .loginbox .demo + div a,.registerback a{font-size:14px !important}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--shell);color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.2s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView">
  <form class="loginbox" id="loginForm" onsubmit="doLogin(event)">
    <h1>GL-HAC AI</h1>
    <div class="sub">할랄·샤리아 인증 플랫폼 · Halal Certification</div>
    <input id="loginUser" placeholder="아이디 · Username" autocomplete="username" autofocus>
    <input id="loginPass" type="password" placeholder="비밀번호 · Password" autocomplete="current-password">
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" type="submit">로그인 · Sign in</button>
    <div class="demo">
      <b>데모 계정 · demo — 클릭하여 로그인</b>
      <div class="demogrid">
        <button type="button" class="btn" onclick="quickLogin('applicant1','pw')">🏢 클라이언트<span>applicant1</span></button>
        <button type="button" class="btn" onclick="quickLogin('consultant1','pw')">💼 컨설턴트<span>consultant1</span></button>
        <button type="button" class="btn" onclick="quickLogin('auditor1','pw')">🏭 오디터<span>auditor1</span></button>
        <button type="button" class="btn" onclick="quickLogin('fatwa1','pw')">⚖️ 샤리아<span>fatwa1</span></button>
        <button type="button" class="btn" onclick="quickLogin('operator1','pw')">👑 최고운영자<span>operator1</span></button>
        <button type="button" class="btn" onclick="quickLogin('admin','admin')">⚙️ ITO 관리자<span>admin</span></button>
      </div>
    </div>
    <div style="margin-top:12px;font-size:12px;text-align:center"><a onclick="showRegister(true)" style="color:var(--accent);cursor:pointer">회원가입 · Register →</a></div>
  </form>
  <form class="loginbox" id="registerForm" style="display:none" onsubmit="doRegister(event)">
    <h1>회원가입 · Register</h1>
    <div class="sub">신청기업 계정 생성 · Applicant sign-up</div>
    <input id="regUser" placeholder="아이디 · Username" autocomplete="username">
    <input id="regPass" type="password" placeholder="비밀번호 · Password" autocomplete="new-password">
    <input id="regCompany" placeholder="기업명 · Company (선택)">
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" type="submit">가입 · Sign up</button>
    <div style="margin-top:12px;font-size:12px;text-align:center"><a onclick="showRegister(false)" style="color:var(--accent);cursor:pointer">← 로그인으로 · Back to login</a></div>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div class="app" id="appView" style="display:none">
  <aside>
    <div class="brand"><b>GL-HAC AI</b><small>할랄·샤리아 인증 · Halal Certification</small></div>
    <nav id="nav"></nav>
    <div class="navfoot" id="navfoot"></div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"><b>대시보드</b> · Dashboard</div>
      <div class="spacer"></div>
      <span class="pill" id="casePill" style="display:none">📁 <select id="caseSel" onchange="onCaseChange(this.value)"></select></span>
      <span class="pill" id="userPill">👤 —</span>
      <span class="pill" onclick="cycleLang()" id="langPill">🌐 KO · EN · ID</span>
      <span class="pill" onclick="toggleTheme()" id="themePill">🌙 다크</span>
      <span class="pill" onclick="logout()">⏻ 로그아웃</span>
    </div>
    <div id="pages"></div>
  </main>
</div>
<div id="toast"></div>

<script>

/* ---- auth / api ---- */
const TK="glhac_token";
function token(){try{return localStorage.getItem(TK)||""}catch(_){return""}}
async function API(path, opt){
  opt=opt||{};
  opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{},
    token()?{Authorization:"Bearer "+token()}:{});
  const r=await fetch(path,opt);
  if(r.status===401){logout();throw {code:"UNAUTH"};}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw ((j&&j.detail)?j.detail:j);
  return j;
}
async function doLogin(e){
  if(e) e.preventDefault();
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  if(!u||!p){toast("아이디·비밀번호를 입력하세요");return;}
  try{
    const j=await API("/auth/login",{method:"POST",body:JSON.stringify({username:u,password:p})});
    localStorage.setItem(TK,j.token);
    localStorage.setItem("glhac_role",j.role);
    localStorage.setItem("glhac_org",j.org_id||"");
    localStorage.setItem("glhac_user",j.username||u);
    boot();
  }catch(err){toast("로그인 실패 · "+(err&&err.code?err.code:"확인 필요"));}
}
function logout(){
  ["glhac_token","glhac_role","glhac_org","glhac_user","glhac_case"].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}} );
  document.getElementById("appView").style.display="none";
  document.getElementById("loginView").style.display="grid";
}
function showRegister(on){document.getElementById("loginForm").style.display=on?"none":"";document.getElementById("registerForm").style.display=on?"":"none";}
function quickLogin(u,p){document.getElementById("loginUser").value=u;document.getElementById("loginPass").value=p;doLogin();}
async function doRegister(e){
  if(e)e.preventDefault();
  const username=v("regUser"),password=v("regPass"),company_name=v("regCompany");
  if(!username||!password){toast("아이디·비밀번호를 입력하세요");return;}
  try{
    const j=await API("/auth/register",{method:"POST",body:JSON.stringify({username,password,company_name})});
    localStorage.setItem(TK,j.token);localStorage.setItem("glhac_role",j.role);
    localStorage.setItem("glhac_org",j.org_id||"");localStorage.setItem("glhac_user",j.username||username);
    toast("가입 완료 · 로그인됨");boot();
  }catch(err){toast("가입 실패 · "+(err&&err.code?err.code:"중복 아이디?"));}
}

/* ---- helpers ---- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tag(t,txt){return `<span class="tag t-${t}">${esc(txt)}</span>`;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
function short(id){return id?String(id).slice(0,13):"—";}
function fmtIDR(n){if(n==null)return"—";return"Rp "+Number(n).toLocaleString("id-ID");}
function statusColor(s){s=String(s||"");
  if(/issued|approved|closed|complete|paid/i.test(s))return"ok";
  if(/corrective|reject|haram|nonconform|blocked|fail|bad/i.test(s))return"bad";
  if(/review|progress|in_|requested|scheduled|pending|mushbooh|warn/i.test(s))return"info";
  return"mute";}
async function loadCases(force){
  if(CASES_CACHE.length && !force) return CASES_CACHE;
  CASES_CACHE=await API("/cases").catch(()=>[]);
  return CASES_CACHE;
}
function curCaseObj(){return CASES_CACHE.find(c=>c.case_id===CURCASE)||null;}

/* ---- pagination ---- */
let PAGES={};
function pageSlice(key,arr,per){per=per||10;const max=Math.max(0,Math.ceil(arr.length/per)-1);const cur=Math.min(PAGES[key]||0,max);PAGES[key]=cur;return {items:arr.slice(cur*per,cur*per+per),cur,max,total:arr.length,per};}
function pager(key,m){if(m.total<=m.per)return"";return `<div class="pager">
  <button class="btn" ${m.cur<=0?'disabled':''} onclick="gotoPage('${key}',${m.cur-1})">← 이전</button>
  <span class="muted small">${m.cur+1} / ${m.max+1} 페이지 · 총 ${m.total}건</span>
  <button class="btn" ${m.cur>=m.max?'disabled':''} onclick="gotoPage('${key}',${m.cur+1})">다음 →</button></div>`;}
function gotoPage(key,idx){PAGES[key]=Math.max(0,idx);applyView();}

/* ---- 지역(주소 파싱) : 케이스 factory_address/address → 인니 province ---- */
/* [province, x%, y%, [aliases(도시 등)]] — 스타일라이즈드 인니 지도 좌표 */
const PROVINCES=[
  ["Aceh",8,20,[]],["Sumatera Utara",12,27,["medan"]],["Riau",17,35,["pekanbaru"]],
  ["Sumatera Barat",13,40,["padang"]],["Sumatera Selatan",21,50,["palembang"]],
  ["Lampung",24,58,["bandar lampung"]],["Banten",27,63,["serang","tangerang"]],
  ["DKI Jakarta",29,64,["jakarta"]],["Jawa Barat",31,67,["bandung","bekasi","bogor","depok"]],
  ["Jawa Tengah",35,70,["semarang","solo","surakarta"]],["DI Yogyakarta",36,73,["yogyakarta","jogja"]],
  ["Jawa Timur",40,70,["surabaya","malang"]],["Bali",47,74,["denpasar"]],
  ["Nusa Tenggara Barat",51,76,["mataram","lombok"]],["Nusa Tenggara Timur",57,78,["kupang"]],
  ["Kalimantan Barat",40,42,["pontianak"]],["Kalimantan Tengah",46,48,["palangkaraya"]],
  ["Kalimantan Selatan",50,53,["banjarmasin"]],["Kalimantan Timur",53,40,["samarinda","balikpapan"]],
  ["Sulawesi Selatan",60,58,["makassar"]],["Sulawesi Tengah",62,48,["palu"]],
  ["Sulawesi Utara",67,38,["manado"]],["Maluku",75,52,["ambon"]],
  ["Papua Barat",82,48,["manokwari"]],["Papua",89,52,["jayapura"]],
];
let REGION_CACHE={};
function matchProvince(addr){
  if(!addr) return null;
  const a=String(addr).toLowerCase();
  for(const [name,,,aliases] of PROVINCES){
    if(a.includes(name.toLowerCase())) return name;
    for(const al of aliases) if(a.includes(al)) return name;
  }
  return null;
}
async function ensureRegions(cases){
  const need=cases.filter(c=>!(c.case_id in REGION_CACHE)).slice(0,60);
  if(need.length){
    const ds=await Promise.all(need.map(c=>API(`/cases/${c.case_id}`).catch(()=>null)));
    ds.forEach((d,i)=>{REGION_CACHE[need[i].case_id]=d?(matchProvince(d.factory_address||d.address)||"미지정"):"미지정";});
  }
}

/* ---- current-case selector (topbar) ---- */
async function refreshCaseSel(){
  const pill=document.getElementById("casePill");
  const sel=document.getElementById("caseSel");
  const cases=await loadCases();
  if(CASE_SCOPED.has(CUR) && cases.length){
    if(!CURCASE || !cases.find(c=>c.case_id===CURCASE)){
      const saved=(()=>{try{return localStorage.getItem("glhac_case")}catch(_){return null}})();
      CURCASE=(saved&&cases.find(c=>c.case_id===saved))?saved:cases[0].case_id;
    }
    sel.innerHTML=cases.map(c=>`<option value="${c.case_id}"${c.case_id===CURCASE?" selected":""}>${esc(c.company_name||short(c.case_id))}</option>`).join("");
    pill.style.display="";
  }else{
    pill.style.display="none";
  }
}

/* ---- nav / router ---- */
function scopeLabel(){const m={own:"본인 조직 · own",owned:"담당 위주 · owned",assigned:"배정건 · assigned",all:"전체 · all"};return m[ROLE_DEF[ROLE].scope];}
function buildNav(){
  const nav=document.getElementById("nav");
  const allowed=NAV.filter(([id])=>MENU_ACCESS[id].includes(ROLE));
  nav.innerHTML=allowed.map(([id,ic,ko,en])=>
    `<a data-id="${id}" onclick="go('${id}')"><span>${ic}</span><span>${ko}</span><span class="en">${en}</span></a>`).join("");
  document.getElementById("navfoot").innerHTML=
    `노출 메뉴 ${allowed.length} / 15<br><span style="color:#64748B">scope · ${scopeLabel()}</span>`;
}
function go(id){navigate({screen:id});}
function navigate(state, replace){
  if(state.screen){
    if(!MENU_ACCESS[state.screen] || !MENU_ACCESS[state.screen].includes(ROLE))
      state.screen=NAV.find(([x])=>MENU_ACCESS[x].includes(ROLE))[0];
    DETAIL=null; CUR=state.screen; FILTERS=state.filters||{}; PAGES={};
  }
  if(state.detail){DETAIL={id:state.detail, tab:state.tab||"overview"};}
  const url=buildHash();
  try{replace?history.replaceState(snapshot(),"",url):history.pushState(snapshot(),"",url);}catch(_){}
  applyView();
}
function snapshot(){return {screen:CUR,filters:{...FILTERS},detail:DETAIL?DETAIL.id:null,tab:DETAIL?DETAIL.tab:null};}
function buildHash(){
  if(DETAIL){const q=DETAIL.tab&&DETAIL.tab!=="overview"?`?tab=${DETAIL.tab}`:"";return `#/case/${DETAIL.id}${q}`;}
  const q=Object.keys(FILTERS).length?"?"+new URLSearchParams(FILTERS).toString():"";
  return `#/${CUR}${q}`;
}
window.addEventListener("popstate",e=>{
  const s=e.state;
  if(!s){CUR="dashboard";FILTERS={};DETAIL=null;applyView();return;}
  CUR=s.screen||"dashboard";FILTERS=s.filters||{};
  DETAIL=s.detail?{id:s.detail,tab:s.tab||"overview"}:null;
  applyView();
});
function pageHead(id){
  const n=NAV.find(x=>x[0]===id);
  const roleNames=MENU_ACCESS[id].map(r=>ROLE_DEF[r].ko).join(" · ");
  return `<div class="page-h"><span style="font-size:22px">${n[1]}</span>
    <h1>${n[2]}</h1><span class="en">· ${n[3]}</span>
    <span class="scope-pill">👁 ${scopeLabel()}</span></div>
    <div class="roles">노출 역할 · Roles &nbsp;<b>${roleNames}</b></div>`;
}
async function applyView(){
  const pages=document.getElementById("pages");
  await refreshCaseSel();
  if(DETAIL){
    document.querySelectorAll("#nav a").forEach(a=>a.classList.remove("active"));
    document.getElementById("crumb").innerHTML=`<a onclick="navigate({screen:'caseList'})" style="cursor:pointer;color:var(--accent)">케이스</a> · <b>${esc(DETAIL.id)}</b>`;
    pages.innerHTML=`<div class="content show" id="pgHost"><div class="card"><div class="body muted">불러오는 중…</div></div></div>`;
    try{document.getElementById("pgHost").innerHTML=await renderCaseDetail(DETAIL.id,DETAIL.tab);}
    catch(err){document.getElementById("pgHost").innerHTML=errCard(err);}
    window.scrollTo(0,0);return;
  }
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.id===CUR));
  const n=NAV.find(x=>x[0]===CUR);
  document.getElementById("crumb").innerHTML=`<b>${n[2]}</b> · ${n[3]}`;
  pages.innerHTML=`<div class="content show" id="pgHost">${pageHead(CUR)}<div class="card"><div class="body muted">불러오는 중… · loading</div></div></div>`;
  const host=document.getElementById("pgHost");
  try{
    if(CASE_SCOPED.has(CUR) && !CURCASE){
      host.innerHTML=pageHead(CUR)+`<div class="card"><div class="body muted">표시할 케이스가 없습니다. <a onclick="go('caseList')" style="color:var(--accent);cursor:pointer">케이스 목록</a>에서 선택하거나 새 신청을 생성하세요.</div></div>`;
    }else{
      const inner=await (SCREEN[CUR]?SCREEN[CUR]():Promise.resolve('<div class="card"><div class="body muted">준비 중</div></div>'));
      host.innerHTML=pageHead(CUR)+inner;
    }
  }catch(err){host.innerHTML=pageHead(CUR)+errCard(err);}
  window.scrollTo(0,0);
}
function errCard(err){
  const code=(err&&(err.code||err.detail))||(typeof err==="string"?err:"오류");
  return `<div class="card"><div class="body"><div class="banner bad">⛔ 데이터를 불러오지 못했습니다 · ${esc(typeof code==="object"?JSON.stringify(code):code)}</div></div></div>`;
}

/* ======================= SCREEN RENDERERS (live) ======================= */
const SCREEN={};

/* 1) Dashboard */
SCREEN.dashboard=async()=>{
  const cases=await loadCases(true);
  const total=cases.length;
  const issued=cases.filter(c=>/issued|approved|certificate/i.test(c.status)).length;
  const action=cases.filter(c=>/corrective|requested|reject|blocked/i.test(c.status)).length;
  const progress=cases.filter(c=>!/issued|approved|certificate/i.test(c.status)).length;
  const kpis=[["즉시 처리 · Action",action,"warn",{filter:"action"}],
    ["진행 중 · In progress",progress,"info",{filter:"progress"}],
    ["발급 · Issued",issued,"ok",{filter:"issued"}],
    ["전체 케이스 · Total",total,"mute",null]];
  const buckets={};
  cases.forEach(c=>{const k=c.status||"unknown";buckets[k]=(buckets[k]||0)+1;});
  const maxb=Math.max(1,...Object.values(buckets));
  const stageBars=Object.entries(buckets).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>
    `<div class="sb clickable" onclick="filterList('status','${esc(k)}')" title="${esc(k)} 필터">
      <span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/maxb*100)}%;background:var(--${statusColor(k)==='mute'?'ink3':statusColor(k)})"></i></div><b>${v}</b></div>`).join("")
    || '<div class="muted small">케이스 없음</div>';
  let events=[];
  if(ROLE==="admin"){try{const a=await API("/admin/audit");events=(a.events||a||[]).slice(0,6);}catch(_){}}
  else{
    try{const recent=cases.slice(0,5);
      const tls=await Promise.all(recent.map(c=>API(`/cases/${c.case_id}/timeline`).catch(()=>null)));
      tls.forEach((tl,i)=>{if(tl&&tl.events)tl.events.slice(-3).forEach(e=>events.push(Object.assign({},e,{case_id:recent[i].case_id})));});
      events=events.slice(-6).reverse();
    }catch(_){}
  }
  const evHtml=events.length?events.map(e=>{
    const cid=e.case_id||e.case||"";
    return `<div class="li ${cid?'clickable':''}" ${cid?`onclick="openCase('${esc(cid)}')"`:''}>
      <div class="ic t-${statusColor(e.to||e.action)}">•</div>
      <div class="tx"><b>${esc((e.action||"event"))} ${cid?'· '+short(cid):''}</b><div>${esc(e.actor||e.actor_type||"")} ${e.to?'→ '+esc(e.to):''}</div></div>
      <div class="when">${esc((e.hash||"").slice(0,10))}</div></div>`;}).join("")
    : '<div class="li"><div class="tx muted small">최근 이벤트 없음</div></div>';
  // 지역별 등록현황 (주소 파싱)
  await ensureRegions(cases);
  const rc={};let unassigned=0;
  cases.forEach(c=>{const p=REGION_CACHE[c.case_id];if(!p||p==="미지정")unassigned++;else rc[p]=(rc[p]||0)+1;});
  const maxc=Math.max(1,...Object.values(rc));
  const bubbles=PROVINCES.filter(([n])=>rc[n]).map(([n,x,y])=>{
    const val=rc[n];const col=val>=maxc*0.66?'#16A34A':val>=maxc*0.33?'#2563EB':'#D97706';const r=11+Math.sqrt(val)*5;
    return `<div class="mapbubble" title="${esc(n)}: ${val}건 · 클릭하여 조회" onclick="filterList('region','${esc(n)}')"
      style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:${r*2}px;height:${r*2}px;border-radius:50%;background:${col}33;border:2px solid ${col};display:grid;place-items:center;cursor:pointer;font-size:12px;font-weight:700;color:${col}">${val}</div>`;}).join("");
  const mapped=Object.values(rc).reduce((a,b)=>a+b,0);
  // 알림·공지 (실데이터 — 상태 기반)
  const alerts=[];
  cases.forEach(c=>{const s=c.status||"";const nm=c.company_name||short(c.case_id);
    if(/corrective/i.test(s))alerts.push(["bad","⛔",`${nm} — 시정조치 필요`,c.case_id]);
    else if(/reject/i.test(s))alerts.push(["bad","⛔",`${nm} — 반려 처리됨`,c.case_id]);
    else if(/requested|scheduled|in_review/i.test(s))alerts.push(["info","ℹ",`${nm} — ${s}`,c.case_id]);});
  const notif=alerts.slice(0,6);
  return `
  <div class="grid four" style="margin-bottom:16px">
    ${kpis.map(([l,n,t,f])=>`<div class="card ${f?'clickable':''}" ${f?`onclick="filterList('${Object.keys(f)[0]}','${Object.values(f)[0]}')"`:''}>

SCREEN.caseList=async()=>{
  let cases=await loadCases(true);
  const f=FILTERS.filter;
  if(f==="issued")cases=cases.filter(c=>/issued|approved|certificate/i.test(c.status));
  else if(f==="action")cases=cases.filter(c=>/corrective|requested|reject|blocked/i.test(c.status));
  else if(f==="progress")cases=cases.filter(c=>!/issued|approved|certificate/i.test(c.status));
  if(FILTERS.status)cases=cases.filter(c=>c.status===FILTERS.status);
  if(FILTERS.q){const q=FILTERS.q.toLowerCase();cases=cases.filter(c=>(c.company_name||"").toLowerCase().includes(q)||c.case_id.toLowerCase().includes(q));}
  if(FILTERS.region){await ensureRegions(cases);cases=cases.filter(c=>REGION_CACHE[c.case_id]===FILTERS.region);}
  const pg=pageSlice("caseList",cases,10);
  const rows=pg.items.length?pg.items.map(c=>`<tr class="clickable" onclick="openCase('${c.case_id}')">
      <td style="font-family:ui-monospace,monospace;font-size:12px">${short(c.case_id)} <span class="go-arrow">→</span></td>
      <td><b>${esc(c.company_name||"—")}</b></td>
      <td>${tag(c.pathway==="self_declare"?"info":"mute",c.pathway||"—")}</td>
      <td>${tag(statusColor(c.status),c.status||"—")}</td></tr>`).join("")
    : `<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">조건에 맞는 케이스 없음 · No cases</td></tr>`;
  const canNew=["client","consultant","admin"].includes(ROLE);
  return `${filterChips()}
  <div class="card"><h3>케이스 테이블 <span class="en">· Case table</span><span class="r">row 클릭 → 상세</span></h3>
    <div class="body tight"><table>
      <thead><tr><th>번호 · ID</th><th>기업 · Company</th><th>경로</th><th>상태 · Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${pager("caseList",pg)}
    <div class="body btnrow" style="border-top:1px solid var(--line)">
      ${canNew?'<button class="btn pri" onclick="newCase()">＋ 새 신청 · New</button>':''}
      <button class="btn" onclick="exportCasesCsv()">⬇ CSV</button>
      <span class="chip" style="margin-left:auto">노출 ${cases.length}건 · scope: ${scopeLabel()}</span>
    </div></div>`;
};

function exportCasesCsv(){
  const rows=[["case_id","company_name","pathway","status"]].concat(CASES_CACHE.map(c=>[c.case_id,c.company_name,c.pathway,c.status]));

SCREEN.evaluation=async()=>{
  const id=CURCASE;
  const [h,sev]=await Promise.all([API(`/cases/${id}/hpas-auto`).catch(()=>({elements:[]})),API(`/cases/${id}/sjph-evidence`).catch(()=>({items:[]}))]);
  const els=h.elements||[];
  const canSev=["client","consultant","admin"].includes(ROLE);
  const sevHtml=(sev.items||[]).map(it=>`<div class="check">
      <div class="cbox ${it.uploaded?'on':''}">${it.uploaded?'✓':''}</div>
      <b style="flex:1">${esc(it.label)}</b>
      ${it.uploaded?`<button class="btn" style="padding:3px 8px;font-size:11px" onclick="viewDoc('${it.document_id}')">보기</button>`:(canSev?`<button class="btn" style="padding:3px 8px;font-size:11px" onclick="uploadSjphEvidence('${id}','${it.item_key}')">업로드</button>`:'<span class="muted small">미제출</span>')}
    </div>`).join("")||'<div class="muted small">증빙 항목 없음</div>';
  const rows=els.map(e=>`<tr><td><b>${esc(e.label||e.element)}</b><div class="muted small">${esc(e.reason||"")}</div></td>
      <td>${tag(e.status==="ok"?"ok":"warn",e.status==="ok"?"양호":"보완")}</td></tr>`).join("")||`<tr><td colspan="2" class="muted" style="text-align:center;padding:18px">평가 항목 없음</td></tr>`;
  const okc=els.filter(e=>e.status==="ok").length;
  return `
  <div class="grid side">
    <div class="card"><h3>HPAS 자동 평가 <span class="en">· HPAS auto</span><span class="r">${okc}/${els.length} 양호</span></h3>
      <div class="body tight"><table><thead><tr><th>평가 항목 · Item</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h3>파트와 상정 준비 <span class="en">· To Fatwa</span></h3>
      <div class="body">
        <div class="scorebox" style="margin-bottom:14px"><span class="big" style="color:var(--ok)">${okc}</span><span class="muted">/ ${els.length} 요소 충족</span></div>
        <div class="banner ${okc===els.length&&els.length?'ok':'info'}" style="margin-bottom:12px">${okc===els.length&&els.length?'✓ 상정 기준 충족':'ℹ 보완 항목 확인'}</div>
        <button class="btn gold" onclick="go('fatwa')">파트와 화면으로 · To Fatwa →</button></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>SJPH 증빙 <span class="en">· Evidence</span><span class="r">${sev.uploaded||0}/${sev.total||0} · ${sev.completion||0}%</span></h3>
    <div class="body">${sevHtml}</div></div>`;
};
async function uploadSjphEvidence(cid,key){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*,.pdf";
  inp.onchange=async()=>{const file=inp.files[0];if(!file)return;const b64=await fileB64(file);
    try{await API(`/cases/${cid}/sjph-evidence`,{method:"POST",body:JSON.stringify({item_key:key,file_b64:b64,filename:file.name})});toast("증빙 업로드");applyView();}catch(e){toast("업로드 실패 · "+(e&&e.code?e.code:""));}};
  inp.click();
}
async function postDiscussion(id){const el=document.getElementById("discInput");const text=el.value.trim();if(!text)return;try{await API(`/cases/${id}/discussions`,{method:"POST",body:JSON.stringify({kind:"comment",text})});toast("협의 등록");applyView();}catch(e){toast("등록 실패 · "+(e&&e.code?e.code:""));}}

  const ipg=pageSlice("invoice",inv,10);
  const sel=inv.find(i=>i.invoice_id===INV_SEL)||inv[0]||null;
  const rows=ipg.items.length?ipg.items.map(i=>`<tr class="clickable${sel&&i.invoice_id===sel.invoice_id?' ':' '}" onclick="selectInvoice('${i.invoice_id}')">
      <td style="font-family:ui-monospace,monospace;font-size:12px">${esc(i.invoice_no||short(i.invoice_id))}</td>
      <td class="muted">${esc(i.service_type||"")}</td><td><b>${fmtIDR(i.total==null?i.amount:i.total)}</b></td>

    :`<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">청구서 없음</td></tr>`;
  const canCreate=["consultant","ops","admin"].includes(ROLE);
  const detail=sel?`
      <div class="field"><label>청구번호 · No</label><div class="v">${esc(sel.invoice_no||short(sel.invoice_id))}</div></div>
      <div class="field"><label>서비스 · Service</label><div class="v">${esc(sel.service_type||"—")}</div></div>
      <table style="margin:6px 0"><tbody>
        <tr><td>금액 · DPP</td><td style="text-align:right">${fmtIDR(sel.amount)}</td></tr>
        <tr><td>부가세 · PPN</td><td style="text-align:right">${fmtIDR(sel.ppn)}</td></tr>
        <tr style="background:var(--accent-soft)"><td><b>합계 · Total</b></td><td style="text-align:right"><b>${fmtIDR(sel.total==null?sel.amount:sel.total)}</b></td></tr>
      </tbody></table>
      <div class="field"><label>상태 · Status</label><div>${tag(statusColor(sel.status),sel.status||"—")}</div></div>
      ${(canMark&&sel.status!=='paid')?`<button class="btn ok" onclick="payInvoice('${sel.invoice_id}')">결제 표시 · Mark paid</button>`:''}`
    :'<div class="muted small">청구서를 선택하세요.</div>';
  return `
  <div class="grid side">
    <div class="card"><h3>청구서 목록 <span class="en">· Invoices</span><span class="r">${inv.length}건 · row 클릭 → 상세</span></h3>
      <div class="body tight"><table><thead><tr><th>청구번호</th><th>서비스</th><th>금액 · IDR</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${pager("invoice",ipg)}
      <div class="body btnrow" style="border-top:1px solid var(--line)">
        ${canCreate?`<button class="btn pri" onclick="createInvoice('${id}')">청구 생성 · Create</button>`:'<span class="chip">🔒 청구 생성 권한 없음</span>'}</div></div>
    <div class="card"><h3>인보이스 상세 <span class="en">· Detail</span></h3>

  </div>`;
};
function selectInvoice(iid){INV_SEL=iid;applyView();}
async function payInvoice(iid){try{await API(`/invoices/${iid}/pay`,{method:"PATCH",body:"{}"});toast("결제 표시");applyView();}catch(e){toast("실패 · "+(e&&e.code?e.code:""));}}
async function createInvoice(id){
  const service_type=prompt("서비스 유형 · service","certification");if(service_type===null)return;
  const amount=Number(prompt("금액(IDR) · amount","4500000"))||0;
  try{await API(`/cases/${id}/invoices`,{method:"POST",body:JSON.stringify({service_type,amount})});toast("청구 생성");applyView();}
  catch(e){toast("생성 실패 · "+(e&&e.code?e.code:""));}
}

  <div class="grid side">
    <div class="card"><h3>파트와 위원회 심의 <span class="en">· Committee</span><span class="r">${esc(fd.decision||"pending")}</span></h3>

        <div class="field"><label>심의 요지 · Note</label><div class="v small">${esc(fd.committee_note||"—")}</div></div>
        <div class="field"><label>위원장 · Head</label><div class="v small">${esc(fd.committee_head||"—")} / 간사 ${esc(fd.committee_secretary||"—")}</div></div>
        <div class="divide"></div>
        <div style="font-size:12.5px;margin-bottom:8px"><b>결정 · Decision</b> ${canDecide?"":'<span class="chip">🔒 샤리아·최고운영자만</span>'}</div>
        ${canDecide?`<div class="btnrow"><button class="btn ok" onclick="fatwaDecide('${id}','approved')">승인</button>

async function fatwaDoc(id){try{await API(`/cases/${id}/fatwa/document`,{method:"POST",body:"{}"});toast("결정문 생성");applyView();}catch(e){toast("생성 실패 · "+(e&&e.code?e.code:""));}}

SCREEN.certificate=async()=>{
  const id=CURCASE;const c=await API(`/cases/${id}/certificate`).catch(()=>({issued:false}));
  const co=curCaseObj();
  const canIssue=["sharia","ops","admin"].includes(ROLE);
  const certCard=c.issued?`<div class="cert">
      <div class="seal">☪</div>
      <div class="small" style="letter-spacing:2px;color:var(--gold)">SERTIFIKAT HALAL</div>
      <h2>${esc((co&&co.company_name)||"—")}</h2>
      <div class="muted small">${esc(c.scope||"")}</div>
      <div class="divide"></div>
      <div class="small">본 제품은 SJPH 및 샤리아 기준에 따라 <b>할랄(HALAL)</b> 인증되었음을 증명합니다.</div>
      <div class="no">No. ${esc(c.certificate_no||"—")} · Issued ${esc(c.issue_date||"—")} · Valid until ${esc(c.expiry_date||"—")}</div>
    </div>`
    :`<div class="banner info">아직 발급되지 않았습니다 · not issued</div>`;
  return `
  <div class="grid side">
    <div class="card"><h3>할랄 인증서 <span class="en">· Certificate</span><span class="r">${c.issued?'발급됨':'미발급'}</span></h3>
      <div class="body">${certCard}</div></div>
    <div class="card"><h3>발급·사후관리 <span class="en">· Post-cert</span></h3>
      <div class="body">
        <div class="list" style="margin:0 -16px 12px">
          ${[["사후 모니터링","연 1회 정기","info"],["갱신 · Renewal","만료 90일 전","mute"],["변경영향","원료 변경 시 재평가","warn"]]
            .map(([t,s,cl])=>`<div class="li"><div class="ic t-${cl}">🔁</div><div class="tx"><b>${t}</b></div><div class="when">${tag(cl,s)}</div></div>`).join("")}
        </div>
        <div class="btnrow">
          ${canIssue&&!c.issued?`<button class="btn gold" onclick="issueCert('${id}')">인증서 발급 · Issue</button>`:''}
          ${c.issued?`<button class="btn" onclick="changeImpact('${id}')">변경영향 분석</button>`:''}
          ${c.issued&&["client","consultant","admin"].includes(ROLE)?`<button class="btn" onclick="renewCert('${id}')">갱신 · Renew</button>`:''}
          ${c.issued&&["consultant","admin"].includes(ROLE)?`<button class="btn" onclick="unlockCert('${id}')">잠금해제 · Unlock</button>`:''}
          ${!canIssue?'<span class="chip">🔒 발급 — 샤리아·최고운영자</span>':''}</div></div></div>
  </div>`;
};
async function issueCert(id){try{await API(`/cases/${id}/certificate/issue`,{method:"POST",body:"{}"});toast("인증서 발급");await loadCases(true);applyView();}catch(e){toast("발급 실패 · "+(e&&e.code?e.code:JSON.stringify(e)));}}
async function changeImpact(id){
  const ct=prompt("변경 유형 · change_type\n(supplier_changed | material_added | process_changed | material_source_changed)","material_source_changed");

  try{const r=await API(`/cases/${id}/certificate/change-impact`,{method:"POST",body:JSON.stringify({change_type:ct})});toast("변경영향 · "+(r.impact||r.result||r.recommendation||"분석 완료"));}catch(e){toast("분석 실패 · "+(e&&e.code?e.code:""));}}
async function renewCert(id){if(!confirm("인증서를 갱신할까요?"))return;try{await API(`/cases/${id}/renew`,{method:"POST",body:"{}"});toast("갱신 요청");await loadCases(true);applyView();}catch(e){toast("갱신 실패 · "+(e&&e.code?e.code:""));}}
async function unlockCert(id){if(!confirm("scope 잠금을 해제할까요?"))return;try{await API(`/cases/${id}/certificate/unlock`,{method:"POST",body:"{}"});toast("잠금해제");await loadCases(true);applyView();}catch(e){toast("해제 실패 · "+(e&&e.code?e.code:""));}}

    <div class="card"><h3>대화형 어시스턴트 <span class="en">· Chat</span><span class="r">근거 인용</span></h3>

        <div class="chatlog" id="chatlog">${log}</div>

          <button class="btn" onclick="CHAT=[];applyView()">지우기</button></div>
      </div></div>
  </div>`;

async function askQ(id){
  const inp=document.getElementById("askInput");const q=inp.value.trim();if(!q)return;
  CHAT.push({role:"u",text:q});inp.value="";applyView();
  try{const r=await API(`/cases/${id}/ask`,{method:"POST",body:JSON.stringify({question:q})});
    const cites=[];
    (r.domain_sources||[]).forEach(s=>cites.push("도메인:"+(s.name||s.canonical_name||"")));
    (r.long_term_sources||[]).forEach(()=>cites.push("CHU-1"));
    CHAT.push({role:"a",text:r.answer||"(응답 없음)",cite:cites.slice(0,4).join(" · ")});
  }catch(e){CHAT.push({role:"a",text:"오류 · 답변을 생성하지 못했습니다.",cite:""});}
  applyView();
}

};
function roleOpts(sel){const rs=[["applicant","신청기업"],["consultant","컨설턴트"],["auditor","오디터"],["fatwa_liaison","샤리아"],["operator","최고운영자"],["penyelia_halal","할랄감독자"],["pendamping_pph","동반자"],["admin","ITO 관리자"]];return rs.map(([vv,k])=>`<option value="${vv}"${vv===sel?" selected":""}>${k}</option>`).join("");}
async function createUser(){const username=v("nuUser"),password=v("nuPass")||"pw",role=v("nuRole");if(!username){toast("아이디 입력");return}try{await API("/admin/users",{method:"POST",body:JSON.stringify({username,password,role})});toast("사용자 생성 · "+username);applyView();}catch(e){toast("생성 실패 · "+(e&&e.code?e.code:""));}}
async function patchUserRole(uid,role){try{await API(`/admin/users/${uid}`,{method:"PATCH",body:JSON.stringify({role})});toast("역할 변경 · "+role);}catch(e){toast("실패 · "+(e&&e.code?e.code:""));}}
async function delUser(uid){if(!confirm("사용자를 삭제할까요?"))return;try{await API(`/admin/users/${uid}`,{method:"DELETE"});toast("사용자 삭제");applyView();}catch(e){toast("삭제 실패 · "+(e&&e.code?e.code:""));}}
async function createOrg(){const org_id=v("noId"),name=v("noName");if(!org_id){toast("조직 ID 입력");return}try{await API("/admin/orgs",{method:"POST",body:JSON.stringify({org_id,name})});toast("조직 생성 · "+org_id);applyView();}catch(e){toast("생성 실패 · "+(e&&e.code?e.code:""));}}

async function seedReset(){if(!confirm("seed를 초기화할까요? (데모 데이터 재생성)"))return;try{await API("/admin/seed-reset",{method:"POST",body:"{}"});toast("seed 초기화");await loadCases(true);applyView();}catch(e){toast("실패");}}

/* ---- case detail (tabbed, live) ---- */
async function renderCaseDetail(id, tab){
  const c=await API(`/cases/${id}`);
  const tabs=[["overview","개요","Overview"],["materials","원재료","Materials"],["documents","문서","Documents"],["audit","심사","Audit"]];
  const head=`
    <div class="detail-top">
      <button class="btn" onclick="history.back()">← 목록으로 · Back</button>
      <div class="dt-title"><h1>${esc(c.company_name||"—")} <span class="muted" style="font-size:14px;font-weight:500">${short(c.case_id)}</span></h1>
        <div class="dt-sub">${tag(c.pathway==='self_declare'?'info':'mute',c.pathway||'—')} ${tag(statusColor(c.status),c.status||'—')} ${c.scope_frozen?tag('gold','scope 동결'):''}</div></div>
    </div>
    <div class="tabbar">${tabs.map(([t,ko,en])=>`<button class="tabbtn ${t===tab?'on':''}" onclick="openCaseTab('${t}')">${ko} <span class="muted">· ${en}</span></button>`).join("")}</div>`;
  let panel="";
  if(tab==="overview"){
    let w={};try{w=await API(`/cases/${id}/workflow`);}catch(_){}
    let rd={};try{rd=await API(`/cases/${id}/readiness`);}catch(_){}
    let disc=[];try{disc=await API(`/cases/${id}/discussions`);}catch(_){}
    const phases=(w.phases||[]);
    const flow=phases.map((p,i)=>`<div class="step ${p.done?'done':p.current?'now':''}" style="min-width:64px">${esc(p.label||p.state||p.key||"")}</div>${i<phases.length-1?'<span class="arrow">›</span>':''}`).join("")||'<div class="muted small">—</div>';
    panel=`<div class="grid side">
      <div class="card"><h3>진행 상태 <span class="en">· Progress</span></h3>
        <div class="body"><div class="flow" style="margin-bottom:14px">${flow}</div>
          <div class="kv"><span>기업 · Company</span><b>${esc(c.company_name||"—")}</b></div>
          <div class="kv"><span>경로 · Pathway</span><b>${esc(c.pathway||"—")}</b></div>
          <div class="kv"><span>상태 · Status</span><b>${esc(w.state_label||c.status||"—")}</b></div>
          <div class="kv"><span>NIB</span><b>${esc(c.nib||"—")}</b></div>
          <div class="kv"><span>책임자</span><b>${esc(c.responsible_person||"—")}</b></div>
        </div></div>
      <div class="card"><h3>준비도 <span class="en">· Readiness</span></h3>
        <div class="body">
          <div class="scorebox" style="margin-bottom:12px"><span class="big" style="color:var(--${rd.band==='ready'?'ok':rd.band==='warn'?'warn':'bad'})">${rd.readiness==null?"—":rd.readiness}</span><span class="muted">% · ${esc(rd.band||"—")}</span></div>
          ${rd.breakdown?Object.entries(rd.breakdown).map(([k,vv])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(k)}</span><b>${vv}%</b></div><div class="bar"><i style="width:${vv}%"></i></div></div>`).join(""):""}
          <div class="btnrow" style="margin-top:12px">
            <button class="btn" onclick="openCaseTab('materials')">🧪 원재료 →</button>
            <button class="btn" onclick="openCaseTab('documents')">📁 문서 →</button>
            <button class="btn" onclick="openCaseTab('audit')">🏭 심사 →</button></div>
        </div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>협의 · Discussion <span class="en">· thread</span><span class="r">${disc.length}건</span></h3>
      <div class="body">
        <div class="chatlog" style="max-height:240px">${disc.length?disc.map(d=>`<div class="msg a" style="max-width:100%"><b>${esc(d.author||d.author_role||"—")}</b> <span class="muted small">· ${esc(d.kind||"comment")} ${esc((d.created_at||"").slice(0,16))}</span><br>${esc(d.text)}</div>`).join(""):'<div class="muted small">협의 내역 없음</div>'}</div>
        <div class="inputbar"><input class="box" id="discInput" placeholder="협의 코멘트 입력…" onkeydown="if(event.key==='Enter')postDiscussion('${id}')">
          <button class="btn pri" onclick="postDiscussion('${id}')">등록</button></div>
      </div></div>`;
  } else if(tab==="materials"){
    const mats=await API(`/cases/${id}/materials`).catch(()=>[]);
    const rows=mats.length?mats.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${tag(statusColor(m.status||m.result),m.status||m.result||"—")}</td><td class="small">${m.evidence_count?"✓ "+m.evidence_count:'<span class="muted">없음</span>'}</td></tr>`).join(""):`<tr><td colspan="3" class="muted" style="text-align:center;padding:18px">원재료 없음</td></tr>`;
    panel=`<div class="card"><h3>원재료 스크리닝 <span class="en">· Materials</span></h3>
      <div class="body tight"><table><thead><tr><th>원재료</th><th>상태</th><th>증빙</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="body btnrow" style="border-top:1px solid var(--line)"><button class="btn" onclick="CURCASE='${id}';go('materials')">원재료 화면 열기 →</button></div></div>`;
  } else if(tab==="documents"){
    const docs=await API(`/cases/${id}/documents`).catch(()=>[]);
    panel=`<div class="card"><h3>첨부 문서 <span class="en">· Attachments</span><span class="r">클릭 → 원본</span></h3>
      <div class="body"><div class="filegrid">${docs.length?docs.map(d=>`<div class="filecard" onclick="viewDoc('${d.document_id}')">
        <div class="fico">${/png|jpg|jpeg|img/i.test(d.filename||"")?'🖼':'📄'}</div>
        <div class="fmeta"><b>${esc(d.filename||"문서")}</b><span class="muted small">${esc(d.doc_type||"")} · ${esc(d.review_status||"미검수")}</span></div></div>`).join(""):'<div class="muted small">문서 없음</div>'}</div></div></div>`;
  } else if(tab==="audit"){
    const find=await API(`/cases/${id}/findings`).catch(()=>[]);
    const rows=find.length?find.map(f=>`<tr><td><b>${esc(f.finding)}</b><div class="muted small">${esc(f.area||"")}</div></td><td>${tag(statusColor(f.severity),f.severity||"—")}</td><td>${tag(statusColor(f.status),f.status||"—")}</td></tr>`).join(""):`<tr><td colspan="3" class="muted" style="text-align:center;padding:18px">지적사항 없음</td></tr>`;
    panel=`<div class="card"><h3>지적사항 <span class="en">· Findings</span></h3>
      <div class="body tight"><table><thead><tr><th>내용</th><th>심각도</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="body btnrow" style="border-top:1px solid var(--line)"><button class="btn" onclick="CURCASE='${id}';go('audit')">심사 화면 열기 →</button></div></div>`;
  }
  return head+`<div class="detail-panel">${panel}</div>`;
}

/* ---- boot ---- */
function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");if(!h)return {screen:"dashboard"};
  const [path,qs]=h.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));
  const parts=path.split("/");
  if(parts[0]==="case"&&parts[1])return {detail:parts[1],tab:q.tab||"overview"};
  return {screen:parts[0]||"dashboard",filters:q};
}
async function boot(){
  if(!token()){document.getElementById("appView").style.display="none";document.getElementById("loginView").style.display="grid";return;}
  try{const th=localStorage.getItem("glhac_theme")||"light";document.documentElement.setAttribute("data-theme",th);document.getElementById("themePill").textContent=th==="dark"?"☀️ 라이트":"🌙 다크";}catch(_){}
  try{LANG=parseInt(localStorage.getItem("glhac_lang")||"0",10)||0;applyLang();}catch(_){}
  let me;try{me=await API("/auth/me");}catch(_){logout();return;}
  const br=me.role||localStorage.getItem("glhac_role")||"applicant";
  ROLE=BR2ROLE[br]||"client";
  document.getElementById("userPill").innerHTML=`👤 <b>${esc(me.username||localStorage.getItem("glhac_user")||"")}</b> · ${esc(ROLE_DEF[ROLE].ko)}`;
  document.getElementById("loginView").style.display="none";
  document.getElementById("appView").style.display="flex";
  CASES_CACHE=[];await loadCases(true);
  buildNav();
  const init=parseHash();
  navigate(init,true);
}
boot();
</script>
