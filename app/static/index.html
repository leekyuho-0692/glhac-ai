<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL-HAC AI · 할랄·샤리아 인증 플랫폼</title>
<style>
  :root{
    --shell:#0F172A; --shell2:#1E293B; --line:#E2E8F0; --line2:#CBD5E1;
    --bg:#F1F5F9; --card:#FFFFFF; --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8;
    --accent:#2563EB; --accent2:#1D4ED8; --accent-soft:#EFF6FF;
    --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7;
    --bad:#DC2626; --bad-soft:#FEE2E2; --gold:#B45309; --gold-soft:#FEF3C7;
    --nav-active:#334155; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
    --radius:12px;
  }
  html[data-theme="dark"]{
    --bg:#0B1120; --card:#111827; --ink:#E5E7EB; --ink2:#94A3B8; --ink3:#64748B;
    --line:#1F2937; --line2:#334155; --accent-soft:#0F1E3D;
    --ok-soft:#052e16; --warn-soft:#3a2606; --bad-soft:#3a0d0d; --gold-soft:#3a2606;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh}
  aside{width:264px;flex:0 0 264px;background:var(--shell);color:#CBD5E1;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .hamburger{display:none;background:transparent;border:1px solid var(--line2);color:var(--ink2);
    font-size:18px;line-height:1;border-radius:9px;width:40px;height:40px;cursor:pointer;flex:0 0 auto}
  .navscrim{display:none}
  /* 키보드 포커스 가시화(마우스 클릭엔 미노출) — 접근성 */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .brand{padding:18px 20px 10px}
  .brand b{color:#fff;font-size:17px;letter-spacing:-.3px}
  .brand small{display:block;color:#64748B;font-size:11px;margin-top:2px}
  nav{padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;
    color:#CBD5E1;text-decoration:none;font-size:14.5px;cursor:pointer;transition:.12s;white-space:nowrap}
  nav a .en{color:#64748B;font-size:12px;margin-left:auto}
  nav a:hover{background:#1E293B;color:#fff}
  nav a.active{background:var(--nav-active);color:#fff;font-weight:600}
  nav a.active .en{color:#93C5FD}
  .navfoot{margin-top:auto;padding:12px 20px;color:#475569;font-size:11px;border-top:1px solid #1E293B}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:66px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:5}
  .crumb{font-size:14.5px;color:var(--ink2)}
  .crumb b{color:var(--ink)}
  .topbar .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line2);color:var(--ink2);background:var(--card);cursor:pointer}
  .pill.live{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
  .pill select{border:none;background:transparent;color:inherit;font-size:12px;outline:none;max-width:160px}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
  .content{padding:26px;display:none}
  .content.show{display:block}
  .page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:4px}
  .page-h h1{font-size:26px;margin:0;letter-spacing:-.4px}
  .page-h .en{color:var(--ink3);font-size:16px;font-weight:500}
  .roles{font-size:13px;color:var(--ink3);margin-bottom:20px}
  .roles b{color:var(--accent)}
  .grid{display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;
    display:flex;align-items:center;gap:8px}
  .card h3 .en{color:var(--ink3);font-weight:400;font-size:13px}
  .card h3 .r{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:400}
  .card .body{padding:18px}
  .card .body.tight{padding:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
  th{color:var(--ink3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;
    background:color-mix(in srgb,var(--bg) 55%,transparent);position:sticky;top:0}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:none}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
  .t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
  .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--accent-soft);color:var(--accent)}
  .t-gold{background:var(--gold-soft);color:var(--gold)} .t-mute{background:color-mix(in srgb,var(--ink3) 15%,transparent);color:var(--ink2)}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:10px 15px;
    border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent2);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn.ok:hover{filter:brightness(.94);color:#fff}
  .btn.bad{background:var(--bad);border-color:var(--bad);color:#fff} .btn.bad:hover{filter:brightness(.94);color:#fff}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff} .btn.gold:hover{filter:brightness(.94);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .kpi{display:flex;flex-direction:column;gap:3px}
  .kpi .n{font-size:32px;font-weight:700;letter-spacing:-.5px}
  .kpi .l{font-size:13px;color:var(--ink3)}
  .muted{color:var(--ink3)} .small{font-size:13px}
  .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:5px;background:var(--accent)}
  .chip{font-size:11px;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--bg) 60%,transparent);
    border:1px solid var(--line);color:var(--ink2)}
  .divide{height:1px;background:var(--line);margin:14px 0}
  .flow{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .step{flex:1;min-width:92px;text-align:center;padding:10px 6px;border-radius:9px;font-size:11.5px;
    border:1px solid var(--line);background:var(--card);position:relative}
  .step.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
  .step.now{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow)}
  .step .s{display:block;font-size:15px;margin-bottom:2px}
  .arrow{color:var(--ink3);padding:0 4px;font-size:13px}
  .list{display:flex;flex-direction:column}
  .li{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
  .li:last-child{border-bottom:none}
  .li .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 28px;font-size:13px}
  .li .tx{flex:1;min-width:0}
  .li .tx b{font-size:13.5px;font-weight:600} .li .tx div{font-size:12.5px;color:var(--ink3)}
  .li .when{font-size:12px;color:var(--ink3);white-space:nowrap}
  .pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;border-top:1px solid var(--line)}
  .pager .btn{padding:8px 14px}
  .two{grid-template-columns:1fr 1fr}
  .side{grid-template-columns:1.55fr 1fr}
  .side-r{grid-template-columns:1fr 1.55fr}
  .three{grid-template-columns:1fr 1fr 1fr}
  .four{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1080px){.two,.side,.side-r,.three,.four{grid-template-columns:1fr}}
  /* ── 모바일 반응형(≤820px): 오프캔버스 드로어 + 햄버거 ── */
  @media(max-width:820px){
    .hamburger{display:inline-flex;align-items:center;justify-content:center}
    aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
    .app.navopen aside{transform:translateX(0)}
    .navscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);
      z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
    .app.navopen .navscrim{opacity:1;pointer-events:auto}
    .topbar{height:auto;min-height:58px;padding:8px 14px;flex-wrap:wrap;gap:8px}
    .topbar .pill{font-size:12.5px;padding:6px 10px}
    .content{padding:16px 14px}
    .page-h{flex-wrap:wrap;gap:6px}
    .page-h h1{font-size:22px}
    .card .body{overflow-x:auto;-webkit-overflow-scrolling:touch}  /* 넓은 표는 카드 내 가로 스크롤 */
  }
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:4px}
  .field .v{border:1px solid var(--line2);border-radius:8px;padding:8px 11px;background:var(--card);font-size:13px}
  input.v,select.v{width:100%;font-family:inherit}
  .radioset{display:flex;gap:8px}
  .radioset .opt{flex:1;border:1.5px solid var(--line2);border-radius:9px;padding:10px;font-size:12px;cursor:pointer}
  .radioset .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .radioset .opt b{display:block;font-size:12.5px}
  .radioset .opt span{color:var(--ink3);font-size:11px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .mapwrap{position:relative;height:300px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(circle at 40% 55%,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--accent-soft))}
  .mapbubble{transition:.12s}
  .mapbubble:hover{filter:brightness(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);z-index:2}
  .stagebars{display:flex;flex-direction:column;gap:12px}
  .sb{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:10px;font-size:12px}
  .sb .bar{margin:0}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .thumb{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);background:
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card));
    display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--ink2)}
  .check{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .check:last-child{border:none}
  .cbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);flex:0 0 17px;display:grid;place-items:center;font-size:11px}
  .cbox.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .cbox.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .chatlog{display:flex;flex-direction:column;gap:10px;padding:4px 2px;max-height:360px;overflow:auto}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.a cite{display:block;margin-top:6px;font-size:10.5px;color:var(--accent);font-style:normal}
  .inputbar{display:flex;gap:8px;margin-top:12px}
  .inputbar .box{flex:1;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .cert{border:2px solid var(--gold);border-radius:14px;padding:22px;text-align:center;
    background:linear-gradient(180deg,var(--gold-soft),var(--card))}
  .cert .seal{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;
    background:radial-gradient(circle at 50% 40%,var(--gold),#7c3f06);color:#fff;display:grid;place-items:center;font-size:24px}
  .cert h2{margin:2px 0;font-size:17px;color:var(--gold)}
  .cert .no{font-family:ui-monospace,monospace;font-size:12px;color:var(--ink2);margin-top:8px}
  .banner{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:500}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.info{background:var(--accent-soft);color:var(--accent)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  .banner.ok{background:var(--ok-soft);color:var(--ok)}
  .committee{display:flex;flex-direction:column;gap:9px}
  .mem{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
  .scorebox{display:flex;align-items:baseline;gap:6px}
  .scorebox .big{font-size:30px;font-weight:700}
  .scope-pill{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:4px 11px;align-self:center}
  .ro-badge{font-size:10px;font-weight:700;color:var(--ink3);background:color-mix(in srgb,var(--ink3) 16%,transparent);
    border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
  .clickable{cursor:pointer;transition:.12s}
  tr.clickable:hover{background:var(--accent-soft)}
  .card.clickable:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(37,99,235,.15);transform:translateY(-1px)}
  .go-arrow{opacity:0;color:var(--accent);font-weight:700;transition:.12s;margin-left:2px}
  .clickable:hover .go-arrow,tr.clickable:hover .go-arrow{opacity:1}
  .chipbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px}
  .fchip b{cursor:pointer;font-size:13px;opacity:.7;line-height:1}
  .fchip b:hover{opacity:1}
  .fchip.clear{background:transparent;border:1px solid var(--line2);color:var(--ink2);cursor:pointer}
  .detail-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .dt-title h1{margin:0;font-size:20px;letter-spacing:-.3px}
  .dt-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink2)}
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .tabbtn{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink3);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn:hover{color:var(--ink)}
  .tabbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .kv:last-child{border:none}.kv span{color:var(--ink3)}
  .filegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:760px){.filegrid{grid-template-columns:1fr}}
  .filecard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;transition:.12s}
  .filecard:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .fico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
  .fmeta b{font-size:12.5px;display:block}
  html[data-lang="ko"] .en{display:none !important}
  #loginView{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--shell),#1e3a8a)}
  .loginbox{width:min(520px,94vw);background:var(--card);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:44px 42px}
  .loginbox h1{font-size:34px;margin:0 0 6px;letter-spacing:-.5px}
  .loginbox .sub{color:var(--ink3);font-size:15px;margin-bottom:26px}
  .loginbox input{width:100%;border:1.5px solid var(--line2);border-radius:11px;padding:15px 16px;font-size:16px;margin-bottom:13px;font-family:inherit;background:var(--card);color:var(--ink)}
  .loginbox input:focus{outline:none;border-color:var(--accent)}
  .loginbox>button[type="submit"]{font-size:16px;padding:15px !important;border-radius:11px}
  .loginbox .demo{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);line-height:1.7}
  .loginbox .demo>b{color:var(--ink2);font-size:13px}
  .demogrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .demogrid .btn{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;font-size:14px}
  .demogrid .btn span{font-size:11.5px;color:var(--ink3);font-weight:400;font-family:ui-monospace,monospace}
  .loginbox .demo + div a,.registerback a{font-size:14px !important}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--shell);color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.2s;pointer-events:none}
  #toast.show{opacity:1}
  #modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;place-items:center;padding:20px}
  .modalbox{width:min(460px,94vw);background:var(--card);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:22px 24px;max-height:90vh;overflow:auto}
  .modalbox h3{margin:0 0 14px;font-size:17px;border:none;padding:0}
  .modalbox textarea.v,.modalbox input.v,.modalbox select.v{width:100%;font-family:inherit;font-size:14px;padding:10px 12px}
  .notif-panel{position:absolute;right:0;top:40px;width:360px;max-height:440px;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;display:none;padding:6px}
  .notif-panel.open{display:block}
  .notif-item{display:flex;gap:9px;padding:10px 11px;border-radius:9px;cursor:pointer;align-items:flex-start}
  .notif-item:hover{background:var(--accent-soft)}
  .notif-item.unread{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .notif-item .nic{font-size:16px}
  .notif-item b{font-size:12.5px} .notif-item div{font-size:11.5px;color:var(--ink3)}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView">
  <form class="loginbox" id="loginForm" onsubmit="doLogin(event)">
    <h1>GL-HAC AI</h1>
    <div class="sub">할랄·샤리아 인증 플랫폼 · Halal Certification</div>
    <input id="loginUser" placeholder="아이디 · Username" autocomplete="username" autofocus>
    <input id="loginPass" type="password" placeholder="비밀번호 · Password" autocomplete="current-password">
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" type="submit">로그인 · Sign in</button>
    <div class="demo" id="demoPanel" style="display:none">

const TK="glhac_token";
function token(){try{return localStorage.getItem(TK)||""}catch(_){return""}}
let FETCH_ERRORS=0;
async function API(path, opt){
  opt=opt||{};
  opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{},
    token()?{Authorization:"Bearer "+token()}:{});
  let r;
  try{r=await fetch(path,opt);}
  catch(net){FETCH_ERRORS++;console.warn("[API] network",path,net);throw {code:"NETWORK"};}
  if(r.status===401){logout();throw {code:"UNAUTH"};}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){FETCH_ERRORS++;console.warn("[API]",r.status,path,j);throw ((j&&j.detail)?j.detail:j);}
  return j;
}
async function doLogin(e){
  if(e) e.preventDefault();
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  if(!u||!p){toast("아이디·비밀번호를 입력하세요");return;}
  try{
    const j=await API("/auth/login",{method:"POST",body:JSON.stringify({username:u,password:p})});
    localStorage.setItem(TK,j.token);
    localStorage.setItem("glhac_role",j.role);
    localStorage.setItem("glhac_org",j.org_id||"");
    localStorage.setItem("glhac_user",j.username||u);
    boot();
  }catch(err){toast("로그인 실패 · "+(err&&err.code?err.code:"확인 필요"));}
}

  ["glhac_token","glhac_role","glhac_org","glhac_user","glhac_case"].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}} );

  try{location.reload();}catch(_){document.getElementById("appView").style.display="none";document.getElementById("loginView").style.display="grid";}

function regOcrPick(){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";

    const st=document.getElementById("regOcrStatus");st.textContent="AI 추출 중… (PaddleOCR)";
    const b64=await fileB64(file);
    try{const r=await API("/auth/ocr-extract",{method:"POST",body:JSON.stringify({image_b64:b64})});

}

    const j=await API("/auth/register",{method:"POST",body:JSON.stringify(body)});

function bTag(t,v){const ko=koText(v);return ko?`<span class="tag t-${t}">${esc(ko)}<span class="en"> · ${esc(v)}</span></span>`:`<span class="tag t-${t}">${esc(v==null?"—":v)}</span>`;}
function bSpan(v){const ko=koText(v);return ko?`${esc(ko)}<span class="en"> · ${esc(v)}</span>`:esc(v==null?"—":v);}
function toast(m){const t=document.getElementById("toast");t.textContent=(LANG===2&&typeof UI_STRINGS!=="undefined"&&UI_STRINGS[String(m).trim()])||m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
/* 재사용 모달 폼 — prompt() 대체. fields:[{key,label,type:text|number|textarea|select,options,value,placeholder,required}] */
let _modalCb=null,_modalFields=null;
function dialog(title, fields){
  return new Promise(res=>{
    _modalCb=res;_modalFields=fields;
    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalFields").innerHTML=fields.map(f=>{
      const id="mf_"+f.key;
      if(f.type==="select")return `<div class="field"><label for="${id}">${esc(f.label)}</label><select class="v" id="${id}">${(f.options||[]).map(o=>{const v=o.value!=null?o.value:o,l=o.label!=null?o.label:o;return `<option value="${esc(v)}"${f.value===v?" selected":""}>${esc(l)}</option>`;}).join("")}</select></div>`;
      if(f.type==="textarea")return `<div class="field"><label for="${id}">${esc(f.label)}</label><textarea class="v" id="${id}" rows="3" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea></div>`;
      return `<div class="field"><label for="${id}">${esc(f.label)}</label><input class="v" id="${id}" type="${f.type||"text"}" value="${esc(f.value==null?"":f.value)}" placeholder="${esc(f.placeholder||"")}" onkeydown="if(event.key==='Enter')modalSubmit()"></div>`;
    }).join("");
    document.getElementById("modalOverlay").style.display="grid";
    const first=document.querySelector("#modalFields .v");if(first)first.focus();
  });
}
function modalSubmit(){
  const out={};let bad=null;
  _modalFields.forEach(f=>{const el=document.getElementById("mf_"+f.key);const v=el?el.value.trim():"";out[f.key]=v;if(f.required&&!v)bad=f.label;});
  if(bad){toast(bad+" 입력");return;}

/* [province, x%, y%, [aliases(도시 등)]] — 스타일라이즈드 인니 지도 좌표 */
const PROVINCES=[
  ["Aceh",8,20,[]],["Sumatera Utara",12,27,["medan"]],["Riau",17,35,["pekanbaru"]],
  ["Sumatera Barat",13,40,["padang"]],["Sumatera Selatan",21,50,["palembang"]],
  ["Lampung",24,58,["bandar lampung"]],["Banten",27,63,["serang","tangerang"]],
  ["DKI Jakarta",29,64,["jakarta"]],["Jawa Barat",31,67,["bandung","bekasi","bogor","depok"]],
  ["Jawa Tengah",35,70,["semarang","solo","surakarta"]],["DI Yogyakarta",36,73,["yogyakarta","jogja"]],
  ["Jawa Timur",40,70,["surabaya","malang"]],["Bali",47,74,["denpasar"]],
  ["Nusa Tenggara Barat",51,76,["mataram","lombok"]],["Nusa Tenggara Timur",57,78,["kupang"]],
  ["Kalimantan Barat",40,42,["pontianak"]],["Kalimantan Tengah",46,48,["palangkaraya"]],
  ["Kalimantan Selatan",50,53,["banjarmasin"]],["Kalimantan Timur",53,40,["samarinda","balikpapan"]],
  ["Sulawesi Selatan",60,58,["makassar"]],["Sulawesi Tengah",62,48,["palu"]],
  ["Sulawesi Utara",67,38,["manado"]],["Maluku",75,52,["ambon"]],
  ["Papua Barat",82,48,["manokwari"]],["Papua",89,52,["jayapura"]],
];
let REGION_CACHE={};
function matchProvince(addr){
  if(!addr) return null;
  const a=String(addr).toLowerCase();
  for(const [name,,,aliases] of PROVINCES){
    if(a.includes(name.toLowerCase())) return name;
    for(const al of aliases) if(a.includes(al)) return name;
  }
  return null;
}
async function ensureRegions(cases){
  const need=cases.filter(c=>!(c.case_id in REGION_CACHE)).slice(0,60);
  if(need.length){
    const ds=await Promise.all(need.map(c=>API(`/cases/${c.case_id}`).catch(()=>null)));
    ds.forEach((d,i)=>{REGION_CACHE[need[i].case_id]=d?(matchProvince(d.factory_address||d.address)||"미지정"):"미지정";});
  }
}

SCREEN.caseList=async()=>{
  let cases=await loadCases(true);
  const f=FILTERS.filter;
  const _iss=c=>/issued|certificate/i.test(c.status), _act=c=>/corrective|requested|reject|blocked/i.test(c.status);
  if(f==="issued")cases=cases.filter(_iss);
  else if(f==="action")cases=cases.filter(c=>!_iss(c)&&_act(c));
  else if(f==="progress")cases=cases.filter(c=>!_iss(c)&&!_act(c));
  if(FILTERS.status)cases=cases.filter(c=>c.status===FILTERS.status);
  if(FILTERS.q){const q=FILTERS.q.toLowerCase();cases=cases.filter(c=>(c.company_name||"").toLowerCase().includes(q)||c.case_id.toLowerCase().includes(q));}
  if(FILTERS.region){cases=cases.filter(c=>c.province===FILTERS.region);}
  if(CASE_SORT==="due")cases=cases.slice().sort((a,b)=>{const da=dueDays(a.due_date),db=dueDays(b.due_date);if(da==null&&db==null)return 0;if(da==null)return 1;if(db==null)return -1;return da-db;});
  const pg=pageSlice("caseList",cases,10);
  const rows=pg.items.length?pg.items.map(c=>`<tr class="clickable" onclick="openCase('${c.case_id}')">
      <td style="font-family:ui-monospace,monospace;font-size:12px">${short(c.case_id)} <span class="go-arrow">→</span></td>
      <td><b>${esc(c.company_name||"—")}</b></td>
      <td>${bTag(c.pathway==="self_declare"?"info":"mute",c.pathway||"—")}</td>
      <td>${bTag(statusColor(c.status),c.status||"—")}</td>
      <td>${c.due_date?dueBadge(c.due_date):'<span class="muted">—</span>'}</td></tr>`).join("")
    : `<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">조건에 맞는 케이스 없음 · No cases</td></tr>`;
  const canNew=["client","consultant","admin"].includes(ROLE);
  return `${filterChips()}
  <div class="chipbar" style="margin-bottom:12px">
    <input class="v" style="width:auto;flex:1;max-width:280px" placeholder="🔍 검색 (기업·번호) — Enter" value="${esc(FILTERS.q||'')}" onkeydown="if(event.key==='Enter'){FILTERS.q=this.value;PAGES={};applyView();}">
    <select class="v" style="width:auto" onchange="CASE_SORT=this.value;applyView()">
      <option value="recent"${CASE_SORT==='recent'?' selected':''}>정렬: 최근순</option>
      <option value="due"${CASE_SORT==='due'?' selected':''}>정렬: 기한 우선</option></select>
    ${FILTERS.q?`<span class="fchip">검색: ${esc(FILTERS.q)} <b onclick="delete FILTERS.q;applyView()">✕</b></span>`:''}
  </div>
  <div class="card"><h3>케이스 테이블 <span class="en">· Case table</span><span class="r">${ROLE==='auditor'?'배정 심사 관리':'row 클릭 → 상세'}</span></h3>
    <div class="body tight"><table>
      <thead><tr><th>번호 · ID</th><th>기업 · Company</th><th>경로</th><th>상태 · Status</th><th>기한 · Due</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${pager("caseList",pg)}
    <div class="body btnrow" style="border-top:1px solid var(--line)">
      ${canNew?'<button class="btn pri" onclick="newCase()">＋ 새 신청 · New</button>':''}
      <button class="btn" onclick="exportCasesCsv()">⬇ CSV</button>
      <span class="chip" style="margin-left:auto">노출 ${cases.length}건 · scope: ${scopeLabel()}</span>
    </div></div>`;

async function newCase(){
  const r=await dialog("새 신청 · New case",[{key:"company_name",label:"기업명 · Company",required:true}]);
  if(!r)return;
  try{const c=await API("/cases",{method:"POST",body:JSON.stringify({company_name:r.company_name,is_msme:true})});
    toast("케이스 생성됨");await loadCases(true);openCase(c.case_id);}
  catch(e){toast("생성 실패 · "+(e&&e.code?e.code:"권한 확인"));}
}
function exportCasesCsv(){
  const rows=[["case_id","company_name","pathway","status"]].concat(CASES_CACHE.map(c=>[c.case_id,c.company_name,c.pathway,c.status]));
  const csv=rows.map(r=>r.map(x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="cases.csv";a.click();
}

async function advance(id,target){

async function exportCaseJson(id){try{const r=await fetch(`/cases/${id}/export.json`,{headers:{Authorization:"Bearer "+token()}});if(!r.ok)throw 0;const d=await r.json();downloadText("case_"+short(id)+".json",JSON.stringify(d,null,2));toast("JSON 내보내기 완료");}catch(_){toast("내보내기 실패");}}

async function viewDoc(docId){
  // 보안: blob:은 동일 출처 → HTML/SVG를 새 탭에서 열면 앱 origin에서 스크립트 실행(토큰 탈취).
  // 실행 불가한 다운로드로 강제하고, 파일명은 Content-Disposition에서 취득.
  try{const r=await fetch(`/documents/${docId}/file`,{headers:{Authorization:"Bearer "+token()}});
    if(!r.ok){toast("파일 없음");return;}
    const cd=r.headers.get("Content-Disposition")||"";const m=cd.match(/filename\*?=(?:UTF-8''|")?([^";]+)/i);
    const fname=m?decodeURIComponent(m[1].replace(/"/g,"")):("document_"+short(docId));
    const b=await r.blob();
    const dl=b.slice(0,b.size,"application/octet-stream");   // MIME 중화 → 실행 방지
    const u=URL.createObjectURL(dl);const a=document.createElement("a");a.href=u;a.download=fname;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),60000);}
  catch(_){toast("열기 실패");}
}

      <div class="small muted" style="margin-top:8px">제출 자료 ${docs.length}건 · 클릭→원본</div>`:'<div class="muted small">제출 자료 없음</div>';
    const dHtml=(hist.decisions||[]).map(d=>`<div class="li"><div class="ic t-${d.result==='pass'?'ok':'bad'}">${d.result==='pass'?'✓':'✕'}</div><div class="tx"><b>${esc(d.result)}</b><div>${esc(d.reason||"")}</div></div></div>`).join("")||'<div class="li"><div class="tx muted small">판정 이력 없음</div></div>';
    panel=`<div>
      <div class="card" style="margin-bottom:16px"><h3>제출 자료 (사진·문서) <span class="en">· Submitted media</span></h3>
        <div class="body">${gal}</div></div>

  }

  const id=CURCASE;

  const els=h.elements||[];
  const canSev=["client","consultant","admin"].includes(ROLE);
  const sevHtml=(sev.items||[]).map(it=>`<div class="check">
      <div class="cbox ${it.uploaded?'on':''}">${it.uploaded?'✓':''}</div>
      <b style="flex:1">${esc(it.label)}</b>
      ${it.uploaded?`<button class="btn" style="padding:3px 8px;font-size:11px" onclick="viewDoc('${it.document_id}')">보기</button>`:(canSev?`<button class="btn" style="padding:3px 8px;font-size:11px" onclick="uploadSjphEvidence('${id}','${it.item_key}')">업로드</button>`:'<span class="muted small">미제출</span>')}

  const rows=els.map(e=>`<tr><td><b>${esc(e.label||e.element)}</b><div class="muted small">${esc(e.reason||"")}</div></td>
      <td>${tag(e.status==="ok"?"ok":"warn",e.status==="ok"?"양호":"보완")}</td></tr>`).join("")||`<tr><td colspan="2" class="muted" style="text-align:center;padding:18px">평가 항목 없음</td></tr>`;
  const okc=els.filter(e=>e.status==="ok").length;
  return `
  <div class="grid side">
    <div class="card"><h3>HPAS 자동 평가 <span class="en">· HPAS auto</span><span class="r">${okc}/${els.length} 양호</span></h3>
      <div class="body tight"><table><thead><tr><th>평가 항목 · Item</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="body btnrow" style="border-top:1px solid var(--line)"><button class="btn" onclick="applyView()">🔄 HPAS 재판정 · Re-evaluate</button></div></div>
    <div class="card"><h3>파트와 상정 준비 <span class="en">· To Fatwa</span></h3>
      <div class="body">
        <div class="scorebox" style="margin-bottom:14px"><span class="big" style="color:var(--ok)">${okc}</span><span class="muted">/ ${els.length} 요소 충족</span></div>
        <div class="banner ${okc===els.length&&els.length?'ok':'info'}" style="margin-bottom:12px">${okc===els.length&&els.length?'✓ 상정 기준 충족':'ℹ 보완 항목 확인'}</div>
        <button class="btn gold" onclick="go('fatwa')">파트와 화면으로 · To Fatwa →</button></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>SJPH 증빙 <span class="en">· Evidence</span><span class="r">${sev.uploaded||0}/${sev.total||0} · ${sev.completion||0}%</span></h3>
    <div class="body">${sevHtml}</div></div>`;

    try{await API(`/cases/${cid}/sjph-evidence`,{method:"POST",body:JSON.stringify({item_key:key,file_b64:b64,filename:file.name})});toast("증빙 업로드");applyView();}catch(e){toast("업로드 실패 · "+(e&&e.code?e.code:""));}};
  inp.click();
}

  return `
  <div class="grid three" style="margin-bottom:16px">
    <div class="card"><div class="body kpi"><span class="n" style="font-size:24px">${fmtIDR(st2.total)}</span><span class="l">총 청구액 · Total</span></div></div>
    <div class="card"><div class="body kpi"><span class="n" style="font-size:24px;color:var(--ok)">${fmtIDR(st2.paid)}</span><span class="l">결제 완료 · Paid</span></div></div>

/* 12) Fatwa */
SCREEN.fatwa=async()=>{
  const id=CURCASE;const fd=await API(`/cases/${id}/fatwa`).catch(()=>({decision:"pending"}));
  const members=fd.committee_members||[];
  const memHtml=(Array.isArray(members)?members:[]).map(m=>{
    const nm=typeof m==="string"?m:(m.name||"");const av=(nm||"?").slice(0,2).toUpperCase();
    return `<div class="mem"><div class="av">${esc(av)}</div><div style="flex:1"><b>${esc(nm)}</b><div class="muted small">${esc(typeof m==="object"?(m.role||"위원"):"위원")}</div></div>${tag("ok","등록")}</div>`;}).join("")||'<div class="muted small">위원 정보 없음</div>';
  const fst=fd.fatwa_status||"none";
  const isProvisional=fst==="provisional", isFinal=fst==="approved";
  const canProvisional=["sharia","admin"].includes(ROLE);   // 샤리아 가승인
  const canFinal=["ops","admin"].includes(ROLE);            // 최고운영자 최종승인
  const stageBanner=isFinal?["ok","✓ 최종 승인 완료 (최고운영자)"]
    :isProvisional?["info","⏳ 가승인 (샤리아) — 최종 결제자 최종승인 대기"]
    :fst==="rejected"?["bad","⛔ 반려됨"]:fst==="conditional"?["warn","조건부 승인"]:["mute","심의 전"];
  return `
  <div class="grid side">
    <div class="card"><h3>파트와 위원회 심의 <span class="en">· Committee</span><span class="r">${bSpan(fst)}</span></h3>
      <div class="body">
        <div class="banner ${stageBanner[0]==='mute'?'info':stageBanner[0]}" style="margin-bottom:12px">${stageBanner[1]}${fd.decision_no?" · "+esc(fd.decision_no):""}${fd.final_approved_at?" · 최종 "+esc(String(fd.final_approved_at).slice(0,16)):""}</div>
        <div class="field"><label>심의 요지 · Note</label><div class="v small">${esc(fd.committee_note||"—")}</div></div>
        <div class="field"><label>위원장 · Head</label><div class="v small">${esc(fd.committee_head||"—")} / 간사 ${esc(fd.committee_secretary||"—")}</div></div>
        <div class="divide"></div>
        <div style="font-size:12.5px;margin-bottom:8px"><b>승인 단계 · 2-stage approval</b></div>
        ${canProvisional&&!isFinal?`<div class="field"><label>① 샤리아 가승인 · Provisional</label>
          <div class="btnrow"><button class="btn ok" onclick="fatwaDecide('${id}','approved')">가승인</button>
            <button class="btn gold" onclick="fatwaDecide('${id}','conditional')">조건부</button>
            <button class="btn bad" onclick="fatwaDecide('${id}','rejected')">반려</button></div></div>`:''}
        ${canFinal?`<div class="field"><label>② 최고운영자 최종승인 · Final approval</label>
          <button class="btn pri" ${isProvisional?'':'disabled'} onclick="fatwaFinalApprove('${id}')">${isFinal?'✓ 최종승인 완료':'최종승인 (scope 동결)'}</button>
          ${!isProvisional&&!isFinal?'<span class="chip" style="margin-left:6px">샤리아 가승인 후 활성화</span>':''}</div>`:''}
        ${!canProvisional&&!canFinal?'<span class="chip">🔒 샤리아(가승인)·최고운영자(최종승인) 전용</span>':''}
        <button class="btn" style="margin-top:10px" onclick="fatwaDoc('${id}')">📄 결정문 생성·다운로드</button>
      </div></div>
    <div class="card"><h3>위원 구성 <span class="en">· Members</span></h3>
      <div class="body"><div class="committee">${memHtml}</div>
        <div class="divide"></div>
        <div class="small" style="font-weight:600;margin-bottom:8px">심의 진행 체크리스트 · Review</div>
        ${[["위원 구성",members.length>0],["심의 요지 작성",!!fd.committee_note],["결정",!!(fd.decision&&fd.decision!=='pending')],["결정문 생성",!!fd.decision_no]].map(([t,ok])=>`<div class="check"><div class="cbox ${ok?'on':''}">${ok?'✓':''}</div><b style="flex:1">${t}</b><span class="muted small">${ok?'완료':'대기'}</span></div>`).join("")}
      </div></div>
  </div>`;
};
async function fatwaDecide(id,decision){try{await API(`/cases/${id}/fatwa`,{method:"PATCH",body:JSON.stringify({decision})});toast(decision==='approved'?"가승인 완료":"결정 · "+decision);await loadCases(true);applyView();}catch(e){toast("실패 · "+(e&&e.code?e.code:""));}}
async function fatwaFinalApprove(id){if(!confirm("최종 승인하시겠습니까? (scope 동결·인증서 발급 가능)"))return;try{await API(`/cases/${id}/fatwa/final-approve`,{method:"POST",body:"{}"});toast("최종 승인 완료");await loadCases(true);applyView();}catch(e){toast("최종승인 실패 · "+(e&&e.code?e.code:JSON.stringify(e)));}}
async function fatwaDoc(id){try{const r=await API(`/cases/${id}/fatwa/document`,{method:"POST",body:"{}"});downloadText("fatwa_"+short(id)+".txt",r.document||"");toast("결정문 생성·다운로드");}catch(e){toast("생성 실패 · "+(e&&e.code?e.code:""));}}

          <div class="kv"><span>경로 · Pathway</span><b>${esc(c.pathway||"—")}</b></div>
          <div class="kv"><span>상태 · Status</span><b>${esc(w.state_label||c.status||"—")}</b></div>
          <div class="kv"><span>NIB</span><b>${esc(c.nib||"—")}</b></div>
          <div class="kv"><span>책임자</span><b>${esc(c.responsible_person||"—")}</b></div>
        </div></div>
      <div class="card"><h3>준비도 <span class="en">· Readiness</span></h3>
        <div class="body">
          <div class="scorebox" style="margin-bottom:12px"><span class="big" style="color:var(--${rd.band==='ready'?'ok':rd.band==='warn'?'warn':'bad'})">${rd.readiness==null?"—":rd.readiness}</span><span class="muted">% · ${bSpan(rd.band)}</span></div>
          ${rd.breakdown?Object.entries(rd.breakdown).map(([k,vv])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(k)}</span><b>${vv}%</b></div><div class="bar"><i style="width:${vv}%"></i></div></div>`).join(""):""}
          <div class="btnrow" style="margin-top:12px">
            <button class="btn" onclick="openCaseTab('materials')">🧪 원재료 →</button>
            <button class="btn" onclick="openCaseTab('documents')">📁 문서 →</button>
            <button class="btn" onclick="openCaseTab('audit')">🏭 심사 →</button>
            <button class="btn" onclick="exportCaseJson('${id}')">⬇ JSON</button>
            <button class="btn" onclick="exportReport('${id}')">📄 종합 보고서</button></div>
        </div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>협의 · Discussion <span class="en">· thread</span><span class="r">${disc.length}건</span></h3>
      <div class="body">
        <div class="chatlog" style="max-height:240px">${disc.length?disc.map(d=>`<div class="msg a" style="max-width:100%"><b>${esc(d.author||d.author_role||"—")}</b> <span class="muted small">· ${esc(d.kind||"comment")} ${esc((d.created_at||"").slice(0,16))}</span><br>${esc(d.text)}</div>`).join(""):'<div class="muted small">협의 내역 없음</div>'}</div>
        <div class="inputbar"><input class="box" id="discInput" placeholder="협의 코멘트 입력…" onkeydown="if(event.key==='Enter')postDiscussion('${id}')">
          <button class="btn pri" onclick="postDiscussion('${id}')">등록</button></div>
      </div></div>`;
  } else if(tab==="materials"){
    const mats=await API(`/cases/${id}/materials`).catch(()=>[]);
    const rows=mats.length?mats.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${bTag(statusColor(m.status||m.result),m.status||m.result||"—")}</td><td class="small">${m.evidence_count?"✓ "+m.evidence_count:'<span class="muted">없음</span>'}</td></tr>`).join(""):`<tr><td colspan="3" class="muted" style="text-align:center;padding:18px">원재료 없음</td></tr>`;
    panel=`<div class="card"><h3>원재료 스크리닝 <span class="en">· Materials</span></h3>
      <div class="body tight"><table><thead><tr><th>원재료</th><th>상태</th><th>증빙</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="body btnrow" style="border-top:1px solid var(--line)"><button class="btn" onclick="CURCASE='${id}';go('materials')">원재료 화면 열기 →</button></div></div>`;
  } else if(tab==="documents"){
    const docs=await API(`/cases/${id}/documents`).catch(()=>[]);
    panel=`<div class="card"><h3>첨부 문서 <span class="en">· Attachments</span><span class="r">클릭 → 원본</span></h3>
      <div class="body"><div class="filegrid">${docs.length?docs.map(d=>`<div class="filecard" onclick="viewDoc('${d.document_id}')">
        <div class="fico">${/png|jpg|jpeg|img/i.test(d.filename||"")?'🖼':'📄'}</div>
        <div class="fmeta"><b>${esc(d.filename||"문서")}</b><span class="muted small">${esc(d.doc_type||"")} · ${esc(d.review_status||"미검수")}</span></div></div>`).join(""):'<div class="muted small">문서 없음</div>'}</div></div></div>`;
  } else if(tab==="audit"){
    const find=await API(`/cases/${id}/findings`).catch(()=>[]);
    const rows=find.length?find.map(f=>`<tr><td><b>${esc(f.finding)}</b><div class="muted small">${esc(f.area||"")}</div></td><td>${bTag(statusColor(f.severity),f.severity||"—")}</td><td>${bTag(statusColor(f.status),f.status||"—")}</td></tr>`).join(""):`<tr><td colspan="3" class="muted" style="text-align:center;padding:18px">지적사항 없음</td></tr>`;
    panel=`<div class="card"><h3>지적사항 <span class="en">· Findings</span></h3>
      <div class="body tight"><table><thead><tr><th>내용</th><th>심각도</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="body btnrow" style="border-top:1px solid var(--line)"><button class="btn" onclick="CURCASE='${id}';go('audit')">심사 화면 열기 →</button></div></div>`;
  }
  return head+`<div class="detail-panel">${panel}</div>`;
}

/* ---- boot ---- */
function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");if(!h)return {screen:"dashboard"};
  const [path,qs]=h.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));
  const parts=path.split("/");
  if(parts[0]==="case"&&parts[1])return {detail:parts[1],tab:q.tab||"overview"};
  return {screen:parts[0]||"dashboard",filters:q};
}
async function boot(){
  if(!token()){document.getElementById("appView").style.display="none";document.getElementById("loginView").style.display="grid";
    try{const cfg=await fetch("/public-config").then(r=>r.json());if(cfg&&cfg.dev_mode){const dp=document.getElementById("demoPanel");if(dp)dp.style.display="";}}catch(_){}
    return;}
  try{const th=localStorage.getItem("glhac_theme")||"light";document.documentElement.setAttribute("data-theme",th);document.getElementById("themePill").textContent=th==="dark"?"☀️ 라이트":"🌙 다크";}catch(_){}
  try{LANG=parseInt(localStorage.getItem("glhac_lang")||"0",10)||0;applyLang();}catch(_){}
  let me;try{me=await API("/auth/me");}catch(_){logout();return;}
  const br=me.role||localStorage.getItem("glhac_role")||"applicant";
  ROLE=BR2ROLE[br]||"client";
  try{const rb=await API("/rbac/actions");RBAC_ACTIONS=rb.actions||{};}catch(_){RBAC_ACTIONS={};}  // 단일 매트릭스 파생
  document.getElementById("userPill").innerHTML=`👤 <b>${esc(me.username||localStorage.getItem("glhac_user")||"")}</b> · ${esc(ROLE_DEF[ROLE].ko)}`;
  document.getElementById("loginView").style.display="none";
  document.getElementById("appView").style.display="flex";
  CASES_CACHE=[];await loadCases(true);
  buildNav();
  const init=parseHash();
  navigate(init,true);
  refreshNotifCount();
  if(!window._notifPoll)window._notifPoll=setInterval(refreshNotifCount,60000);
}
boot();
</script>
</body></html>
