/* ===== v3 C0: 공통 리스트 컴포넌트 (DataList) — 정렬·필터·검색·페이지·CSV·역할 컬럼 게이팅 =====
   사용: dlRender(elId, {columns, rows, state}) — columns:[{key,label,sort?,fmt?,role?}], rows:[{...}]
   화면(caseList·materials·documents·audit·invoice·fatwa·certificate·system)의 목록에 재사용. */
const _dlState = {};
function dlRender(elId, cfg){
  var el = typeof elId==='string' ? document.getElementById(elId) : elId; if(!el) return;
  var st = _dlState[elId] || (_dlState[elId] = {q:'', sort:cfg.sort||null, dir:1, page:1, size:cfg.pageSize||20});
  var role = (typeof glhacRole==='function')?glhacRole():'';
  var cols = (cfg.columns||[]).filter(function(c){ return !c.role || c.role==='*' || (Array.isArray(c.role)? (role==='admin'||c.role.indexOf(role)>=0) : true); });
  var rows = (cfg.rows||[]).slice();
  // 검색
  if(st.q){ var q=st.q.toLowerCase(); rows = rows.filter(function(r){ return cols.some(function(c){ return String(r[c.key]==null?'':r[c.key]).toLowerCase().indexOf(q)>=0; }); }); }
  // 필터(cfg.filters: {key:value})
  if(cfg.filters){ Object.keys(cfg.filters).forEach(function(k){ var v=cfg.filters[k]; if(v!=null&&v!=='') rows=rows.filter(function(r){return String(r[k])===String(v);}); }); }
  // 정렬
  if(st.sort){ rows.sort(function(a,b){ var x=a[st.sort], y=b[st.sort]; return (x>y?1:x<y?-1:0)*st.dir; }); }
  var total=rows.length, pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  var page = rows.slice((st.page-1)*st.size, st.page*st.size);
  var esc0 = (typeof esc==='function')?esc:function(s){return String(s==null?'':s);};
  function th(c){ var arrow = st.sort===c.key?(st.dir>0?' ▲':' ▼'):''; return '<th'+(c.sort!==false?' style="cursor:pointer" onclick="dlSort(\''+elId+'\',\''+c.key+'\')"':'')+'>'+esc0(c.label)+arrow+'</th>'; }
  function td(r,c){ var v=r[c.key]; return '<td>'+(c.fmt?c.fmt(v,r):esc0(v==null?'-':v))+'</td>'; }
  var html = ''
    + '<div class="dl-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'
    +   '<input class="dl-search" placeholder="검색 · Search" value="'+esc0(st.q)+'" oninput="dlSearch(\''+elId+'\',this.value)" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px">'
    +   (cfg.onNew?'<button class="btn primary" onclick="'+cfg.onNew+'">＋ '+esc0(cfg.newLabel||'새로 만들기 · New')+'</button>':'')
    +   '<button class="btn" onclick="dlExportCsv(\''+elId+'\')">CSV</button>'
    +   '<span style="margin-left:auto;color:#64748b;font-size:12px">'+total+'건 · '+st.page+'/'+pages+'</span>'
    + '</div>'
    + '<table class="dl-table"><thead><tr>'+cols.map(th).join('')+'</tr></thead><tbody>'
    +   (page.length?page.map(function(r){ return '<tr'+(cfg.onRow?' style="cursor:pointer" onclick="'+cfg.onRow.replace('{id}', esc0(r[cfg.idKey||'id']))+'"':'')+'>'+cols.map(function(c){return td(r,c);}).join('')+'</tr>'; }).join('')
    :        '<tr><td colspan="'+cols.length+'" style="text-align:center;color:#9ca3af;padding:24px">'+esc0(cfg.empty||'데이터가 없습니다 · No data')+'</td></tr>')
    + '</tbody></table>'
    + '<div class="dl-pager" style="display:flex;gap:6px;justify-content:center;margin-top:10px">'
    +   '<button class="btn small" '+(st.page<=1?'disabled':'')+' onclick="dlPage(\''+elId+'\',-1)">‹</button>'
    +   '<button class="btn small" '+(st.page>=pages?'disabled':'')+' onclick="dlPage(\''+elId+'\',1)">›</button>'
    + '</div>';
  el.innerHTML = html;
  _dlState[elId]._cfg = cfg; _dlState[elId]._cols = cols; _dlState[elId]._rows = rows;
}
function dlSearch(id,v){ _dlState[id].q=v; _dlState[id].page=1; dlRender(id,_dlState[id]._cfg); }
function dlSort(id,k){ var s=_dlState[id]; if(s.sort===k) s.dir=-s.dir; else {s.sort=k; s.dir=1;} dlRender(id,s._cfg); }
function dlPage(id,d){ _dlState[id].page+=d; dlRender(id,_dlState[id]._cfg); }
function dlExportCsv(id){ var s=_dlState[id], cols=s._cols, rows=s._rows;
  var lines=[cols.map(function(c){return '"'+String(c.label).replace(/"/g,'""')+'"';}).join(',')];
  rows.forEach(function(r){ lines.push(cols.map(function(c){var v=r[c.key];return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',')); });
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a');

function toggleMaterialProduct(mi,pi,checked){const m=state.materials[mi],p=state.products[pi];if(!m||!p)return;if(productIsLocked(p)){toast(t('productFrozenNotice'));renderMaterials();return}state.materialProductMatrix=state.materialProductMatrix||{};const current=new Set(materialProductIds(m));if(checked)current.add(p.id);else current.delete(p.id);state.materialProductMatrix[m.id]=[...current];save()}

function openMaterialForm(i=null){if(i!==null&&materialIsLocked(state.materials[i])){toast(t('materialFrozenNotice'));renderMaterials();return}const m=i!==null?state.materials[i]:{name:'',type:'raw',source:'plant',cert:'exempt',certNo:'',certFileName:'',supportInfo:defaultSupportInfo(),supplier:'',risk:'low',note:''};materialCertFileBuffer=m.certFileName||'';materialSupportFileBuffer=normalizeSupportInfo(m.supportInfo);openModal(i===null?t('addMaterial'):t('editMaterial'),`<div class="form-row"><div><label>${t('name')}</label><input id="m_name" value="${esc(m.name)}"></div><div><label>${t('type')}</label><select id="m_type">${opts('materialType',m.type)}</select></div></div><div class="form-row"><div><label>${t('source')}</label><select id="m_source" onchange="autoRiskMaterial(false)">${opts('source',m.source)}</select></div><div><label>${t('certNo')}</label><input id="m_certno" value="${esc(m.certNo)}" oninput="autoRiskMaterial(false)"></div></div><div class="form-row"><div><label>${t('certStatus')}</label><select id="m_cert">${opts('cert',m.cert)}</select></div><div><label>${t('supplier')}</label><input id="m_supplier" value="${esc(m.supplier)}"></div></div><div class="form-row"><div><label>${t('materialCertFile')}</label><input id="m_cert_file" type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="setMaterialCertFile(this)"><button class="btn blue" type="button" style="width:100%" onclick="document.getElementById('m_cert_file').click()">${t('uploadMaterialCert')}</button><div id="m_cert_file_help" class="input-help">${materialCertFileBuffer?`${t('selectedFile')}: ${esc(materialCertFileBuffer)}`:t('noFileSelected')}</div></div><div><label>${t('risk')}</label><select id="m_risk" onchange="renderMaterialSupportBox()">${opts('risk',m.risk)}</select></div></div><div id="m_support_box">${materialSupportFormHtml(m.risk)}</div><div class="form-row"><div><label>${t('aiQuickCheck')}</label><button class="btn blue" style="width:100%" onclick="autoRiskMaterial()">${t('autoRisk')}</button></div><div><label>KMA 1360</label><div id="m_kma_note" class="input-help">${(m.source==='chemical'||m.source==='synthetic')?(isKMA1360Listed(m)?t('kma1360Listed'):t('kma1360NotListed')):'-'}</div></div></div><div class="form-row one"><div><label>${t('notesJustification')}</label><textarea id="m_note">${esc(m.note)}</textarea></div></div><button class="btn primary" onclick="saveMaterial(${i===null?'null':i})">${t('saveMaterial')}</button>`)}

function scanText(){const txt=val('scanText').toLowerCase();const hard=[['pork / pig / babi / porcine',/pork|pig|babi|porcine|lard/],['blood / darah',/blood|darah/],['carrion / bangkai',/carrion|bangkai/],['human body derivative',/human|placenta|hair|keratin/],['khamr or alcoholic beverage',/khamr|wine|beer|rum|vodka|liquor/]];const critical=[['ethanol / alcohol',/ethanol|alcohol/],['gelatin / collagen',/gelatin|collagen/],['enzyme / rennet',/enzyme|rennet/],['glycerin / emulsifier',/glycerin|glycerol|emulsifier|mono|diglyceride|e471/],['flavor / color additive',/flavo[u]?r|colour|color|carmine/],['animal source',/animal|beef|chicken|meat|fat/]];let hits=[];hard.forEach(x=>{if(x[1].test(txt))hits.push({name:x[0],level:'high',msg:t('prohibitedMsg')})});critical.forEach(x=>{if(x[1].test(txt))hits.push({name:x[0],level:'medium',msg:t('criticalMsg')})});document.getElementById('scanResult').innerHTML=hits.length?`<div class="list">${hits.map(h=>`<div class="item ${h.level==='high'?'risk-high':'risk-med'}"><div class="row"><b>${esc(h.name)}</b>${statusPill('risk',h.level,h.level==='high'?'red':'amber')}</div><p>${esc(h.msg)}</p></div>`).join('')}</div>`:`<div class="item risk-low"><div class="row"><b>${t('noRiskFound')}</b>${pill(t('lowInitialRisk'),'green')}</div><p>${t('verifyReminder')}</p></div>`}

function serviceRequestCard(kind){

  r.auditors=Array.isArray(r.auditors)?r.auditors.slice(0,3):['','',''];
  while(r.auditors.length<3)r.auditors.push('');

stedAt||'-'}</div></div>`;
}
function makeInvoiceNo(kind){return `${kind==='preAudit'?'DPA':'OSA'}-${new Date().toISOString().slice(0,10).replaceAll('-','')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}
function requestService(kind){const r=state.serviceRequests[kind];const invoiceNo=makeInvoiceNo(kind);const productIds=currentCertificationProductIds();r.requested=true;r.requestStatus='pending';r.paymentStatus='waiting';r.invoiceNo=invoiceNo;r.requestedAt=new Date().toLocaleString();state.invoiceRecords=Array.isArray(state.invoiceRecords)?state.invoiceRecords:[];state.invoiceRecords.push({id:makeId('inv'),kind,invoiceNo,amount:r.amount||'',requestStatus:r.requestStatus,paymentStatus:r.paymentStatus,requestedAt:r.requestedAt,notes:r.notes||'',auditors:(r.auditors||[]).slice(0,3),productIds,submissionType:state.app.submissionType});save();toast(t('newInvoiceGenerated'))}

function generateCertificateFromFatwa(){if(!canFatwaCommitteeAct()){toast(t('fatwaCommitteeOnly'));renderFatwa();return}const f=state.fatwa;if(f.status!=='approved'){toast(t('fatwaMustBeApproved'));renderFatwa();return}if(!f.halalDecisionConfirmed){toast(t('halalDecisionRequired'));renderFatwa();return}if(f.generatedCertificateId&&state.certificates.some(c=>c.id===f.generatedCertificateId)){toast(t('certificateAlreadyGenerated'));renderFatwa();return}const ids=fatwaSelectedProductIds();if(!ids.length){toast(t('noProductsSelected'));renderFatwa();return}if(!f.decisionNo)f.decisionNo='FD-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.floor(1000+Math.random()*9000);if(!f.decisionDate)f.decisionDate=new Date().toISOString().slice(0,10);state.certificates=Array.isArray(state.certificates)?state.certificates:[];let certNo=f.decisionNo.replace(/^FD/,'HC');if(!/^HC/.test(certNo))certNo='HC-'+certNo;const existingNos=new Set(state.certificates.map(c=>c.certificateNo).filter(Boolean));if(existingNos.has(certNo))certNo=certNo+'-'+Math.random().toString(36).slice(2,5).toUpperCase();const issueDate=f.decisionDate||new Date().toISOString().slice(0,10);const cert={id:makeId('cert'),certificateNo:certNo,productIds:ids,status:'active',issueDate,expiryDate:addYearsToDate(issueDate,4)};const emptyIndex=state.certificates.findIndex(c=>!c.certificateNo&&c.status==='pending');if(emptyIndex>=0)state.certificates[emptyIndex]=cert;else state.certificates.push(cert);state.products.forEach(p=>{if(ids.includes(p.id)){p.certificationFrozen=true;p.certifiedAt=issueDate}});const mids=currentCertificationMaterialIds(ids);state.materials.forEach(m=>{if(mids.includes(m.id)){m.certificationFrozen=true;m.certifiedAt=issueDate}});state.fatwa.generatedCertificateId=cert.id;state.productFreezeDecisionNo=f.decisionNo||cert.certificateNo;state.materialFreezeDecisionNo=f.decisionNo||cert.certificateNo;persist();renderAll();toast(t('certificateGenerated'))}

/* ===== v2 Dashboard (백엔드 연결: 이중경로 생애주기·blocker·다음조치) — renderDashboard 오버라이드 ===== */
const GM_STAGES=['신청·AI평가','경로판정','심사·검증','인증서','사후관리'];
const GM_BLK={PENYELIA_HALAL_MISSING:'할랄감독자(Penyelia) 미지정',CRITICAL_MATERIAL_NO_EVIDENCE:'임계원재료 증빙 없음',HARAM_INGREDIENT:'금지(haram) 성분 포함',SIHALAL_IDENTITY_UNVERIFIED:'SIHALAL 식별자 미연동',EXPIRED_CERTIFICATE:'만료된 인증서',PENDAMPING_NOT_VERIFIED:'Pendamping(자기선언) 미검증',FATWA_NOT_APPROVED:'fatwa/ketetapan 미승인',SCOPE_NOT_FROZEN:'인증 scope 미동결'};
function gmStage(s){if(['onboarding','application_draft','ai_pre_assessment_ready','ai_pre_assessment_running'].indexOf(s)>=0)return 0;if(s==='pathway_determination')return 1;if(s==='certificate_issued')return 3;if(['post_certification_monitoring','renewal_preparation','change_impact'].indexOf(s)>=0)return 4;return 2;}
async function renderDashboard(){const el=document.getElementById('dashboard');if(!el)return;
  if(typeof renderDashboardV1==='function'){try{renderDashboardV1()}catch(e){}}
  if(!glhacToken())return;
  let cases=[];
  try{cases=await glhacApi('/cases')}catch(e){el.innerHTML='<div class="card empty">백엔드 연결 실패</div>';return}
  const det=await Promise.all(cases.map(c=>glhacApi('/cases/'+c.case_id+'/timeline').catch(()=>null)));
  const sd=cases.filter(c=>c.pathway==='self_declare').length,rg=cases.filter(c=>c.pathway==='reguler').length;
  let blk=0;const blkAll={};det.forEach(d=>{if(d){blk+=d.blockers.length;d.blockers.forEach(b=>{blkAll[b.code]=(blkAll[b.code]||0)+1})}});
  const primary=cases[0];const pIdx=primary?gmStage(primary.status):0;
  const flow=GM_STAGES.map((s,i)=>'<div class="status-step '+(i<pIdx?'done':i===pIdx?'active':'')+'"><span class="status-dot"></span>'+s+'</div>').join('');
  const rows=cases.map((c,i)=>{const d=det[i];const nb=d?d.blockers.length:0;return '<tr><td><b>'+esc(c.company_name||c.case_id.slice(0,8))+'</b></td><td><span class="pill '+(c.pathway==='self_declare'?'green':c.pathway==='reguler'?'blue':'gray')+'">'+c.pathway+'</span></td><td>'+c.status+'</td><td>'+GM_STAGES[gmStage(c.status)]+'</td><td>'+(nb?'<span class="pill red">⛔ '+nb+'</span>':'<span class="pill green">✓</span>')+'</td></tr>'}).join('')||'<tr><td colspan="5" class="empty" style="border:0">케이스가 없습니다 — Application에서 생성하세요.</td></tr>';
  const actions=Object.keys(blkAll).length?Object.keys(blkAll).map(k=>'<div class="item"><div class="row"><b>'+(GM_BLK[k]||k)+'</b><span class="pill amber">'+blkAll[k]+'건</span></div></div>').join(''):'<div class="ai-box">✅ 주요 차단 요소가 없습니다. 공식 제출 전 최종 검토를 준비하세요.</div>';
  let av={count:0,integrity_ok:true};const pevs=(primary&&det[0])?det[0].events:[];
  let rd={readiness:0,band:'risk',breakdown:{}};
  if(primary){try{rd=await glhacApi('/cases/'+primary.case_id+'/readiness')}catch(e){}}
  const rgauge='<div class="card" style="margin-top:18px;border-left:5px solid #652672"><div class="ai-head"><b>📊 준비도 (Readiness)</b><span class="pill '+(rd.band==='ready'?'green':rd.band==='warn'?'amber':'red')+'">'+rd.readiness+'%</span></div><div style="height:16px;background:#ece6f1;border-radius:8px;overflow:hidden;margin:10px 0"><div style="height:100%;width:'+rd.readiness+'%;background:'+(rd.band==='ready'?'#27ae60':rd.band==='warn'?'#f39c12':'#e74c3c')+';transition:width .4s"></div></div><div class="actions"><span class="pill gray">문서 '+(rd.breakdown.documents||0)+'%</span><span class="pill gray">SJPH '+(rd.breakdown.sjph||0)+'%</span><span class="pill gray">원재료 '+(rd.breakdown.materials||0)+'%</span><span class="pill gray">심사 '+(rd.breakdown.audit||0)+'%</span></div></div>';
  if(primary){try{av=await glhacApi('/cases/'+primary.case_id+'/audit-verify')}catch(e){}}
  // S9-1: 대시보드 기한 경보
  let _fndAlarm=[];if(primary){try{_fndAlarm=await glhacApi('/cases/'+primary.case_id+'/findings')}catch(e){}}
  var _dNow=new Date();_dNow.setHours(0,0,0,0);
  var _fOvd=_fndAlarm.filter(function(f){if(f.status==='closed'||!f.due_date)return false;var d=new Date(f.due_date);d.setHours(0,0,0,0);return d<_dNow;});

function glhacFillDocNames(docs){if(typeof state==='undefined'||!state.app)return;
  ['businessCertName','factoryCertName','halalCertName'].forEach(function(f){if((state.app[f]||'').toLowerCase().indexOf('.zip')>=0)state.app[f]='';});
  var byType={};(docs||[]).forEach(function(d){if(!d||!d.doc_type)return;(byType[d.doc_type]=byType[d.doc_type]||[]).push(d.filename);});
  var map={nib_business_license:'businessCertName',factory_registration:'factoryCertName',halal_certificate:'halalCertName'};
  Object.keys(map).forEach(function(dt){if(byType[dt]&&byType[dt].length)state.app[map[dt]]=byType[dt].join(', ');});
  if(byType['quality_cert']&&byType['quality_cert'].length)state.app.acquiredCerts=byType['quality_cert'];
  if(byType['coa_msds']&&byType['coa_msds'].length){state.app.acquiredCerts=(state.app.acquiredCerts||[]).concat(byType['coa_msds']);}
}

  const dtbl=docs.length?'<table style="margin-top:12px"><thead><tr><th>파일</th><th>분류</th><th>conf</th><th>추출 필드 (OCR)</th><th>검수</th></tr></thead><tbody>'+docs.map(function(d){

    return '<tr><td>'+esc(d.filename)+(d.has_file?' <button class="btn small" onclick="glhacViewDoc(\''+d.document_id+'\')">📥 열기</button>':'')+'</td><td>'+(glhacCan('doc_review')?'<select onchange="glhacReclassify(\''+d.document_id+'\',this.value)">'+glhacEnumOpts('doc_type',d.doc_type)+'</select>':'<span class="pill blue">'+esc(d.doc_type||'-')+'</span>')+'</td><td>'+(d.confidence||0)+'</td><td style="font-size:12px">'+flds+'</td><td><span class="pill '+rb+'">'+rs+'</span>'+glhacBtn('doc_review','<div class="actions" style="margin-top:4px"><button class="btn small primary" onclick="glhacReviewDoc(\''+d.document_id+'\',\'approved\')">승인</button><button class="btn small red" onclick="glhacReviewDoc(\''+d.document_id+'\',\'rejected\')">반려</button><button class="btn small" onclick="glhacReviewDoc(\''+d.document_id+'\',\'rework\')">재작업</button></div>')+'</td></tr>';
  }).join('')+'</tbody></table>':'';
  const cl='<div class="list" style="margin-top:8px">'+ck.checklist.map(function(c){return '<div class="item"><div class="row"><b>'+(c.satisfied?'✅ ':'⛔ ')+c.doc_type_ko+'</b><span class="mini-muted">'+(c.files.map(function(f){return esc(f.filename)}).join(', ')||'없음')+'</span></div></div>'}).join('')+'</div>';
  // S13-1: 검수 요약 카드
  el.insertAdjacentHTML('beforeend',glhacDocSummaryCard(docs,ck));
  const html='<div class="card" style="margin-top:18px;border-left:5px solid #652672"><div class="ai-head"><b>📦 압축파일 자동 분류 + 검수 (Document Intake AI)</b><span class="pill purple">v2</span></div>'
   +'<p class="hint">ZIP/개별 서류 → 파싱(OCR/PDF/DOCX)·AI분류·필수서류 라우팅·신청서 자동채움. 추출 필드 확인 후 검수(승인/반려/재작업).</p>'
   +'<div class="actions"><input type="file" id="gmZip" accept=".zip" style="width:auto"/><button class="btn primary" onclick="glhacIntakeZip()">업로드 + 자동 분류</button></div>'
   +'<div class="expl" id="gmZipOut" style="display:none;margin-top:12px"></div>'+dtbl+'</div>'
   +'<div class="card" style="margin-top:18px"><h3>필수서류 체크리스트</h3><p class="hint">누락: '+(ck.missing.join(', ')||'없음')+'</p>'+cl+'</div>';
  el.insertAdjacentHTML('beforeend',html);

async function glhacViewDoc(id){try{const resp=await fetch('/documents/'+id+'/file',{headers:{'Authorization':'Bearer '+glhacToken()}});if(!resp.ok){toast('파일을 열 수 없습니다');return;}const blob=await resp.blob();const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(function(){URL.revokeObjectURL(url)},60000);}catch(e){toast('열기 실패')}}
async function glhacReclassify(id,dt){try{await glhacApi('/documents/'+id+'/reclassify',{method:'PATCH',body:JSON.stringify({doc_type:dt})});toast('재분류: '+dt);renderDocuments();}catch(e){toast('재분류 실패')}}
async function glhacReviewDoc(id,status){try{await glhacApi('/documents/'+id+'/review',{method:'PATCH',body:JSON.stringify({review_status:status})});renderDocuments();}catch(e){toast('검수 실패: '+JSON.stringify(e))}}
async function glhacIntakeZip(inputId,outId){
  inputId=inputId||'gmZip';outId=outId||'gmZipOut';
  const fi=document.getElementById(inputId);const f=fi&&fi.files[0];if(!f){toast('ZIP 파일을 선택하세요');return}
  const o=document.getElementById(outId);o.style.display='block';
  o.innerHTML='<div class="mini-muted">압축 해제·파싱 준비중… (gemma3 추론)</div>'
    +'<div style="height:16px;background:#ece6f1;border-radius:8px;overflow:hidden;margin:8px 0"><div id="'+outId+'_bar" style="height:100%;width:0%;background:linear-gradient(90deg,#652672,#9b59b6);transition:width .3s"></div></div>'
    +'<div id="'+outId+'_pct" class="mini-muted">0%</div>';
  const setP=function(pct,msg){const bar=document.getElementById(outId+'_bar');const p=document.getElementById(outId+'_pct');if(bar)bar.style.width=pct+'%';if(p)p.textContent=msg};
  const b=await f.arrayBuffer();const b64=gmAb2b64(b);
  let cid;try{cid=await glhacEnsureCase()}catch(e){o.textContent='케이스를 만들 수 없습니다';return}
  let res=null;
  try{
    const resp=await fetch('/cases/'+cid+'/intake-zip-stream',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+glhacToken()},body:JSON.stringify({zip_b64:b64})});
    if(!resp.ok||!resp.body){o.textContent='업로드 실패 ('+resp.status+')';return}
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    for(;;){const rd=await reader.read();if(rd.done)break;buf+=dec.decode(rd.value,{stream:true});let nl;
      while((nl=buf.indexOf('\n'))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;
        let ev;try{ev=JSON.parse(line)}catch(_){continue}
        if(ev.type==='start'){setP(2,'총 '+ev.total+'개 파일 분류 시작…');}
        else if(ev.type==='progress'){const pct=Math.max(3,Math.round(ev.done/ev.total*100));setP(pct,pct+'%  ('+ev.done+'/'+ev.total+')  '+ev.file+' → '+ev.doc_type_ko);}
        else if(ev.type==='result'){res=ev;setP(100,'100% — 자동작성·임시저장 중…');}
      }
    }
  }catch(e){o.textContent='실패: '+JSON.stringify(e);return}
  if(!res){o.textContent='결과를 받지 못했습니다';return}
  const r=res;const ap=r.applied||{};
  if(r.extracted&&typeof state!=='undefined'&&state.app){if(r.extracted.company_name)state.app.businessName=r.extracted.company_name;if(r.extracted.nib)state.app.nib=r.extracted.nib;if(typeof persist==='function')persist();}
  const summary='✅ '+r.file_count+'개 파일 분류 완료\n\n[분류]\n'+r.classified.map(function(d){return '· '+d.filename+' → '+d.doc_type_ko+' (conf '+d.confidence+')'}).join('\n')
    +'\n\n[필수서류 라우팅]\n'+r.checklist.map(function(c){return (c.satisfied?'✅ ':'⛔ ')+c.doc_type_ko+(c.files.length?' ['+c.files.join(', ')+']':'')}).join('\n')
    +'\n\n누락: '+(r.missing.join(', ')||'없음')
    +'\n\n[신청서 자동작성] 회사 '+(ap.company_set?'설정':'유지')+' · NIB '+(ap.nib_set?'설정':'유지')+' · 제품 '+(ap.products||0)+'건 · 원재료 '+(ap.materials||0)+'건  →  💾 임시저장 완료';
  o.innerHTML='<div style="height:16px;background:#ece6f1;border-radius:8px;overflow:hidden;margin:8px 0"><div style="height:100%;width:100%;background:linear-gradient(90deg,#27ae60,#2ecc71)"></div></div><pre style="white-space:pre-wrap;margin:6px 0 0;font-size:12px">'+esc(summary)+'</pre>';
  try{glhacMarkSaved(cid)}catch(_){}
  toast('분류·자동작성·임시저장 완료');
  if(typeof renderApplication==='function')renderApplication();
  if(typeof renderDocuments==='function')renderDocuments();
}

  el.innerHTML=(function(){var _r=(typeof glhacRole==='function')?glhacRole():'';var _isApp=_r==='applicant';return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><h3>📋 '+(_isApp?'내 케이스 / My Cases':'전체 신청내역 / All Applications')+'</h3><p class="hint">'+(_isApp?'인증 완료·진행중·임시저장 케이스를 한눈에 보고 선택해 작업합니다.':'전체 신청서를 완료·진행중·임시저장별로 조회합니다.')+'</p></div>';})()+glhacBtn('case_create','<button class="btn primary" onclick="glhacNewCaseFromList()">+ 새 신청 시작</button>')+'</div>'

function glhacDueDays(d){if(!d)return null;var now=new Date();now.setHours(0,0,0,0);return Math.round((new Date(d)-now)/(1000*60*60*24));}

/* ===== v2 Audit (S3: 체크리스트·심사원풀·LPH레퍼런스·area드롭다운) — renderAudit 오버라이드 ===== */

  const areaOpts=glhacEnumOpts('finding_area');
  const sevOpts=glhacEnumOpts('finding_severity');
  const lphOpts='<option value="">직접입력</option>'+(lphrefs.map(function(x){return '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>'}).join(''));
  var clRows=cl.items.map(function(item){var rc={'comply':'green','nonconformity':'red','not_checked':'gray'}[item.result]||'gray';var mk=item.item_key.replace(/[^a-z0-9_]/gi,'');return '<tr><td>'+esc(item.label)+'</td><td><select data-key="'+esc(item.item_key)+'" onchange="glhacOnsiteUpdate(\''+esc(item.item_key)+'\',this.value,document.getElementById(\'ocn_'+mk+'\').value)"><option value="not_checked"'+(item.result==='not_checked'?' selected':'')+'>미점검</option><option value="comply"'+(item.result==='comply'?' selected':'')+'>적합</option><option value="nonconformity"'+(item.result==='nonconformity'?' selected':'')+'>부적합</option></select></td><td><input id="ocn_'+mk+'" value="'+esc(item.note||'')+'" placeholder="비고" onblur="glhacOnsiteUpdate(\''+esc(item.item_key)+'\',this.parentElement.parentElement.querySelector(\'select\').value,this.value)"/></td><td><span class="pill '+rc+'">'+item.result+'</span></td></tr>'}).join('');
  var poolRows=pool.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td><span class="pill '+(x.role_in_team==='ketua'?'purple':'gray')+'">'+esc(x.role_in_team)+'</span></td><td>'+esc(x.cert_no||'-')+'</td><td>'+glhacBtn('lph_assign','<button class="btn small red" onclick="glhacDelAuditor(\''+x.id+'\')">삭제</button>')+'</td></tr>'}).join('')||'<tr><td colspan="4" class="empty" style="border:0">배정 없음 (최대 3명)</td></tr>';
  const html='<div class="card" style="margin-top:18px;border-left:5px solid #652672"><div class="ai-head"><b>🔗 심사 지적 + LPH + 체크리스트 (백엔드)</b><span class="pill purple">v2+S3</span></div>'
   +'<div class="actions" style="margin-bottom:8px"><span class="pill '+(openMajor?'red':'green')+'">미해결 major '+openMajor+'</span>'+(overdueF?'<span class="pill red">⚠ 기한초과 '+overdueF+'건</span>':'')+(imminentF?'<span class="pill amber">⚡ 임박 '+imminentF+'건</span>':'')+'<span class="pill gray">LPH: '+(lph.map(function(x){return esc(x.lph_name)}).join(', ')||'미배정')+'</span></div>'
   +glhacBtn('finding_edit','<div class="form-row three" style="margin-bottom:6px"><select id="afArea"><option value="">지적영역</option>'+areaOpts+'</select><input id="afFind" placeholder="지적 내용"/><select id="afSev"><option value="minor">minor</option>'+sevOpts+'</select></div>'
   +'<div class="form-row three" style="margin-bottom:8px"><input id="afCA" placeholder="시정조치"/><input id="afDue" placeholder="기한(YYYY-MM-DD)"/><button class="btn primary" onclick="glhacAddFinding()">지적 추가</button></div>')
   +'<div class="form-row two" style="margin:6px 0"><select id="afFilterSev" onchange="glhacAuditFilter()"><option value="">모든 심각도</option><option value="major">major</option><option value="minor">minor</option><option value="observation">observation</option></select><select id="afFilterSt" onchange="glhacAuditFilter()"><option value="">모든 상태</option><option value="open">open</option><option value="closed">closed</option></select></div>'
   +'<table id="auditFndTable"><thead><tr><th>영역</th><th>지적</th><th>심각도</th><th>시정조치</th><th>기한</th><th>상태</th><th></th></tr></thead><tbody>'+frows+'</tbody></table>'
   +glhacBtn('lph_assign','<div style="margin-top:12px"><b>LPH 배정</b><div class="form-row" style="margin-top:6px"><select id="lphSel" onchange="document.getElementById(\'lphName\').value=this.value">'+lphOpts+'</select><input id="lphName" placeholder="직접입력"/><input id="lphAud" placeholder="심사원(선택)"/><button class="btn" onclick="glhacAddLph()">배정</button></div></div>')
   +'<div style="margin-top:16px"><b>심사원 풀 (최대 3명) — S3-5</b><table style="margin-top:6px"><thead><tr><th>이름</th><th>역할</th><th>자격번호</th><th></th></tr></thead><tbody>'+poolRows+'</tbody></table>'

   +'</div>';
  el.insertAdjacentHTML('beforeend',html+'<div id="glhacMiniDisc_audit"></div>');
  glhacMiniDiscussion('audit','glhacMiniDisc_audit');

    +'</div>'

async function renderWorkflow(){const el=document.getElementById('workflow');if(!el)return;
  if(!glhacToken()){el.innerHTML='<div class="card empty">로그인이 필요합니다.</div>';return}
  var BLK=(typeof GM_BLK!=='undefined')?GM_BLK:{};
  var BLK_ACT={PENYELIA_HALAL_MISSING:'조직 > Penyelia Halal 지정',CRITICAL_MATERIAL_NO_EVIDENCE:'원재료 > 해당 성분 증빙 업로드',HARAM_INGREDIENT:'원재료 > haram 성분 대체/제거',SIHALAL_IDENTITY_UNVERIFIED:'신청 > SIHALAL EID 연동',EXPIRED_CERTIFICATE:'인증서 > 만료 인증서 갱신',PENDAMPING_NOT_VERIFIED:'심사 > Pendamping(동반자) 검증',FATWA_NOT_APPROVED:'Fatwa > 위원회 승인 처리',SCOPE_NOT_FROZEN:'Fatwa > 제품 scope 동결',PAYMENT_REQUIRED:'인보이스 > 결제 완료'};
  let cid,w,tl={events:[]};try{cid=await glhacEnsureCase();[w,tl]=await Promise.all([glhacApi('/cases/'+cid+'/workflow'),glhacApi('/cases/'+cid+'/timeline').catch(function(){return {events:[]};})])}catch(e){el.innerHTML='<div class="card empty">백엔드 연결 실패</div>';return}
  var steps=w.phases.map(function(p){var c={done:'green',current:'purple',pending:'gray'}[p.status];var ic={done:'✅',current:'▶',pending:'○'}[p.status];
    return '<div style="flex:1;min-width:130px;text-align:center"><div style="height:6px;border-radius:3px;background:'+(p.status==='pending'?'#e0e0e0':'#652672')+'"></div><div style="margin-top:8px"><span class="pill '+c+'">'+ic+' '+esc(p.label)+'</span></div><div class="mini-muted" style="font-size:11px;margin-top:5px;line-height:1.5">'+p.states.map(function(s){return (s.code===w.state?'<b style="color:#652672">'+esc(s.label)+'</b>':esc(s.label))}).join('<br>')+'</div></div>';
  }).join('<div style="align-self:center;color:#bbb">›</div>');
  var nexts=w.next_states.map(function(n){return '<div style="margin:4px 0"><button class="btn '+(n.allowed?'primary':'')+'" '+(n.allowed?'':'disabled')+' onclick="glhacAdvance(\''+n.to+'\')">'+(n.allowed?'▶ ':'⛔ ')+esc(n.to_label)+'</button>'+(n.blockers&&n.blockers.length?' <span class="mini-muted">('+n.blockers.map(function(b){return esc(BLK[b.code]||b.code)+(b.target?': '+esc(b.target):'')}).join(', ')+')</span>':'')+'</div>'}).join('')||'<span class="mini-muted">다음 단계 없음(종료/말단 상태)</span>';
  el.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><h3>🔀 인증 워크플로우 (여정)</h3><p class="hint">BPJPH 인증 절차 진행 상황 · 현재: <b>'+esc(w.state_label)+'</b> · 경로: <span class="pill '+(w.pathway==='self_declare'?'green':w.pathway==='reguler'?'purple':'gray')+'">'+esc(w.pathway)+'</span></p></div></div>'
    +'<div style="display:flex;gap:8px;overflow-x:auto;margin:16px 0 4px;align-items:stretch;padding-bottom:8px">'+steps+'</div></div>'
    +'<div class="card" style="margin-top:14px"><h3>다음 단계로 진행</h3><p class="hint">가드/차단사유가 없어야 다음 상태로 전이됩니다.</p><div style="margin-top:8px">'+nexts+'</div></div>'
    +'<div class="card" style="margin-top:14px"><h3>현재 차단 사유 (Blockers)</h3>'+(w.blockers.length?w.blockers.map(function(b){return '<span class="pill red">⛔ '+esc(BLK[b.code]||b.code)+(b.target?': '+esc(b.target):'')+'</span> '}).join(''):'<span class="pill green">✓ 차단 없음</span>')+'</div>';
  // S11-1: 블로커 상세 조치 안내 + 이벤트 이력
  var blkDetail=w.blockers.length?w.blockers.map(function(b){return '<div class="item"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><span><b>⛔ '+esc(BLK[b.code]||b.code)+'</b>'+(b.target?' <span class="mini-muted">— '+esc(b.target)+'</span>':'')+'</span><span class="pill amber" style="font-size:10px">👉 '+esc(BLK_ACT[b.code]||'확인 필요')+'</span></div></div>';}).join(''):'<div class="item"><span class="pill green">✓ 모든 차단 해소됨</span></div>';
  el.insertAdjacentHTML('beforeend','<div class="card" style="margin-top:14px;border-left:5px solid #652672"><div class="ai-head"><b>🔍 차단 사유 조치 안내 — S11-1</b><span class="pill '+(w.blockers.length?'red':'green')+'">'+w.blockers.length+'건</span></div><div class="list">'+blkDetail+'</div></div>');
  var evts=(tl.events||[]).slice(-8).reverse();var evHtml=evts.length?evts.map(function(e){return '<div class="event"><div class="dot done"></div><div><b>'+(e.from||'∅')+' → '+e.to+'</b><div class="mini-muted">'+esc(e.action||'')+' · '+esc(e.actor||'')+' · '+(e.at||'').slice(0,16)+'</div></div></div>';}).join(''):'<div class="mini-muted" style="padding:8px">전이 기록 없음</div>';
  el.insertAdjacentHTML('beforeend','<div class="card" style="margin-top:14px"><div class="ai-head"><b>📅 최근 상태 전이 이력</b><span class="pill gray">최근 '+evts.length+'건</span></div><div class="timeline" style="max-height:220px;overflow-y:auto">'+evHtml+'</div></div>');
}

/* v3: 모의 심사(mockAudit) — 클라이언트 미노출(내부 심사). 대상 큐(API) + 체크리스트 + 통과/거부(API). */
async function renderMockAudit(){
  var el=document.getElementById('mockAudit'); if(!el) return;
  var role=(typeof glhacRole==='function')?glhacRole():'';
  if(role==='applicant'){ el.innerHTML='<div class="card empty">'+esc(t('nav_mockAudit'))+' — 접근 권한이 없습니다 · No access</div>'; return; }
  if(!glhacToken()){ el.innerHTML='<div class="card empty">로그인이 필요합니다 · Login required</div>'; return; }
  el.innerHTML=''
   +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">'
   +  '<div><h3>🧷 '+esc(t('nav_mockAudit'))+'</h3><p class="hint">'+esc(t('desc_mockAudit'))+'</p></div>'
   +  '<span class="pill amber">내부 심사 · Internal (클라이언트 미노출)</span></div>'
   +  '<div id="mockAuditQueue" style="margin-top:12px">불러오는 중… · Loading…</div></div>'
   +'<div class="grid cols-2" style="margin-top:16px">'
   +  '<div class="card"><h3>제출 자료 · Submitted media</h3>'
   +    '<div id="mockAuditGallery"><div class="empty">케이스를 선택하세요 · Select a case</div></div></div>'
   +  '<div class="card"><h3>체크리스트 · 판정 · Decision</h3>'
   +    '<p class="hint">선택 케이스 · Selected: <b id="mockAuditSel">'+esc(window.__mockAuditSel||'(없음)')+'</b></p>'
   +    '<div class="actions" style="margin-top:12px">'
   +      '<button class="btn green" onclick="mockAuditDecide(\'pass\')">통과 · Pass</button> '
   +      '<button class="btn red" onclick="mockAuditDecide(\'reject\')">거부(사유) · Reject</button>'
   +    '</div>'
   +    '<div style="margin-top:14px"><b style="font-size:12px">판정 이력 · History</b>'
   +      '<div id="mockAuditHistory" class="list"><div class="empty">—</div></div></div>'
   +    '</div>'
   +'</div>';
  var rows=[]; try{ rows=await glhacApi('/mock-audit/queue'); }catch(e){ rows=[]; }
  if(!window.__mockAuditSel && rows[0]) window.__mockAuditSel=rows[0].case_id;
  if(typeof dlRender==='function'){
    dlRender('mockAuditQueue',{idKey:'case_id',
      columns:[{key:'case_id',label:'케이스'},{key:'company',label:'기업'},{key:'stage',label:'단계',sort:true},{key:'pathway',label:'경로'}],
      rows:rows, empty:'모의심사 대상이 없습니다 · No targets', onRow:"mockAuditSelect('{id}')"});
  }
  if(window.__mockAuditSel) mockAuditSelect(window.__mockAuditSel);
}
async function mockAuditSelect(id){
  window.__mockAuditSel=id;
  var s=document.getElementById('mockAuditSel'); if(s)s.textContent=id;
  // 제출 자료(문서) 갤러리
  var g=document.getElementById('mockAuditGallery');
  if(g){ try{ var docs=await glhacApi('/cases/'+id+'/documents');
      g.innerHTML = (docs&&docs.length)
        ? '<div class="list">'+docs.map(function(d){return '<div class="item"><b>📄 '+esc(d.filename||d.doc_type||'문서')+'</b> <span class="pill '+((d.review_status==='approved')?'green':(d.review_status==='rejected')?'red':'gray')+'">'+esc(d.review_status||'-')+'</span></div>';}).join('')+'</div>'
        : '<div class="empty">제출 문서 없음 · No documents</div>';
    }catch(e){ g.innerHTML='<div class="empty">불러오기 실패</div>'; } }
  // 판정 이력
  var h=document.getElementById('mockAuditHistory');
  if(h){ try{ var mh=await glhacApi('/cases/'+id+'/mock-audit'); var ds=(mh&&mh.decisions)||[];
      h.innerHTML = ds.length
        ? ds.map(function(x){return '<div class="item"><span class="pill '+((x.result==='pass')?'green':'red')+'">'+esc(x.result||'-')+'</span> '+(x.reason?esc(x.reason):'')+' <span class="mini-muted">'+esc((x.at||'').slice(0,19))+' · '+esc(x.actor||'')+'</span></div>';}).join('')
        : '<div class="empty">판정 이력 없음 · No decisions</div>';
    }catch(e){ h.innerHTML='<div class="empty">—</div>'; } }
}
async function mockAuditDecide(kind){
  var cid=window.__mockAuditSel; if(!cid){ alert('큐에서 케이스를 먼저 선택하세요 · Select a case'); return; }
  var reason=''; if(kind==='reject'){ reason=prompt('거부 사유 · Reject reason')||''; if(!reason.trim())return; }
  try{ var r=await glhacApi('/cases/'+cid+'/mock-audit/decision',{method:'POST',body:JSON.stringify({result:kind,reason:reason})});
       alert('완료 · Done: '+r.result); renderMockAudit(); }
  catch(e){ alert('실패 · Failed: '+(e&&e.code?e.code:JSON.stringify(e))); }
}
