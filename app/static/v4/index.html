<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 할랄인증 지원시스템</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#f3f6f3; --surface:#ffffff; --sunken:#e9f0ea; --ink:#151515; --ink-2:#474745; --ink-3:#83827d;
  --line:#d6e2d8; --line-2:#b5c9b9; --on-ink:#ffffff;
  --brand:#1f5a38; --brand-hover:#2a6e47; --brand-deep:#16452b; --brand-soft:#eaf3ec; --brand-line:#bcd5c4; --brand-text:#1f5a38; --on-brand:#ffffff; --gold:#c9b24a;
  --r:10px; --rl:16px;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1a1a1a; --sunken:#232322; --ink:#efeeea; --ink-2:#c2c1bb; --ink-3:#8b8a84;
    --line:#2c3a30; --line-2:#44574a; --on-ink:#121212; color-scheme:dark;
    --brand:#2c7a4e; --brand-hover:#35905c; --brand-deep:#123522; --brand-soft:#18261c; --brand-line:#2f4d39; --brand-text:#86cfa3; --on-brand:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1a1a1a; --sunken:#232322; --ink:#efeeea; --ink-2:#c2c1bb; --ink-3:#8b8a84;
  --line:#2c3a30; --line-2:#44574a; --on-ink:#121212; color-scheme:dark;
    --brand:#2c7a4e; --brand-hover:#35905c; --brand-deep:#123522; --brand-soft:#18261c; --brand-line:#2f4d39; --brand-text:#86cfa3; --on-brand:#ffffff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-0.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px}
.logo-img{width:40px;height:auto;flex:none;display:block}
.brand-lg{gap:14px}
.brand-lg .logo-img{width:64px}
.brand-lg .wordmark b{font-size:22px}
.brand-lg .wordmark span{font-size:12px}
.wordmark{display:flex;flex-direction:column;line-height:1.1}
.wordmark b{font-size:16px;letter-spacing:.06em}
.wordmark span{font-size:10.5px;letter-spacing:.04em;opacity:.7}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:var(--r);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--sunken)}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-ghost{border-color:var(--line-2);color:var(--ink-2)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-lg{padding:13px 22px;font-size:15px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .req,.req{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-3);margin-left:4px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);outline:none;min-width:0}
.in:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.in[readonly]{background:var(--sunken);color:var(--ink-2)}
textarea.in{resize:vertical;min-height:84px}
.help{font-size:12px;color:var(--ink-3)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}
.span-2{grid-column:span 2}
.inline{display:flex;gap:8px}
.inline .in{flex:1}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13.5px}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--ink);flex:none}
.fieldset{border:0;border-top:1px solid var(--ink);padding:18px 0 0;margin:0;display:flex;flex-direction:column;gap:16px}
.fieldset>legend{padding:0 10px 0 0;font-weight:600;font-size:15px}
.fieldset>legend .eyebrow{margin-right:8px}
.inline-msg{font-size:12.5px;min-height:18px}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100vh}
.login-brand{background:var(--ink);color:var(--on-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:40px;padding:40px clamp(24px,4vw,56px)}
.login-brand h1{font-size:clamp(30px,3.6vw,46px);line-height:1.18;font-weight:700;letter-spacing:-.02em}
.login-brand .lead{opacity:.75;max-width:34ch;margin-top:16px;font-size:15px}
.brand-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:11.5px}
.brand-foot .muted{color:inherit;opacity:.55}
.login-brand .lang select{background:transparent;color:var(--on-ink);border-color:color-mix(in srgb,var(--on-ink) 40%,transparent)}
.login-brand .lang select option{color:#151515;background:#fff}
.login-main{padding:56px clamp(16px,5vw,80px);display:flex;flex-direction:column;justify-content:center}
.login-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
.signup-card{width:100%;max-width:760px;display:flex;flex-direction:column;gap:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{padding:12px 10px;background:var(--surface);border:0;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left}
.seg button+button{border-left:1px solid var(--ink)}
.seg button small{font-size:11.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.7}
.role-groups{display:flex;flex-direction:column;gap:12px}
.role-group{display:flex;flex-direction:column;gap:6px}
.seg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.dist{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-top:2px solid var(--ink)}
.dist>div{padding:12px 10px 14px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.dist>div+div{padding-left:10px;border-left:1px solid var(--line)}
.dist .n{font-family:var(--mono);font-size:28px;line-height:1.1}
.dist .l{font-size:12px;color:var(--ink-2)}
.dist .bar{height:3px;background:var(--line)}
.dist .bar i{display:block;height:100%;background:var(--ink)}
.vote{display:flex;gap:8px;flex-wrap:wrap}
.vote label{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.vote input{accent-color:var(--ink)}
.vote label:has(input:checked){border-color:var(--ink);font-weight:600}
.back{align-self:flex-start}
.banner{border:1px solid var(--ink);padding:14px 16px;border-radius:var(--r);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.demo-note{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- consultant picker ---------- */
.picker-results{border:1px solid var(--line-2);border-radius:var(--r);max-height:220px;overflow-y:auto;background:var(--surface)}
.picker-results button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.picker-results button:last-child{border-bottom:0}
.picker-results button:hover{background:var(--sunken)}
.picker-results button.on{background:var(--ink);color:var(--on-ink)}
.picker-results button.on .muted{color:inherit;opacity:.7}
.picked{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.side-brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.side-ws{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.side-nav{display:flex;flex-direction:column;padding:12px 0;flex:1}
.nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 20px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-2);border-left:3px solid transparent;font-size:14px}
.nav-item:hover{color:var(--ink);background:var(--sunken)}
.nav-item.on{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
.count{font-family:var(--mono);font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--on-ink);display:inline-grid;place-items:center}
.side-foot{padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface);position:sticky;bottom:0}
.side-user{display:flex;flex-direction:column;font-size:13px;padding-bottom:6px}
.side-user span{font-size:12px;color:var(--ink-3)}
.lang{display:flex;align-items:center;gap:8px;font-size:12px;color:inherit}
.lang span{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;opacity:.7}
.lang select{flex:1;padding:7px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer}
.main{min-width:0;display:flex;flex-direction:column}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:28px 36px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.page-head h1{font-size:24px;margin-top:4px}
.head-meta{font-size:13px;color:var(--ink-2)}
.page{padding:28px 36px 56px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}

/* ---------- blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:16px}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.summary>div{padding:14px 16px 16px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.summary>div+div{padding-left:16px;border-left:1px solid var(--line)}
.summary .k{font-size:12px;color:var(--ink-3)}
.summary .v{font-size:16px;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:36px;font-weight:500;line-height:1}
.kpi .v small{font-family:var(--font);font-size:14px;font-weight:500;margin-left:4px;color:var(--ink-3)}
.kpi button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.kpi button:hover .k{color:var(--ink);text-decoration:underline}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line-2);border-radius:999px;font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.badge.attn{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.badge.strong{border-color:var(--ink);color:var(--ink)}

.note{border-left:3px solid var(--line-2);padding:10px 14px;background:var(--sunken);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.note.attn{border-left-color:var(--ink)}
.note b{font-size:12px;letter-spacing:.04em}

.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.row-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:18px 0;color:var(--ink-3);font-size:13px}

.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;margin:0}
.dl div{display:flex;flex-direction:column;gap:3px;min-width:0}
.dl dt{font-size:12px;color:var(--ink-3)}
.dl dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}

/* stepper */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));row-gap:22px}
.st{position:relative;padding:24px 8px 0 0;display:flex;flex-direction:column;gap:1px;min-width:0}
.st::before{content:"";position:absolute;top:7px;left:0;right:0;height:1px;background:var(--line-2)}
.st.done::before{background:var(--ink);height:2px;top:6px}
.st-node{position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);z-index:1}
.st.done .st-node{background:var(--ink);border-color:var(--ink)}
.st.cur .st-node{border:4.5px solid var(--ink)}
.st-no{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.st-label{font-size:13px;line-height:1.3}
.st.todo .st-label{color:var(--ink-3)}
.st.cur .st-label{font-weight:700}
.st-state{margin-top:6px;align-self:flex-start;font-size:10.5px;padding:1px 6px;border:1px solid var(--ink);border-radius:2px;font-weight:600}
.st-state.attn{background:var(--ink);color:var(--on-ink)}

/* company cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);transition:border-color .15s}
.ccard:hover,.ccard:focus-visible{border-color:var(--ink)}
.ccard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard h3{font-size:17px}
.ccard .issue{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:10px}
.ccard .issue span:last-child{white-space:nowrap;font-weight:600;color:var(--ink)}
.minibar{display:flex;gap:3px}
.minibar i{flex:1;height:4px;background:var(--line)}
.minibar i.d{background:var(--ink)}
.minibar i.c{background:var(--ink-3)}

/* master list */
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.mlist .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.mitem{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;border-left:3px solid transparent}
.mitem:last-child{border-bottom:0}
.mitem:hover{background:var(--sunken)}
.mitem.on{border-left-color:var(--ink);background:var(--sunken)}
.mitem .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.mitem .p{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-3);padding:10px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td .in{padding:7px 9px}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mark{font-family:var(--mono);font-size:15px;width:22px;display:inline-block;text-align:center}

/* AI */
.ai-box{border:1px solid var(--ink);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ai-sum{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.ai-sum b{font-family:var(--mono);font-size:18px;margin-left:4px}

/* quote */
.q-sum{border-top:2px solid var(--ink)}
.q-sum div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.q-sum div span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.q-sum .tot{border-bottom:2px solid var(--ink);font-weight:700;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.opts .check span.mono{margin-left:auto;color:var(--ink-3);font-size:12px}
.opts .check{align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}

/* chat */
.chat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);height:560px;min-width:0}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chat-head b{font-size:15px}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.msg{display:flex;flex-direction:column;gap:4px;max-width:78%}
.msg .meta{font-size:11.5px;color:var(--ink-3)}
.msg .bub{padding:10px 14px;border:1px solid var(--line-2);border-radius:10px 10px 10px 2px;background:var(--surface);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--ink);color:var(--on-ink);border-color:var(--ink);border-radius:10px 10px 2px 10px}
.sys{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--line)}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.chip{border:1px solid var(--line-2);background:none;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.profile{display:flex;flex-direction:column;gap:16px}
.profile .name{font-size:24px;font-weight:700}
.avatar{width:56px;height:56px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600}

.action-bar{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.action-bar .row-act{margin-left:auto}
.linkbox{display:flex;flex-direction:column;gap:12px;border:1px solid var(--ink);border-radius:6px;padding:18px}
.sms{font-size:12.5px;background:var(--sunken);padding:12px 14px;border-radius:var(--r);white-space:pre-wrap;color:var(--ink-2)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);overflow-y:auto;padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex}
.dialog{margin:auto;width:100%;max-width:580px;background:var(--surface);border:1px solid var(--ink);border-radius:6px;display:flex;flex-direction:column}

    return `<li class="st ${st}"><span class="st-node"></span><span class="st-no">${pad(i+1)}</span><span class="st-label">${s}</span>${i===idx?`<span class="st-state ${hold?'attn':''}">${hold?'보완 요청':'진행 중'}</span>`:''}</li>`; }).join('')}</ol>`;
}

function calcQuote(q){
  const extra = Math.max(0,(+q.items||1)-1) * (+q.perItem||0);
  const opt = OPTS.reduce((s,[k,,p]) => s + (q.opts[k]?p:0), 0);
  const sub = (+q.base||0) + extra + opt + (+q.travel||0);
  const disc = Math.round(sub * (+q.discount||0) / 100);
  const supply = sub - disc; const vat = Math.round(supply*0.1);
  return {extra,opt,sub,disc,supply,vat,total:supply+vat};
}

const NAV = {ent:['ent-home','ent-pre','ent-apply','ent-contract','ent-docs','ent-consultant'], cons:['cons-home','cons-new','cons-status','cons-contract','cons-docs','cons-qna'],
  aud:['aud-home','aud-flow','aud-inbox','aud-pre','aud-contract','aud-schedule','aud-mock','aud-report','aud-final','aud-cert','aud-eval','aud-materials','aud-aiq','aud-resubmit'], sha:['sha-home','sha-review','sha-history'], adm:['adm-home','adm-members','adm-experts','adm-assign','adm-price','adm-contract','adm-docs','adm-cert']};
const NAV_GROUP = {aud:{'aud-home':'개요','aud-inbox':'인증 프로세스','aud-eval':'심사 도구'}};
const myAudits = () => DB.companies.filter(c=>c.auditorId===S.userId);
const myTeam = () => DB.companies.filter(c=>c.auditorId===S.userId || (c.coAuditors||[]).includes(S.userId));
const audRole = c => c.auditorId===S.userId ? '메인' : '동반';
const openAudits = () => myAudits().filter(c=>(c.step===3||c.step===4) && !c.audit.submitted);
const shaCases = () => DB.companies.filter(c=>c.step===5 && !c.decision);
function navCount(v){
  let n = 0;
  if(v==='aud-report'){ n = myTeam().filter(c=>c.step===4 && !c.audit.submitted && c.auditorId===S.userId).length; }
  if(v==='aud-mock'){ n = myTeam().filter(c=>c.step===3 && c.auditorId===S.userId).length; }
  if(v==='aud-inbox'){ n = DB.companies.filter(c=>acceptOf(c)==='수락대기').length; }
  if(v==='aud-resubmit'){ n = myTeam().reduce((a,c)=>a+(c.requests||[]).filter(r=>r.status==='제출완료').length + (c.findings||[]).filter(f=>f.status==='시정제출').length,0); }
  if(v==='aud-pre'){ n = DB.companies.filter(c=>c.pre && c.auditorId===S.userId && (c.pre.status==='오디터검토중'||c.pre.status==='보완제출')).length; }
  if(v==='ent-pre'){ const p = company(S.userId).pre; n = p && p.status==='결과전달' ? p.rep.reqs.filter(r=>r.status==='요청').length || 1 : 0; }
  if(v==='ent-contract'){ const c = company(S.userId); n = (c.quote.status==='발송완료'?1:0) + payPlan(c).filter(p=>p.status==='청구').length; }
  if(v==='adm-contract'){ n = DB.companies.filter(c=>c.qReq&&c.qReq.status==='대기').length + DB.companies.filter(apprPending).length + DB.companies.reduce((a,c)=>a+payPlan(c).filter(p=>p.status==='입금확인중').length,0); }
  if(v==='cons-contract'){ n = myCompanies().filter(c=>c.qReq && c.qReq.status==='반려').length; }
  if(v==='sha-review'){ n = shaCases().filter(c=>!c.votes[S.userId]).length; }

function chatBox(c, me, chips){

    ? `<div><b>${esc(other.name)} ${esc(other.title)}</b><div class="muted">${esc(other.org)}</div></div><span class="badge strong">1:1 상담</span>`

const normCert = v => /^(y|yes|o|○|있|보유|유$)/i.test(v) ? '있음' : /해당|n\/?a|^-$/i.test(v) ? '해당없음' : '없음';
async function parseBOM(file){
  if(!file || !/\.(xlsx|xls|csv)$/i.test(file.name)) return null;
  try{
    let rows;
    if(/\.csv$/i.test(file.name)){
      const cells = l => { const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(x=>x.trim()); };
      const lines = (await file.text()).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
      const head = cells(lines[0]); rows = lines.slice(1).map(l=>{ const v = cells(l); return Object.fromEntries(head.map((h,i)=>[h,v[i]||''])); });
    } else {
      if(!window.XLSX) return null;
      const wb = XLSX.read(await file.arrayBuffer(),{type:'array'});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    }
    const pick = (r,re) => { const k = Object.keys(r).find(k=>re.test(k)); return k ? String(r[k]).trim() : ''; };
    const out = rows.map(r=>({name:pick(r,/원료|성분|ingredient|material|명칭/i)||pick(r,/name/i),sup:pick(r,/공급|제조사|supplier|maker|vendor/i),origin:pick(r,/원산|origin|country|국가/i),cert:normCert(pick(r,/할랄|halal|인증|cert/i))})).filter(g=>g.name);
    return out.length ? out : null;
  }catch(e){ return null; }
}

    if(j.lv==='doc' && LOW_RISK.test(g.name)) j = {lv:'ok',msg:'위험도가 낮은 원료 (식물성·광물성·수산물)입니다.'};
    return {name:g.name, prod:g.prods.join(', '), lv:j.lv, msg:j.msg, note:''}; });
  const biz = preBizName(c,pre);
  const docs = [{name:'사업자등록증', req:true, ok:!!biz, file: biz ? biz + (pre.bizFile.vid && pre.bizFile.auto?' (기존 서류 활용)':'') : '', note: biz?'':'미제출 · 제출 필요'},

    ...products.map(p=>({name:`${creq(c).comp} · ${p.ko}`, req:true, ok:!!p.comp, file: p.comp ? p.comp.name + (p.src==='file'?' (원료 판독)':'') : '', note: p.comp?'':'미제출 · 제출 필요'}))];
  const rank = {ok:0,doc:1,chk:2,bad:3}; const toV = r => r>=3?'부적합':r>=1?'조건부 적합':'적합';
  const prods = products.map(p=>{ const mine = ings.filter(g=>g.prod.split(', ').includes(p.ko)); const worst = Math.max(0,...mine.map(g=>rank[g.lv]));
    const v = p.comp ? toV(worst) : '조건부 적합'; return {name:p.ko, en:p.en, comp:p.comp?p.comp.name:'', ai:v, final:v, note: !p.comp ? '제품성분분석표 미제출 · 원료 판정 불가' : worst? `${mine.filter(g=>g.lv!=='ok').map(g=>g.name).join(', ')} 확인 필요` : '원료 기준 이상 없음'}; });

  const cnt = k => ings.filter(g=>g.lv===k).length;
  const verdict = cnt('bad') ? '부적합' : (cnt('chk')||cnt('doc')||miss.length) ? '조건부 적합' : '적합';
  const score = Math.max(0, Math.min(100, 100 - cnt('bad')*25 - cnt('chk')*8 - cnt('doc')*4 - miss.length*10));
  const chkNames = ings.filter(g=>g.lv==='chk').map(g=>g.name);
  const opinion = `제품 ${products.length}종, 원료 ${ings.length}종, 서류 ${docs.filter(d=>d.ok).length}건(${c.category} 인증 대상 필수 서류)을 분석했습니다. `
    + (cnt('bad')?`하람 가능 원료 ${cnt('bad')}종이 확인되어 대체 원료 검토가 필요합니다. `:'')
    + (chkNames.length?`확인이 필요한 원료 ${chkNames.length}종(${chkNames.join(', ')})은 출처와 할랄 증빙이 필요합니다. `:'')
    + (cnt('doc')?`인증서가 확인되지 않은 원료 ${cnt('doc')}종은 원료 규격서 또는 할랄 인증서 제출이 필요합니다. `:'')
    + (miss.length?`필수 서류 ${miss.length}건이 제출되지 않았습니다. `:'')
    + (verdict==='적합'?'현재 자료 기준으로 할랄 기준에 적합한 것으로 판단됩니다.':'추가 서류 제출 후 재검토가 필요합니다.');
  return {verdict, score, products:prods, ings, docs, reqs, aiOpinion:opinion, audOpinion:'', createdAt:today(), counts:{ok:cnt('ok'),chk:cnt('chk'),doc:cnt('doc'),bad:cnt('bad'),miss:miss.length}};

function stdBuilder(c){

  S.stdOpts = sel; const sq = stdQuote(c, sel.opts, sel.pay); const r = calcQuote(sq);

const tplFields = t => [...new Set([...t.body.matchAll(/\{\{([^}]+)\}\}/g)].map(m=>m[1]))];
function fillTpl(t,c,vals){ return t.body.replace(/\{\{([^}]+)\}\}/g,(_,k)=>{ const v = (vals&&vals[k]) || (AUTO_F[k]?AUTO_F[k](c):''); return v ? esc(v) : `<span style="color:#b00;background:#fff3f3;padding:0 3px">[${esc(k)}]</span>`; }).replace(/\n/g,'<br>'); }
function docsView(role){

      ${STEPS.map((s,i)=>{const L=DB.templates.filter(x=>x.step===i); return L.length?`<div class="mh" style="font-size:11px">${pad(i+1)} ${s}</div>${L.map(x=>`<button class="mitem ${x.id===t.id?'on':''}" onclick="App.tplSel('${x.id}')"><span class="t"><span>${esc(x.name)}</span><span class="mono muted">${esc(x.code)}</span></span></button>`).join('')}`:''}).join('')}</nav>
      <section class="panel"><div class="panel-head"><h2>양식 편집</h2><span class="muted">{{항목명}}으로 넣을 자리를 표시합니다</span></div>
        <div class="grid-3"><div class="field"><label for="tp-code">양식 번호</label><input class="in mono" id="tp-code" value="${esc(t.code)}"></div><div class="field"><label for="tp-name">양식명</label><input class="in" id="tp-name" value="${esc(t.name)}"></div>

        <div class="field"><label for="tp-body">본문</label><textarea class="in mono" id="tp-body" style="min-height:220px;font-size:12.5px">${esc(t.body)}</textarea></div>
        <div class="note"><b>자동으로 채워지는 항목</b><p>${Object.keys(AUTO_F).map(k=>`{{${k}}}`).join(' ')}</p><p class="muted">그 밖의 {{항목}}은 업체별 작성 화면에서 직접 입력하는 칸이 됩니다.</p></div>
        <div class="row-act" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="App.tplDel('${t.id}')">양식 삭제</button><button class="btn btn-primary" onclick="App.tplSave('${t.id}')">양식 저장</button></div>
      </section></div>`;
  } else if(c){
    const cur = c.done?7:c.step; const sel = S.docStep ?? cur; const L = DB.templates.filter(t=>t.step===sel);
    const t = L.find(x=>x.id===S.docTpl) || L[0]; if(t) S.docTpl = t.id;
    const rec = t ? ((c.docs ||= {})[t.id] ||= {values:{},status:'미작성'}) : null;
    body = `<div class="chipbar">${list.map(x=>`<button class="chip ${x.id===c.id?'on':''}" onclick="App.docCo('${x.id}')">${esc(x.name)}<span class="mono">${STEPS[x.done?7:x.step]}</span></button>`).join('')}</div>
    <section class="panel"><div class="panel-head"><h2>${esc(c.name)} · 단계별 필요 양식</h2><span class="muted">현재 단계 ${pad(cur+1)} ${STEPS[cur]}</span></div>
      <div class="tabs">${STEPS.map((s,i)=>{const n=DB.templates.filter(x=>x.step===i).length; const done=DB.templates.filter(x=>x.step===i && c.docs && c.docs[x.id] && c.docs[x.id].status==='발행').length; return `<button class="${sel===i?'on':''}" onclick="App.docStep(${i})"><span class="mono muted">${pad(i+1)}</span> ${s} <span class="muted" style="font-size:11px">${done}/${n}</span>${i===cur?' ●':''}</button>`}).join('')}</div>
      ${L.length?`<ul class="rows">${L.map(x=>{const r=(c.docs||{})[x.id]; return `<li class="row"><div><b>${esc(x.code)} ${esc(x.name)}</b><span class="muted">${r&&r.status!=='미작성'?`${esc(r.status)} · ${esc(r.at||'')}`:'미작성'}</span></div><div class="row-act">${r&&r.status==='발행'?'<span class="badge attn">발행</span>':r&&r.status==='작성중'?'<span class="badge strong">작성중</span>':'<span class="badge">필요</span>'}<button class="btn btn-sm ${x.id===(t&&t.id)?'btn-primary':''}" onclick="App.docTpl('${x.id}')">작성</button></div></li>`}).join('')}</ul>`:'<p class="empty">이 단계에 등록된 양식이 없습니다.</p>'}
    </section>
    ${t?`<div class="md" style="grid-template-columns:minmax(0,360px) minmax(0,1fr)">
      <section class="panel"><div class="panel-head"><h2>입력 항목</h2><span class="muted">${esc(t.code)}</span></div>
        ${tplFields(t).map(k=>{ const auto = AUTO_F[k]; const av = auto?auto(c):''; return `<div class="field"><label for="df-${esc(k)}">${esc(k)} ${auto?'<span class="req">자동</span>':''}</label>${auto?`<input class="in" value="${esc(rec.values[k]||av)}" data-df="${esc(k)}" oninput="App.docVal(this)" placeholder="${av?'':'자동 값 없음 · 직접 입력'}">`:`<textarea class="in" style="min-height:60px" data-df="${esc(k)}" oninput="App.docVal(this)">${esc(rec.values[k]||'')}</textarea>`}</div>`; }).join('')}
        <div class="row-act"><button class="btn" onclick="App.docSave('작성중')">임시저장</button><button class="btn btn-primary" onclick="App.docSave('발행')">문서 발행</button></div>
        <p class="help">발행하면 해당 기업의 서류함에 저장되고 기업 화면에서도 볼 수 있습니다.</p>

        <article class="doc" id="doc-prev">${docTop(t.name.split('').join(' '),`${t.code}-${c.code.slice(2)}`,rec.at||today())}<p style="line-height:1.9">${fillTpl(t,c,rec.values)}</p><p class="draft">유한회사 지엘할랄인증센터 표준 양식 ${esc(t.code)} · 빨간 칸은 아직 채우지 않은 항목입니다.</p></article>
      </section></div>`:''}`;
  }
  return `<section class="panel"><div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="App.docTab('${k}')">${l}</button>`).join('')}</div>
    <p class="muted" style="margin:0">${tab==='tpl'?'신청서와 단계별 표준 양식을 만들고 고칩니다.':'업체를 고르고 단계를 선택하면 그 단계에 필요한 양식이 나옵니다. 기업 정보는 자동으로 채워지고, 나머지 항목만 입력하면 됩니다.'}</p></section>${body}`;
}

const stamp = () => { const d = new Date(); return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fingerprint = s => { let a = 0x811c9dc5, b = 5381; for(const ch of String(s)){ const x = ch.charCodeAt(0); a = Math.imul(a^x,16777619)>>>0; b = ((b<<5)+b+x)>>>0; }
  return (a.toString(16).padStart(8,'0')+b.toString(16).padStart(8,'0')).toUpperCase().replace(/(.{4})(?!$)/g,'$1-'); };

function dlog(c, who, text){ (c.dlog ||= []).push({at:stamp(), who, text}); }

const consName = c => (consultant(c.consultantId)||{}).name || '전담 컨설턴트';

function ai2Compute(c){ const pre = c.pre; const rep = pre.rep;
  const bad = rep.ings.filter(g=>g.lv==='bad'); const badProd = rep.products.filter(p=>p.final==='부적합');
  const sub = rep.reqs.filter(r=>r.status!=='요청').length;
  const items = rep.reqs.map(r=>({doc:r.doc, file:r.file||'', ok:r.status!=='요청', note: r.status==='요청' ? '미제출' : /인증서|CoA|규격/.test(r.doc) ? '증빙 확인 · 원료 판정 해소' : '서류 확인 완료'}));
  const score = Math.max(0, Math.min(100, rep.score + sub*6 - (rep.reqs.length-sub)*10 - bad.length*20));
  const result = (bad.length || badProd.length || score < 60) ? '불가' : '가능';
  const notes = [...bad.map(g=>`${g.name}: 하람 가능 원료로 대체 원료 확인이 없음`), ...badProd.map(p=>`${p.name}: 심사원 1차 판정 부적합`)];
  return {result, score, items, notes, at:today(), prev:rep.score}; }

const DFK = Object.fromEntries(DF.map(d=>[d.k,d]));
DFK.supv.full='할랄 슈퍼바이저 지정·교육 확인서'; DFK.edu.full='지정 교육 안내 및 이수 동의서'; DFK.manual.full='할랄 보증 시스템(SJPH) 매뉴얼'; DFK.policy.full='할 랄 정 책 선 언 서'; DFK.mark.full='할랄 인증마크 사용 규정 동의서';
const TRAIN = ['supv','edu','manual','policy','mark'];

function dstate(c,d){
  if(!d.has(c)) return {s:'예정', label:'예정', acts:[], open:[]};
  const acts = d.acts.map(a=>({...a, d:(a.done ? a.done(c) : (ackOf(c,d.k,a.r) || (legacyPast(c,d.lstep)?LEG:null)))}));
  const open = acts.filter(a=>!a.d);
  const label = open.length ? `${ROLE_KO[open[0].r]} ${ACT_KO[open[0].a]} 대기` : (d.k==='verdict' && c.pre && c.pre.status==='불가' ? '인증 불가 통지' : acts.length ? '완료' : '발행');
  return {s: open.length?'대기':'완료', label, acts, open};
}
const visible = (d, role) => !(d.hide||[]).includes(role);
/* 내 역할이 처리할 문서 */
function canAct(c, a){ const r = S.role; if(a.site) return false;
  if(a.r!==r) return false;
  if(r==='ent') return c.id===S.userId;
  if(r==='cons') return c.consultantId===S.userId;
  if(r==='aud') return c.auditorId===S.userId;
  if(r==='sha') return activeSharia().some(s=>s.id===S.userId) && !(c.votes||{})[S.userId];
  return false; }
function todosFor(c){ return DF.filter(d=>visible(d,S.role)).map(d=>({d, s:dstate(c,d)})).filter(x=>x.s.open.some(a=>canAct(c,a))); }
function flowCos(){ const r = S.role;
  if(r==='ent') return [company(S.userId)];
  if(r==='cons') return myCompanies();
  if(r==='aud') return myTeam();
  if(r==='sha') return DB.companies.filter(c=>c.step>=5||c.done);
  return DB.companies; }
function myTodos(){ return flowCos().flatMap(c=>todosFor(c).map(x=>({...x,c}))); }
function fstage(c){ let cur = 0; DF.forEach(d=>{ if(d.has(c)) cur = Math.max(cur, d.st); }); return c.done ? 8 : cur; }

function actBtn(c, d, a, sm){ const cls = `btn ${sm?'btn-sm':''} btn-primary`;
  if(a.a==='sign' && d.k==='report') return `<button class="${cls}" onclick="App.go('${S.role==='aud'?'aud-report':'ent-flow'}')">${S.role==='aud'?'보고서 서명하러 가기':'현장 서명 대기'}</button>`;
  if(a.a==='sign' && d.k==='sharia') return `<button class="${cls}" onclick="App.openCase('${c.id}')">온라인 심의하기</button>`;
  if(a.a==='sign' || a.a==='consent') return `<button class="${cls}" onclick="App.esignOpen('${c.id}','${d.k}')">${a.a==='sign'?'전자서명':'내용 확인 후 동의'}</button>`;
  if(a.a==='ack') return `<button class="${cls}" onclick="App.ackDoc('${c.id}','${d.k}')">수령 확인</button>`;
  if(a.a==='submit') return `<button class="${cls}" onclick="App.flowCo('${c.id}');document.getElementById('df-req')&&document.getElementById('df-req').scrollIntoView({behavior:'smooth'})">서류 올리기</button>`;
  if(a.a==='review' || (a.a==='confirm' && d.k==='ai2')) return `<button class="${cls}" onclick="App.selPre('${c.id}');App.go('aud-pre')">사전심사 검토</button>`;
  if(a.a==='confirm' && d.k==='bundle') return `<button class="${cls}" onclick="App.pickCo('${c.id}');App.go('aud-final')">취합본 확인</button>`;
  return ''; }

function docRow(c, d){ const s = dstate(c,d); const fut = s.s==='예정';
  const mine = s.open.filter(a=>canAct(c,a));
  const chips = s.acts.map(a=>`<span class="badge ${a.d?'strong':''}">${a.d?'✓':'○'} ${ROLE_KO[a.r]} ${ACT_KO[a.a]}${a.d&&a.d.at?` <span class="mono">${esc(String(a.d.at).slice(5))}</span>`:''}</span>`).join(' ');
  return `<li class="row df-row ${fut?'fut':''}"><div style="min-width:0"><b><span class="mono muted" style="margin-right:6px">${d.code}</span>${esc(d.t)}</b>
      <span class="muted">${esc(d.from)} → ${esc(d.to)}${!fut&&d.at(c)?` · <span class="mono">${esc(d.at(c))}</span>`:''}</span>${chips?`<span style="display:flex;gap:4px;flex-wrap:wrap">${chips}</span>`:''}</div>
    <div class="row-act"><span class="badge ${fut?'':s.s==='대기'?'attn':'strong'}">${esc(s.label)}</span>
      ${fut?'':`<button class="btn btn-sm btn-ghost" onclick="App.dview('${c.id}','${d.k}')">미리보기</button><button class="btn btn-sm" onclick="App.pdf('${c.id}','${d.k}')">PDF</button>`}
      ${mine.map(a=>actBtn(c,d,a,true)).join('')}</div></li>`; }

function reqUploader(c){ const pre = c.pre; if(!pre||!pre.rep||pre.status!=='결과전달') return '';
  if(!['ent','cons'].includes(S.role)) return '';
  const open = pre.rep.reqs.filter(r=>r.status==='요청').length;
  return `<section class="panel" id="df-req"><div class="panel-head"><h2>추가 요청 서류 제출</h2><span class="muted">${S.role==='cons'?'컨설턴트가 기업 대신 올릴 수 있습니다':'항목마다 파일을 끌어다 놓으세요'}</span></div>
    <ul class="rows">${pre.rep.reqs.map((r,i)=>`<li class="row"><div><b>${esc(r.doc)}</b><span class="muted">${esc(r.reason)} · 기한 <span class="mono">${esc(r.due)}</span></span>${r.file?`<span class="mono muted">✓ ${esc(r.file)}${r.by?' · '+esc(r.by):''}</span>`:''}</div>
      <div class="row-act">${r.status==='요청'?`<label class="dropzone" style="padding:10px 16px;flex-direction:row" ${dropAttrs(`App.reqDrop(event,'${c.id}',${i})`)}><b style="font-size:13px">파일 끌어다 놓기 · 선택</b><input type="file" hidden onchange="App.reqUpload('${c.id}',${i},this.files[0])"></label>`:`<span class="badge strong">${esc(r.status)}</span>`}</div></li>`).join('')}</ul>
    <div class="row-act" style="justify-content:flex-end"><span class="muted">${open?`미제출 ${open}건`:'모든 서류를 올렸습니다 · 제출하면 AI가 추가 분석합니다'}</span><button class="btn btn-primary" ${open?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="App.reqSubmit('${c.id}')">보완 서류 제출 · AI 추가 분석</button></div></section>`; }

function flowView(){
  const cos = flowCos(); if(!cos.length) return `<section class="panel"><p class="empty">문서 흐름을 볼 업체가 없습니다.</p></section>`;
  if(!cos.find(c=>c.id===S.flowCo)) S.flowCo = (cos.find(c=>todosFor(c).length)||cos[0]).id;
  const c = company(S.flowCo); const cur = fstage(c); const docs = DF.filter(d=>visible(d,S.role));
  const live = docs.filter(d=>d.has(c)); const todo = todosFor(c); const waitAll = live.filter(d=>dstate(c,d).s==='대기').length;
  const train = TRAIN.map(k=>({k, s:dstate(c,DFK[k])})).filter(x=>x.s.open.some(a=>canAct(c,a)));
  const pick = S.role==='ent' ? '' : `<div class="chipbar">${cos.map(x=>{const n=todosFor(x).length; return `<button class="chip ${x.id===c.id?'on':''}" onclick="App.flowCo('${x.id}')">${esc(x.name)}${n?`<span class="mono">${n}</span>`:''}</button>`}).join('')}</div>`;
  return `${pick}
  <section class="summary">
    <div><span class="k">문서 흐름 단계</span><span class="v">${cur>=8?'완료':pad(cur+1)+' '+FSTAGE[cur]}</span></div>
    <div><span class="k">발행 문서</span><span class="v mono">${live.length} / ${docs.length}</span></div>
    <div><span class="k">처리 대기</span><span class="v mono">${waitAll}건</span></div>
    <div><span class="k">내가 처리할 문서</span><span class="v mono">${todo.length}건</span></div>
  </section>
  <section class="panel"><div class="panel-head"><h2>${esc(c.name)} 인증 문서 흐름</h2><span class="muted mono">${c.code}</span></div>

function printHtml(html, title){ const f = document.createElement('iframe'); f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);

  let down=false; const pos = e=>{ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.onpointerdown = e=>{ down=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  cv.onpointermove = e=>{ if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  cv.onpointerup = ()=>{ if(!down) return; down=false; if(S.esign) S.esign.img = cv.toDataURL(); }; }

function qaToks(s){ return [...new Set(String(s).replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).map(w=>w.replace(/(은|는|이|가|을|를|에|의|도|로|으로|에서|인가요|나요|까요|한가요)$/,'')).filter(w=>w.length>=2))]; }
function qaSimilar(text, excl){ const T = qaToks(text); if(T.length<2) return [];
  return DB.qna.filter(q=>q.id!==excl && qaAnswered(q)).map(q=>{ const Q = qaToks(q.text); const hit = T.filter(w=>Q.some(x=>x.includes(w)||w.includes(x))).length; return {q, s:hit/Math.max(3,T.length)}; }).filter(x=>x.s>=0.25).sort((a,b)=>b.s-a.s).slice(0,3); }

function evSuggest(ev, ignore){ const dur = ev.allDay ? 540 : Math.max(30, toMin(ev.end)-toMin(ev.start));

async function savePdf(html, base){ const name = base.replace(/[\\/:*?"<>|()\s·「」]+/g,'_') + '.pdf'; toast('PDF를 만들고 있습니다…'); let blob;
  try{ await loadPdfLib(); const box = document.createElement('div'); box.style.cssText='position:fixed;left:-12000px;top:0;width:760px;background:#fff;color:#1b1b1b'; box.innerHTML = html; document.body.appendChild(box);
    try{ blob = await html2pdf().set({margin:[10,10,12,10],image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy']}}).from(box.firstElementChild).outputPdf('blob'); } finally{ box.remove(); } }
  catch(e){ toast('인쇄 창에서 대상을 [PDF로 저장]으로 선택하세요.'); return printHtml(html, base); }
  const anchor = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('PDF를 내려받았습니다.'); };
  if(DLNS){ try{ await DLNS.save({filename:name, data:blob}); toast('PDF를 저장했습니다.'); }catch(e){ if(e && e.code==='declined') toast('저장을 취소했습니다.'); else if(e && e.code==='rate_limited') toast('이미 저장 창이 열려 있습니다.'); else anchor(); } } else anchor(); }

function render(){
  document.documentElement.lang = S.lang;
  $('#app').innerHTML = S.role ? renderShell() : renderLogin();
  const log = $('#chat-log'); if(log) log.scrollTop = log.scrollHeight;
  initSig();
}
function initSig(){ $$('canvas.sig').forEach(cv=>{ const c = company(S.audCo); if(!c) return; const k = cv.dataset.k; const ctx = cv.getContext('2d');
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle=getComputedStyle(document.body).color;
  if(c.sign[k+'Img']){ const im = new Image(); im.onload=()=>ctx.drawImage(im,0,0); im.src=c.sign[k+'Img']; }
  let down=false; const pos = e=>{ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.onpointerdown = e=>{ down=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  cv.onpointermove = e=>{ if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  cv.onpointerup = ()=>{ if(!down) return; down=false; c.sign[k]=true; c.sign[k+'Img']=cv.toDataURL(); toast(`${k==='auditor'?'심사원':'할랄 관리책임자'} 서명을 저장했습니다.`); };
}); }
/* ===== P1: 실백엔드 인증 (골격 — 화면 데이터는 P3~P8에서 실API 교체) =====
   /auth/login {username,password} → {token, refresh_token, role, org_id, username}
   /auth/refresh {refresh_token} → {token, ...}
   서버 역할(8종)이 UI 5역할을 결정한다(설계서 2.1 · "실제 역할은 서버 토큰을 따른다"). */
const API_BASE = '';  // 동일 출처(앱 루트) — /ui/v4/ 와 /auth/* 는 같은 FastAPI 앱
const AUTH = { access:null, refresh:null, role:null, uiRole:null, username:null, org_id:null };
function authSave(){ try{ localStorage.setItem('glhac_v4_auth', JSON.stringify(AUTH)); }catch(e){} }
function authLoad(){ try{ const j=JSON.parse(localStorage.getItem('glhac_v4_auth')||'null'); if(j) Object.assign(AUTH,j); }catch(e){} }
function authClear(){ Object.assign(AUTH,{access:null,refresh:null,role:null,uiRole:null,username:null,org_id:null}); authSave(); }
async function apiRefresh(){
  if(!AUTH.refresh) return false;
  try{ const r = await fetch(API_BASE+'/auth/refresh', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:AUTH.refresh})});
    if(!r.ok) return false; const d = await r.json(); AUTH.access = d.token || AUTH.access; authSave(); return true;
  }catch(e){ return false; }
}
async function apiFetch(path, opts={}){   // P3~P8 화면이 실API 호출할 때 사용 (Bearer + 401 자동 refresh)
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH.access) opts.headers['Authorization'] = 'Bearer '+AUTH.access;
  let r = await fetch(API_BASE+path, opts);
  if(r.status===401 && await apiRefresh()){ opts.headers['Authorization']='Bearer '+AUTH.access; r = await fetch(API_BASE+path, opts); }
  return r;
}
// 서버 역할(백엔드 8종) → UI 5역할 코드 (설계서 2.1 매핑, operator·admin→adm / penyelia·pendamping→ent)
const ROLE_MAP = { applicant:'ent', penyelia_halal:'ent', pendamping_pph:'ent', client:'ent',
                   consultant:'cons', auditor:'aud', fatwa_liaison:'sha', sharia:'sha',
                   admin:'adm', operator:'adm', ops:'adm' };
function uiRoleFromServer(role){ return ROLE_MAP[role] || (['ent','cons','aud','sha','adm'].includes(role)?role:null); }

const App = {
  toast, closeModal,
  setLang(l){ S.lang=l; render(); if(l==='en') toast('메뉴와 공통 문구가 영어로 바뀌었습니다. 본문 번역은 다음 단계입니다.'); },
  loginRole(r){ S.loginRole=r; S.loginEmail=null; render(); },
  goSignup(){ S.auth = S.loginRole==='enterprise'?'signup-ent':'signup-cons'; S.signup=null; S.consPick=null; S.dupEmail=null; render(); window.scrollTo(0,0); },
  goLogin(){ S.auth='login'; S.signup=null; render(); window.scrollTo(0,0); },
  async login(e){
    e.preventDefault();
    const username = $('#lg-email').value.trim();
    const password = $('#lg-pw').value;
    const btn = e.target.querySelector('button[type=submit]'); if(btn) btn.disabled=true;
    try{
      const r = await fetch(API_BASE+'/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, password})});
      if(r.status===429){ return toast('로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.'); }
      if(!r.ok){ return toast('아이디 또는 비밀번호가 올바르지 않습니다.'); }
      const d = await r.json();

  async doAutofill(opt){
    const c = company(S.userId); const ups = S.uploads[c.id] || []; const smp = SAMPLE[c.category] || SAMPLE['식품'];
    const has = k => ups.find(u=>u.type===k); const filled = []; const miss = [];
    const set = (id,val,label,src) => { const el = $('#'+id); if(!el) return; el.value = val; markAuto(el); filled.push([label,val,src]); };
    if(opt.product){
      set('ap-field',c.category,'인증 분야','기업 정보');
      const label = has(5), biz = has(0), sj = has(6), flow = has(2);
      if(label){ const tr = $('#prod-body tr'); const f = k => tr.querySelector(`[data-pr="${k}"]`);
        [['ko',smp.productKo,'제품명 (국문)'],['en',smp.productEn,'제품명 (영문)'],['brand',smp.brand,'브랜드']].forEach(([k,v,l])=>{ const el=f(k); el.value=v; markAuto(el); filled.push([l,v,label.name]); }); }
      else miss.push('제품명 · 브랜드 — 제품 라벨 파일이 없습니다');
      if(biz) set('ap-addr',c.addr||smp.addr,'공장 주소',biz.name); else miss.push('공장 주소 — 사업자등록증이 없습니다');
      if(sj) set('ap-fac',`${c.name.replace(/\(주\)|㈜/g,'').trim()} ${smp.factory}`,'제조 공장명',sj.name); else miss.push('제조 공장명 — SJPH 매뉴얼이 없습니다');
      if(flow) set('ap-vol',smp.volume,'연간 생산량',flow.name); else miss.push('연간 생산량 — 제조공정도가 없습니다');
    }
    if(opt.ing){
      const bom = has(1);
      if(bom){
        const real = await parseBOM(bom.file);
        const list = real || smp.ings.map(([name,sup,origin,cert])=>({name,sup,origin,cert}));
        $('#ing-body').innerHTML = list.map(ingRow).join('');
        $$('#ing-body .in').forEach(markAuto);
        c.ingredients = list;
        filled.push(['원료 목록',`${list.length}종`,bom.name + (real?' · 실제 파일에서 읽음':' · 시연 데이터')]);
      } else miss.push('원료 목록 — 배합비(BOM) 파일이 없습니다');
    }
    if(opt.docs){
      let n = 0;
      ups.forEach(u=>{ if(u.type>=0){ c.files[u.type] = u.name; const el = $('#fn-'+u.type); if(el) el.textContent = u.name; n++; } });
      const un = ups.filter(u=>u.type<0).length;
      filled.push(['제출 서류',`${n}건 첨부`,'업로드한 서류']);
      if(un) miss.push(`분류되지 않은 파일 ${un}건 — 서류 종류를 선택하면 첨부됩니다`);
      const reqLeft = DOCS.filter((d,i)=>d.req && !c.files[i]).map(d=>d.name);
      if(reqLeft.length) miss.push(`필수 서류 미첨부 — ${reqLeft.join(', ')}`);
      $('#req-count').textContent = `필수 서류 ${DOCS.filter((x,i)=>x.req&&c.files[i]).length} / ${DOCS.filter(x=>x.req).length} 첨부`;
    }
    S.drafts[c.id] = readDraft(); c.ingredients = readIngs(); syncProducts(c);
    $('#af-result').innerHTML = `<div class="ai-box">
      <div class="panel-head"><h2 style="font-size:15px">자동 채우기 완료 · ${filled.length}개 항목</h2><span class="muted">${clock()}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>항목</th><th>입력한 값</th><th>근거 서류</th></tr></thead><tbody>
        ${filled.map(([l,v,src])=>`<tr><td><b>${esc(l)}</b></td><td>${esc(v)}</td><td class="muted">${esc(src)}</td></tr>`).join('')}</tbody></table></div>
      ${miss.length?`<div class="note attn"><b>채우지 못한 항목</b><p>${miss.map(esc).join('<br>')}</p></div>`:''}
      <p class="muted">연녹색으로 표시된 칸이 자동 입력된 값입니다. 내용을 확인하고 필요하면 고쳐 주세요. 시연 버전에서는 엑셀·CSV 배합비만 실제로 읽고, PDF·이미지 판독(OCR)은 예시 값으로 채웁니다.</p></div>`;
    if(opt.ai && opt.ing && c.ingredients.length) App.runAI();
    toast(`${filled.length}개 항목을 자동으로 채웠습니다. 내용을 확인해 주세요.`);
  },

const RS = { cases: [], counts: {}, todo: [], assignments: [], assignPending: 0, pre: {}, onsite: {}, mats: {}, mock: {}, sched: {}, final: {}, entPre: {}, entCt: {}, consPre: {}, entDocs: {}, consInv: null, consQna: null, entAsk: null, loadedFor: null };
async function loadAud(){
  try{
    const [rc, rn, rt, ra] = await Promise.all([apiFetch('/cases'), apiFetch('/me/nav-counts'),
        apiFetch('/me/todo'), apiFetch('/auditor/assignments?status=all')]);
    RS.cases = rc.ok ? ((await rc.json()).items || []) : [];
    RS.counts = rn.ok ? await rn.json() : {};
    RS.todo = rt.ok ? ((await rt.json()).items || []) : [];
    if(ra.ok){ const aj = await ra.json(); RS.assignments = aj.items || []; RS.assignPending = aj.pending_count || 0; }
    else { RS.assignments = []; RS.assignPending = 0; }
    RS.loadedFor = AUTH.username;
  }catch(e){ RS.cases = []; RS.counts = {}; RS.todo = []; RS.assignments = []; RS.assignPending = 0; }
}

const _navCountMock = navCount;
navCount = function(v){
  if(S.role==='aud'){
    const cs = RS.cases || []; let n = 0;
    if(v==='aud-inbox') n = RS.assignPending || 0;
    else if(v==='aud-pre') n = cs.filter(c=>c.step8===1 && c.owner==='auditor').length;
    else if(v==='aud-mock') n = cs.filter(c=>c.step8===3).length;

    else if(v==='aud-resubmit') n = cs.filter(c=>c.hold).length;

};

const JUDGE4 = [['comply','준수'],['nonconformity','비준수'],['not_checked','미점검']];

async function loadOnsite(cid){

      apiFetch('/cases/'+cid+'/onsite-checklist'), apiFetch('/cases/'+cid+'/findings'),

function _audOnsiteDetail(cid, d){
  const cl = d.checklist||{items:[]}, items = cl.items||[], finds = d.findings||[];

  </section>

App.ckSave = async function(cid, key){
  let result='not_checked'; document.querySelectorAll('input[name="ck_'+key+'"]').forEach(r=>{ if(r.checked) result=r.value; });
  const nEl=document.getElementById('cknote_'+key); const note=nEl?nEl.value:'';
  const r=await apiFetch('/cases/'+cid+'/onsite-checklist',{method:'POST',body:JSON.stringify({item_key:key,result,note})});
  if(!r.ok) return toast('체크리스트 저장에 실패했습니다.');

App.docDownload = async function(docId, name){
  try{ const r=await apiFetch('/documents/'+docId+'/file'); if(!r.ok) return toast('파일을 열 수 없습니다.');

  }catch(e){ toast('파일을 열 수 없습니다.'); }
};

  const byst={open:rows.filter(r=>r.status!=='answered'), answered:rows.filter(r=>r.status==='answered')};
  const L=tab==='open'?byst.open:tab==='answered'?byst.answered:rows;
  const tabs=[['all','전체'],['open','답변 대기'],['answered','답변 완료']];
  return `
  <section class="summary">
    <div><span class="k">전체 문의</span><span class="v mono">${rows.length}</span></div>
    <div><span class="k">답변 대기</span><span class="v mono">${byst.open.length}</span></div>
    <div><span class="k">답변 완료</span><span class="v mono">${byst.answered.length}</span></div>
  </section>
  <section class="panel"><div class="panel-head"><h2>고객 문의</h2><span class="muted">응답은 관리자가 처리합니다</span></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="App.qnaTab('${k}')">${l} <span class="mono muted">${k==='all'?rows.length:byst[k==='open'?'open':'answered'].length}</span></button>`).join('')}</div>
    ${L.length?`<ul class="rows">${L.slice().reverse().map(r=>`<li class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="row-act" style="justify-content:space-between"><b>${esc(r.subject||'(제목없음)')}</b><span class="badge ${r.status==='answered'?'strong':'attn'}">${r.status==='answered'?'답변 완료':'답변 대기'}</span></div>
      <div class="muted">${esc(r.message||'')}</div>
      ${r.response?`<div class="note"><b>답변${r.responder?(' · '+esc(r.responder)):''}</b><p>${esc(r.response)}</p></div>`:''}
      <span class="muted mono" style="font-size:11px">${esc((r.created_at||'').slice(0,16))}${r.channel?(' · '+esc(r.channel)):''}</span></li>`).join('')}</ul>`:'<p class="empty">해당 문의가 없습니다.</p>'}
  </section>`;
};
App.qnaTab = function(k){ S.qnaTab=k; render(); };


/* ===== P4 슬라이스9: 컨설턴트 계약·견적 관리(cons-contract) 실데이터 ===== */
VIEWS['cons-contract'] = () => {
  const list=RS.cases||[];
  if(!list.length) return `<section class="panel"><p class="empty">담당 기업이 없습니다.</p></section>`;
  let cur=(S.selContract&&list.find(c=>c.case_id===S.selContract))?S.selContract:list[0].case_id; S.selContract=cur;
  const nav=`<nav class="mlist" aria-label="견적·계약 대상"><div class="mh">견적 · 계약 ${list.length}건</div>${list.map(c=>`<button class="mitem ${c.case_id===cur?'on':''}" onclick="App.selContract('${c.case_id}')"><span class="t"><span>${esc(c.company_name)}</span><span class="badge">${esc(_s8label(c))}</span></span><span class="muted mono" style="font-size:11px">${esc(c.status||'')}</span></button>`).join('')}</nav>`;
  const d=(RS.entCt||{})[cur]; let body;
  if(!d){ if(RS._entCtLoading!==cur){ RS._entCtLoading=cur; loadEntCt(cur).then(()=>{RS._entCtLoading=null; render();}); } body='<section class="panel"><p class="empty">불러오는 중…</p></section>'; }
  else{
    const ct=d.contract||{}, invs=d.invoices||[];
    const canReq = !ct.exists || ['none','draft',null,'requested'].includes(ct.status);
    body=`<div style="display:flex;flex-direction:column;gap:22px;min-width:0">
      <section class="panel"><div class="panel-head"><h2>용역 계약</h2>${ct.exists?`<span class="badge ${ct.status==='confirmed'||ct.status==='signed'?'strong':'attn'}">${esc(ct.status||'')}</span>`:'<span class="muted">미생성</span>'}</div>
        ${ct.exists?`<dl class="dl"><div><dt>계약 번호</dt><dd class="mono">${esc(ct.contract_no||'-')}</dd></div><div><dt>계약 금액</dt><dd class="mono">${_money(ct.fee,ct.currency)}</dd></div>
          <div><dt>효력일</dt><dd class="mono">${esc(ct.effective_date||'-')}</dd></div><div><dt>서명</dt><dd>기업 ${ct.signed_a?'<span class="badge strong">완료</span>':'<span class="badge">대기</span>'} · GL HAC ${ct.signed_b?'<span class="badge strong">완료</span>':'<span class="badge">대기</span>'}</dd></div></dl>`
          :'<p class="muted">아직 계약서가 없습니다. 사전심사 통과 후 계약을 신청하세요.</p>'}
        ${canReq?`<div class="row-act" style="justify-content:flex-end"><button class="btn btn-primary" onclick="App.consReqContract('${cur}')">${ct.status==='requested'?'계약 재요청':'계약 진행 요청'}</button></div>`:''}
      </section>
      <section class="panel"><div class="panel-head"><h2>청구·입금</h2><span class="muted">${invs.length}건</span></div>
        ${invs.length?`<div class="tbl-wrap"><table><thead><tr><th>구분</th><th>청구액</th><th>상태</th><th>기한</th></tr></thead><tbody>
        ${invs.map(i=>`<tr><td>${esc(i.service_type||'-')}</td><td class="mono">${_money(i.total!=null?i.total:i.amount)}</td><td><span class="badge ${i.status==='paid'?'strong':'attn'}">${INV_ST[i.status]||i.status}</span></td><td class="mono">${esc((i.due_date||'').slice(0,10)||'-')}</td></tr>`).join('')}
        </tbody></table></div>`:'<p class="empty">청구 내역이 없습니다.</p>'}</section>
      <div class="note"><p>견적 금액 조정·할인은 관리자 승인이 필요합니다. 계약 신청 후 관리자가 견적서를 작성·발송합니다.</p></div></div>`;
  }
  return `<div class="md">${nav}${body}</div>`;
};
App.selContract = async function(id){ S.selContract=id; if(!(RS.entCt||{})[id]) await loadEntCt(id); render(); };
App.consReqContract = async function(cid){
  const r=await apiFetch('/cases/'+cid+'/contract/request',{method:'POST'});
  if(!r.ok) return toast('계약 신청에 실패했습니다.');
  delete RS.entCt[cid]; await loadEntCt(cid); render(); toast('계약 진행을 신청했습니다. 관리자에게 전달됩니다.');
};


/* ===== P4 슬라이스10: 컨설턴트 문서 관리(cons-docs) 실데이터 (담당 기업별 문서함) ===== */
function _docVaultBody(cid, docs){
  const q=(S.docQ||'').toLowerCase();
  const list=docs.filter(d=>!q||(d.filename||'').toLowerCase().includes(q)||(d.doc_type_ko||'').toLowerCase().includes(q)).slice().reverse();
  const RVW={approved:'승인', rejected:'반려', rework:'보완', pending:'검토 대기'};
  return `
  <section class="panel"><div class="panel-head"><h2>서류 올리기</h2><span class="muted">기업 대신 서류를 올릴 수 있습니다</span></div>
    <div class="inline" style="flex-wrap:wrap">
      <select class="in" id="doc-type" style="flex:1 1 200px">${DOC_TYPES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>
      <input class="in" id="doc-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls" style="flex:2 1 240px">
      <button class="btn btn-primary" onclick="App.docUpload('${cid}')">업로드</button></div></section>
  <section class="panel"><div class="panel-head"><h2>서류함 ${docs.length}건</h2><input class="in" style="max-width:240px" placeholder="파일명·종류 검색" value="${esc(S.docQ||'')}" oninput="App.docSearch(this.value)"></div>
    ${list.length?`<div class="tbl-wrap"><table><thead><tr><th style="min-width:200px">파일</th><th>종류</th><th>검토</th><th>등록</th><th></th></tr></thead><tbody>
    ${list.map(d=>`<tr><td><b>${esc(d.filename||'-')}</b></td><td class="muted">${esc(d.doc_type_ko||d.doc_type||'-')}</td>
      <td><span class="badge ${d.review_status==='approved'?'strong':(d.review_status==='rejected'||d.review_status==='rework'?'attn':'')}">${RVW[d.review_status]||'검토 대기'}</span></td>
      <td class="mono">${esc((d.created_at||'').slice(0,10))}</td>
      <td>${d.has_file?`<button class="btn btn-sm btn-ghost" onclick="App.docDownload('${d.document_id}','${esc((d.filename||'doc').replace(/'/g,''))}')">열기</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="empty">보관된 서류가 없습니다.</p>'}</section>`;
}
VIEWS['cons-docs'] = () => {
  const list=RS.cases||[];
  if(!list.length) return `<section class="panel"><p class="empty">담당 기업이 없습니다.</p></section>`;
  let cur=(S.selDocCo&&list.find(c=>c.case_id===S.selDocCo))?S.selDocCo:list[0].case_id; S.selDocCo=cur;
  const nav=`<nav class="mlist" aria-label="문서 대상 기업"><div class="mh">담당 기업 ${list.length}개사</div>${list.map(c=>`<button class="mitem ${c.case_id===cur?'on':''}" onclick="App.selDocCo('${c.case_id}')"><span class="t"><span>${esc(c.company_name)}</span><span class="badge">${esc(_s8label(c))}</span></span><span class="muted mono" style="font-size:11px">${esc(c.status||'')}</span></button>`).join('')}</nav>`;
  const docs=(RS.entDocs||{})[cur]; let body;
  if(!docs){ if(RS._entDocsLoading!==cur){ RS._entDocsLoading=cur; loadEntDocs(cur).then(()=>{RS._entDocsLoading=null; render();}); } body='<section class="panel"><p class="empty">불러오는 중…</p></section>'; }
  else body=`<div style="display:flex;flex-direction:column;gap:22px;min-width:0">${_docVaultBody(cur,docs)}</div>`;
  return `<div class="md">${nav}${body}</div>`;
};
App.selDocCo = async function(id){ S.selDocCo=id; S.docQ=''; if(!(RS.entDocs||{})[id]) await loadEntDocs(id); render(); };


/* ===== P4 슬라이스11: 기업↔컨설턴트 상담(ent-consultant) 실데이터 ===== */
async function loadEntAsk(){
  try{ const r=await apiFetch('/consultations'); RS.entAsk=r.ok?(await r.json()):[]; }
  catch(e){ RS.entAsk=[]; }
}
VIEWS['ent-consultant'] = () => {
  const c=(RS.cases||[])[0];
  if(!c) return `<section class="panel"><p class="empty">진행 중인 인증 신청이 없습니다.</p></section>`;
  if(RS.entAsk===null){ if(!RS._entAskLoading){ RS._entAskLoading=true; loadEntAsk().then(()=>{RS._entAskLoading=false; render();}); } }
  const rows=RS.entAsk||[];
  const consPanel=`<section class="panel"><div class="panel-head"><h2>전담 컨설턴트</h2></div>
    ${c.consultant?`<dl class="dl"><div><dt>담당</dt><dd><b>${esc(c.consultant)}</b></dd></div><div><dt>담당 심사원</dt><dd>${esc(c.main_auditor||'배정 전')}</dd></div></dl>`
      :'<p class="muted">전담 컨설턴트 배정 대기 중입니다. 관리자가 배정하거나 컨설턴트 초대 링크로 가입 시 자동 지정됩니다.</p>'}</section>`;
  const askForm=`<section class="panel"><div class="panel-head"><h2>문의하기</h2><span class="muted">응답은 담당자가 확인 후 등록됩니다</span></div>
    <div class="field"><label for="ask-subj">제목</label><input class="in" id="ask-subj" placeholder="예) 원재료 서류 관련 문의"></div>
    <div class="field"><label for="ask-msg">내용</label><textarea class="in" id="ask-msg" placeholder="문의 내용을 입력해 주세요."></textarea></div>
    <div class="row-act" style="justify-content:flex-end"><button class="btn btn-primary" onclick="App.entAsk('${c.case_id}')">문의 등록</button></div></section>`;
  const listPanel=`<section class="panel"><div class="panel-head"><h2>내 문의 ${rows.length}건</h2></div>
    ${rows.length?`<ul class="rows">${rows.slice().reverse().map(r=>`<li class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="row-act" style="justify-content:space-between"><b>${esc(r.subject||'(제목없음)')}</b><span class="badge ${r.status==='answered'?'strong':'attn'}">${r.status==='answered'?'답변 완료':'답변 대기'}</span></div>
      <div class="muted">${esc(r.message||'')}</div>
      ${r.response?`<div class="note"><b>답변${r.responder?(' · '+esc(r.responder)):''}</b><p>${esc(r.response)}</p></div>`:''}
      <span class="muted mono" style="font-size:11px">${esc((r.created_at||'').slice(0,16))}</span></li>`).join('')}</ul>`
      :(RS.entAsk===null?'<p class="empty">불러오는 중…</p>':'<p class="empty">등록한 문의가 없습니다.</p>')}</section>`;
  return consPanel + askForm + listPanel;
};
App.entAsk = async function(cid){
  const subject=(($('#ask-subj')||{}).value||'').trim();
  const message=(($('#ask-msg')||{}).value||'').trim();
  if(!message) return toast('문의 내용을 입력해 주세요.');
  const r=await apiFetch('/consultations',{method:'POST',body:JSON.stringify({subject,message,case_id:cid})});
  if(!r.ok) return toast('문의 등록에 실패했습니다.');
  await loadEntAsk(); render(); toast('문의를 등록했습니다.');
};

window.App = App;
authLoad();
/* 가입 링크 처리: ?signup=staff → 스태프(컨설턴트) 가입 / ?ref=CODE → 컨설턴트 초대로 기업 가입 (#20·?ref 귀속) */
(function(){ try{ const q=new URLSearchParams(location.search);
  const ref=q.get('ref');
  if(q.get('signup')==='staff'){ S.auth='signup-cons'; S.staffRole='consultant'; }
  else if(ref){ S.urlRef=ref; S.auth='signup-ent'; S.loginRole='enterprise'; }
}catch(e){} })();
render();
</script>
</body>
</html>
