<div id="glhac-intro" aria-hidden="true">

  </svg></div>
  <button id="introSoundBtn" type="button" aria-label="소리 켜기"><span aria-hidden="true">♪</span> 소리 켜기</button>
  <button id="introSkip" type="button">건너뛰기 ›</button>

  <script>
(function(){
  var el = document.getElementById('glhac-intro');
  if(!el) return;
  // 같은 방문(탭) 안에서는 한 번만 보여 준다 — 새로고침마다 12초를 기다리게 하지 않는다.
  if (sessionStorage.getItem('glhacIntroSeen')) { el.remove(); return; }
  document.body.classList.add('intro-on');
  function finish(){
    if (el.classList.contains('done')) return;
    stopSound();          // 화면이 사라졌는데 소리만 남으면 이상하다
    sessionStorage.setItem('glhacIntroSeen','1');
    el.classList.add('done');
    document.body.classList.remove('intro-on');
    setTimeout(function(){ el.remove(); }, 700);
  }
  /* ── 인트로 효과음 ──────────────────────────────────────────────────────
     손글씨가 그려지기 **직전**에 울린다(글씨 5.86s · 소리 5.30s).
     소리가 먼저 오고 글씨가 따라 나오는 순서다.

     나라별로 악기를 바꾼다. IP 로 나라를 알아내려면 외부 조회 서비스를 거쳐야
     하고, 방문자 주소가 그 업체로 나간다. 같은 목적이면 브라우저가 이미 들고 있는
     **시간대와 언어**로 충분하다 — 바깥으로 나가는 요청이 없다.

     브라우저는 사용자가 그 사이트에서 한 번이라도 누르기 전까지 소리를 막는다.
     그래서 첫 방문에는 대개 막힌다. 막혔을 때만 작은 '소리 켜기' 버튼을 내보내고,
     인트로 화면 아무 데나 눌러도 풀리게 했다. 평소에는 버튼이 보이지 않는다. */
  var introSound = null, doorSound = null;
  function pickSound(){
    var tz = '';
    try { tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || ''); } catch(e){}
    var lang = (navigator.language || '').toLowerCase();
    if (/Seoul/i.test(tz) || lang.indexOf('ko') === 0) return 'gong2';        // 한국 · 징
    if (/Jakarta|Makassar|Jayapura|Pontianak/i.test(tz) || lang.indexOf('id') === 0)
      return 'gamelan2';                                                      // 인도네시아 · 가믈란
    return 'tadum2';                                                          // 그 외 · 중립
  }
  try {
    doorSound = new Audio('./intro/door-creak2.mp3');   // 영상 속 문이 열릴 때
    doorSound.volume = 0.5;                      // 악기 소리보다 낮게 — 배경이다
    doorSound.preload = 'auto';
  } catch(e) { doorSound = null; }
  try {
    introSound = new Audio('./intro/' + pickSound() + '.mp3');
    introSound.volume = 0.55;
    introSound.preload = 'auto';
  } catch(e) { introSound = null; }

  /* 두 소리는 각자 '차례'가 있다.
       · 문 소리 — 인트로가 뜨는 순간(영상 시작과 동시에)
       · 악기 소리 — 글씨가 써지기 0.56초 전(인트로 시작 후 5.3초, 벽시계)
     차단돼 있다가 나중에 풀리면, **이미 지난 차례만** 그때 튼다.
     아직 안 온 차례는 건드리지 않는다 — 순서가 뒤집히면 연출이 무너진다. */
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var cue  = { door:false, inst:false };     // 차례가 왔는가
  var done = { door:false, inst:false };     // 실제로 울렸는가
  var busy = { door:false, inst:false };     // 재생을 시도하는 중(중복 호출 방지)

  function soundBtn(show){
    var sb = document.getElementById('introSoundBtn');
    if (sb) sb.style.display = show ? 'inline-flex' : 'none';
  }
  function fire(key, fromUser){
    var a = (key === 'door') ? doorSound : introSound;
    if (!a || done[key] || busy[key] || !cue[key]) return;
    var pr;
    busy[key] = true;
    try { pr = a.play(); } catch(e){ busy[key] = false; return; }
    if (!pr || !pr.then) { done[key] = true; return; }
    pr.then(function(){ done[key] = true; soundBtn(false); },
            function(){ busy[key] = false;                   // 막혔다 → 다시 시도할 수 있게
                        if (!fromUser) soundBtn(true); });   //            버튼을 내보낸다
  }
  function playSound(fromUser){                // 사용자가 눌러 소리가 풀렸을 때
    var vid = document.getElementById('intro');
    var vt = vid ? vid.currentTime : 99;
    if (vt < 2.0) fire('door', fromUser);      // 영상 초반일 때만 의미가 있다
    fire('inst', fromUser);
  }

  // 문 소리 차례 — 영상이 돌기 시작하는 그 순간
  cue.door = true;
  fire('door', false);

  // 악기 소리 차례 — 글씨보다 0.56초 먼저. 소리가 예고하고 글씨가 답한다.
  setTimeout(function(){ cue.inst = true; fire('inst', false); }, 5300);

  // 인트로 어디든 누르면 그 순간 소리가 풀린다(건너뛰기 버튼은 제외)
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function once(e){
      document.removeEventListener(ev, once);
      if (e.target && e.target.id === 'introSkip') return;
      playSound(true);
    }, {passive:true});
  });

  function stopSound(){
    [introSound, doorSound].forEach(function(a){
      if (!a) return;
      try { a.pause(); a.currentTime = 0; } catch(e){}
    });
    introSound = doorSound = null;
    soundBtn(false);
  }

  document.getElementById('introSkip').addEventListener('click', finish);
  document.getElementById('introSoundBtn').addEventListener('click', function(){
    playSound(true);
    this.style.display = 'none';
  });
  // 애니메이션 총 길이(#ui 가 10.20s 에 시작해 .6s) + 여유 — 화이트아웃 1초 단축 반영
  var t = setTimeout(finish, 11200);
  // 자동재생이 막히거나 영상이 실패해도 멈춰 있지 않게
  var v = document.getElementById('intro');
  if (v) v.addEventListener('error', function(){ clearTimeout(t); finish(); });
})();
</script>
  <script>
(function(){

  function applyLogo(){

        col.appendChild(tpl.content.firstChild);

  function applyFooterLogo(){

  // 로고를 누르면 첫 화면(히어로)으로. 원래 href="#" 이라 주소창에 '#'만 붙고
  // 뚝 끊기듯 올라갔다 — 부드럽게 올리고 주소는 깨끗하게 둔다.
  function wireLogoHome(){
    document.querySelectorAll('header .logo, .footer-logo').forEach(function(el){
      if(el.dataset.home) return;

      el.style.cursor = 'pointer';

      el.addEventListener('click', function(e){
        e.preventDefault();

        else window.scrollTo({top:0, behavior:'smooth'});
        if(location.hash) history.replaceState(null,'',location.pathname+location.search);
      });
    });
  }
  wireLogoHome();
  // '문의하기'는 게시판으로 보냈으므로, 마지막 화면(상담 신청·연락처·오시는 길)으로
  // 가는 메뉴가 따로 필요하다. SPA 가 다시 그려도 유지되게 매번 확인한다.
  /* 메뉴 이름도 언어를 따라야 한다. 원래 '문의하기'(게시판)는 Kontak 으로 번역되므로
     이쪽은 '연락처(정보)'로 구분되게 적는다. */
  var CONTACT_LABEL = {ko:'연락처', en:'Contact Info', id:'Info Kontak'};

  function pageLang(){

    var txt = ((on && on.textContent) || document.documentElement.lang || '').toLowerCase();
    if(/english|^en/.test(txt)) return 'en';

  function contactMenuLabel(){ return CONTACT_LABEL[pageLang()] || CONTACT_LABEL.ko; }
  /* 메뉴 차례: … 서비스 · 연락처 · 문의하기.

  function boardLink(menu){
    return menu.querySelector('a[data-board]')
        || menu.querySelector('a[data-i18n="navContact"]')
        || menu.querySelector('a[href="./board/"]');

  function orderContactMenu(){
    var menu = document.querySelector('header .menu') || document.querySelector('header nav');
    if(!menu) return;
    var a = menu.querySelector('[data-contact-menu]');
    var b = boardLink(menu);
    if(!a || !b || a.nextElementSibling === b) return;
    menu.insertBefore(a, b);
  }

  function syncContactMenu(){
    orderContactMenu();
    var a = document.querySelector('[data-contact-menu]');
    setText(a, contactMenuLabel());
    // 2번 화면 시안의 대체텍스트도 언어를 따른다(화면낭독기·이미지 실패 시 보인다)
    var img = document.querySelector('#about .about-full');
    setAlt(img, ALT_TEXT[pageLang()] || ALT_TEXT.ko);
    syncExtra();
  }
  /* 아래 세 곳은 원본에 data-i18n 이 없어 번역 대상에서 빠져 있었다 —
     영어·인니어 화면에도 한국어가 그대로 보인다(상단바 주소·'처음부터 바르게' 배지·
     이미지 대체텍스트). 여기서 언어에 맞춰 채운다. */
  var EXTRA = {
    addr: {ko:'서울 금천구 가산디지털2로 101',
           en:'101 Gasan digital 2-ro, Geumcheon-gu, Seoul',
           id:'101 Gasan digital 2-ro, Geumcheon-gu, Seoul'},
    seal: {ko:['처음부터 바르게','끝까지 함께'],
           en:['Right from the start','together to the end'],
           id:['Benar sejak awal','bersama hingga akhir']},
    sealTag: {ko:'TRUSTED PARTNER', en:'TRUSTED PARTNER', id:'MITRA TEPERCAYA'},
    altLogo: {ko:'GLHAC 로고', en:'GLHAC logo', id:'Logo GLHAC'},
    altMain: {ko:'기업 인증 상담', en:'Certification consulting', id:'Konsultasi sertifikasi'},
    altSmall:{ko:'전문 컨설팅 공간', en:'Consulting space', id:'Ruang konsultasi'}
  };
  /* 값이 이미 맞으면 건드리지 않는다 — 무심코 다시 쓰면 MutationObserver 가
     또 불려 무한 루프가 된다(실측: 페이지가 멈췄다). */
  function setText(el, v){ if(el && el.textContent !== v) el.textContent = v; }
  function setAlt(el, v){ if(el && el.getAttribute('alt') !== v) el.setAttribute('alt', v); }
  function syncExtra(){
    var lg = pageLang();
    var addr = [].slice.call(document.querySelectorAll('.topbar-links span'))
                 .filter(function(e){ return /가산디지털|Gasan/.test(e.textContent); })[0];
    setText(addr, EXTRA.addr[lg]);
    var seal = document.querySelector('.seal > div');
    if(seal){
      var html = '<small>' + EXTRA.sealTag[lg] + '</small>'
               + EXTRA.seal[lg][0] + '<br>' + EXTRA.seal[lg][1];
      if(seal.innerHTML !== html) seal.innerHTML = html;
    }
    document.querySelectorAll('.logo img').forEach(function(i){ setAlt(i, EXTRA.altLogo[lg]); });
    setAlt(document.querySelector('img.about-main'), EXTRA.altMain[lg]);
    setAlt(document.querySelector('img.about-small'), EXTRA.altSmall[lg]);
  }

  var ALT_TEXT = {
    ko:'GLHAC 센터 소개 — 처음부터 바르게 끝까지 함께. 인증 자체가 목적이 아니라, 기업의 다음 시장이 목적입니다.',
    en:'About GLHAC — Right from the start, together to the end. Certification is not the final goal; your next market is.',
    id:'Tentang GLHAC — Benar sejak awal, bersama hingga akhir. Sertifikasi bukan tujuan akhir; pasar berikutnya adalah tujuan Anda.'
  };

  /* 마지막 화면의 인증 신청 버튼 — 로그인 상태면 인계로 넘어간다(헤더와 같은 규칙). */
  var APPLY_LABEL = {ko:'인증 신청 바로가기 →', en:'Apply for Certification →',
                     id:'Ajukan Sertifikasi →'};
  function addApplyButton(){
    var cta = document.querySelector('#contact .cta-box') || document.querySelector('#contact .wrap');
    if(!cta) return;
    var a = cta.querySelector('[data-apply-cta]');
    if(!a){
      a = document.createElement('a');
      a.setAttribute('data-apply-cta','1');
      a.className = 'hs-apply';
      a.href = 'https://glhac.co.kr';
      a.rel = 'noopener';
      cta.appendChild(a);
    }
    var want = APPLY_LABEL[pageLang()] || APPLY_LABEL.ko;
    if(a.textContent !== want) a.textContent = want;
  }

  function addContactMenu(){
    var menu = document.querySelector('header .menu') || document.querySelector('header nav');
    if(!menu || menu.querySelector('[data-contact-menu]')) return;
    if(!document.getElementById('contact')) return;
    var a = document.createElement('a');
    a.href = '#contact';
    a.setAttribute('data-contact-menu','1');
    a.textContent = contactMenuLabel();
    menu.appendChild(a);
    orderContactMenu();
  }
  addContactMenu();
  syncContactMenu();
  addApplyButton();
  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.language-switcher'))
      setTimeout(syncContactMenu, 140);
  }, true);
  var root = document.getElementById('root');
  if (root && window.MutationObserver){
    new MutationObserver(function(){applyLogo();applyFooterLogo();wireLogoHome();addContactMenu();syncContactMenu();addApplyButton();}).observe(root, {childList:true, subtree:true});
  }
})();
</script>

<script id="glhac-home-wire">
/* 홈페이지 ↔ 할랄 AI 연결 ─────────────────────────────────────────────────
   본문은 빌드된 SPA 라 소스가 없다. 그래서 **밖에서 손보는** 방식으로 간다 —
   되돌리려면 이 <script> 한 덩이만 빼면 된다.

   하는 일 세 가지:
     ① 메뉴 '문의하기' → 익명 비공개 게시판(/board/)
     ② QR 로 들어온 ?ref= 를 기억 — 게시판 문의가 그 영업자 담당으로 붙는다
     ③ '인증 신청' 버튼: 로그인 상태면 다시 로그인시키지 않고 인계코드로 넘긴다
*/
(function(){
  var APP = (window.GLHAC_API_BASE || "https://glhac.co.kr").replace(/\/+$/,"");
  var TK  = "glhac_home_token";

  // ② ?ref= 기억. 주소창에서 지워도 세션 동안 유지된다.
  var m = location.search.match(/[?&]ref=([A-Za-z0-9\-]+)/);
  if(m){ try{ sessionStorage.setItem("glhac_ref", m[1].toUpperCase()); }catch(e){} }
  function ref(){ try{ return sessionStorage.getItem("glhac_ref")||""; }catch(e){ return ""; } }
  // 인증신청(앱 가입) 귀속은 **현재 URL의 ?ref 만** 쓴다 — 저장분 되살림 금지.
  // ?ref 없이 그냥 들어와 인증신청을 눌렀는데 옛 코드가 붙으면 엉뚱한 컨설턴트로 귀속된다.
  function urlRef(){ var mm=(location.search||"").match(/[?&]ref=([A-Za-z0-9\-]+)/); return mm?mm[1].toUpperCase():""; }
  function tok(){ try{ return localStorage.getItem(TK)||""; }catch(e){ return ""; } }

  // ③ 로그인 상태면 인계코드를 받아 이동한다. 실패하면 그냥 로그인 화면으로 — 막지 않는다.
  async function toApp(e){
    if(!tok()) return;                       // 비로그인은 원래 링크대로
    if(e){ e.preventDefault(); }
    try{
      var r = await fetch(APP+"/auth/handoff/issue",
        {method:"POST", headers:{"Content-Type":"application/json",
         Authorization:"Bearer "+tok()}, body:"{}"});
      var j = await r.json();
      location.href = r.ok && j.redirect ? j.redirect : APP;
    }catch(err){ location.href = APP; }
  }

  function wire(){
    document.querySelectorAll('a[href]').forEach(function(a){
      var h = a.getAttribute("href")||"";
      // ① 문의하기 — #contact 앵커(CTA 로 내려가기만 한다)를 게시판으로
      // '전문가 상담 신청'(히어로)도 문의하기 게시판으로 보낸다.
      // 원래 glhac.co.kr 을 가리켜 아래 인계 처리에 걸렸으므로, 여기서 먼저 바꾸고
      // 인계 대상에서 빠지게 한다(순서가 중요하다).
      if(a.dataset.i18n === "heroConsultBtn" && !a.dataset.board){
        a.dataset.board = "1";
        a.setAttribute("href", "./board/" + (urlRef()?("?ref="+urlRef()):""));  // QR 로 왔을 때만 문의도 귀속
        a.removeAttribute("target");
        return;
      }
      // 헤더 메뉴의 '문의하기'만 게시판으로. 본문에도 #contact 링크가 있어서
      // ('인증 상담' 바로가기, '센터 소개 더보기') 전에는 그것들까지 게시판으로 갔다.
      var inMenu = a.closest && a.closest('header');
      if(h === "#contact" && inMenu && !a.dataset.board && !a.dataset.contactMenu){
        a.dataset.board = "1";
        a.setAttribute("href", "./board/" + (urlRef()?("?ref="+urlRef()):""));  // QR 로 왔을 때만 문의도 귀속
        a.removeAttribute("target");
      }
      // ③ 인증 신청 계열 — glhac.co.kr 로 가는 링크 전부
      if((/glhac\.co\.kr/.test(h) || (APP && h.indexOf(APP)===0)) && !a.dataset.handoff){
        a.dataset.handoff = "1";
        a.addEventListener("click", toApp);
        var _r = urlRef();                       // 현재 URL에 ?ref 있을 때만(저장분 금지)
        if(_r){ try{
          var u = new URL(h, location.href); u.searchParams.set("ref", _r);
          a.setAttribute("href", u.toString());
        }catch(e){} }
      }
    });
    // CTA 섹션의 '인증 상담 신청'은 앵커가 아니라 버튼일 수 있다
    document.querySelectorAll('.btn.is-disabled').forEach(function(b){
      if(b.dataset.i18n === "lawBtn") return;   // 법령 상담은 아직 준비 중이다
    });
  }
  wire();
  // SPA 가 언어 전환 등으로 다시 그리면 다시 걸어 준다
  var root = document.getElementById("root");
  if(root && window.MutationObserver) new MutationObserver(wire).observe(root,{childList:true,subtree:true});
})();
</script>




<script id="glhac-hslides">
/* 한 화면씩 좌우로 넘기는 모드.

   묶음 규칙: 히어로에는 바로 아래 '바로가기' 4칸을 붙이고, 마지막은 문의 + 푸터를
   한 슬라이드로 묶는다(푸터만 있는 화면은 허전하다).
   되돌리려면 이 <script> 와 위 <style> 만 빼면 세로 스크롤로 돌아간다. */
(function(){
  var main, slides=[], dots, prev, next, built=false;

  function build(){
    main = document.querySelector('main');
    if(!main || built) return;
    var kids = [].slice.call(main.children);
    if(!kids.length) return;
    built = true;

    var groups=[], cur=null;
    kids.forEach(function(el){
      var isHero = el.classList.contains('hero');
      var isQuick = el.tagName==='DIV' && el.classList.contains('wrap');
      var isContact = el.id==='contact';
      if(isQuick && cur){ cur.push(el); return; }         // 바로가기는 히어로에 붙인다
      cur=[el]; groups.push(cur);
      if(isHero) return;
      if(isContact){ var f=document.querySelector('footer'); if(f) cur.push(f); }
    });

    groups.forEach(function(g){
      var d=document.createElement('div');
      d.className='hslide';
      main.insertBefore(d, g[0]);
      g.forEach(function(el){ d.appendChild(el); });
      slides.push(d);
    });

    // 2번 화면은 시안 이미지 한 장으로 바꾼다(위 CSS 가 원래 글을 감춘다).
    // 글이 이미지에 구워져 있으므로 언어마다 다른 파일을 쓴다.
    // 언어 전환은 SPA 가 하므로, 바뀔 때마다 src 를 다시 맞춘다.
    var about = document.getElementById('about');
    if(about && !about.querySelector('.about-full')){
      var img = document.createElement('img');
      img.className = 'about-full';
      img.src = aboutSrc();
      img.alt = 'GLHAC';   // 자세한 대체텍스트는 syncContactMenu() 가 언어에 맞춰 넣는다
      // 이미지는 나중에 도착한다 — 그때 높이가 바뀌므로 맞춤을 다시 돌린다
      img.addEventListener('load', function(){ fit(); sync(); });
      about.appendChild(img);
    }

    document.body.classList.add('hslides');
    chrome();
    wireLinks();
    fit();
    sync();
  }

  /* 화면 높이가 낮으면(1366x768 같은) 조금씩 잘렸다. 잘리는 슬라이드만 살짝
     줄인다 — 다 줄이면 큰 화면에서 허전하고, 안 줄이면 내용이 잘린다.
     0.80 까지만 줄이고 그래도 넘치면 그 슬라이드 안에서 세로로 스크롤된다. */
  function fit(){
    slides.forEach(function(d){
      d.style.zoom = '';
      for(var i=0;i<3;i++){
        var over = d.scrollHeight - d.clientHeight;
        if(over <= 0) break;
        // 2px 여유를 두고 맞춘다 — 1px 만 남아도 스크롤바가 생긴다(실측 1440x900 등)
        var z = parseFloat(d.style.zoom || 1) * ((d.clientHeight - 2) / d.scrollHeight);
        d.style.zoom = Math.max(0.78, z);   // 1366x768 에서 0.84 로는 21px 모자랐다
      }
    });
  }

  /* 화면 언어에 맞는 시안 파일. SPA 의 LANG(0:en 1:ko 2:id)을 쓰되, 없으면
     <html lang> · 언어 버튼의 활성 상태 순으로 본다. 못 찾으면 한국어를 쓴다. */
  function curLang(){
    // LANG 은 SPA 안에 갇혀 있어 밖에서 못 본다 — 언어 버튼의 활성 상태로 읽는다
    var on = document.querySelector('.language-switcher .active, .language-switcher [aria-pressed="true"]');
    var txt = (on && on.textContent || document.documentElement.lang || '').toLowerCase();
    if(/english|^en/.test(txt)) return 'en';
    if(/indone|^id/.test(txt)) return 'id';
    return 'ko';
  }
  function aboutSrc(){ return './about-visual-' + curLang() + '.jpg'; }
  function syncAboutImg(){
    var img = document.querySelector('#about .about-full');
    if(!img) return;
    var want = aboutSrc();
    if(img.getAttribute('src') !== want){ img.setAttribute('src', want); }
  }

  function chrome(){
    prev=btn('prev','‹','이전 화면'); next=btn('next','›','다음 화면');
    document.body.appendChild(prev); document.body.appendChild(next);
    prev.onclick=function(){ go(idx()-1); };
    next.onclick=function(){ go(idx()+1); };
    dots=document.createElement('div'); dots.className='hs-dots';
    dots.setAttribute('role','tablist'); dots.setAttribute('aria-label','화면 이동');
    slides.forEach(function(s,i){
      var b=document.createElement('button'); b.type='button';
      b.setAttribute('aria-label', (i+1)+'번째 화면');
      b.onclick=function(){ go(i); };
      dots.appendChild(b);
    });
    document.body.appendChild(dots);
    main.addEventListener('scroll', sync, {passive:true});
    window.addEventListener('resize', function(){ fit(); sync(); });
  }
  function btn(cls,ch,label){
    var b=document.createElement('button'); b.type='button';
    b.className='hs-arrow '+cls; b.textContent=ch; b.setAttribute('aria-label',label);
    return b;
  }
  function idx(){ return Math.round(main.scrollLeft / main.clientWidth); }
  function go(i){
    i=Math.max(0, Math.min(slides.length-1, i));
    main.scrollTo({left:i*main.clientWidth, behavior:'smooth'});
  }
  function sync(){
    var i=idx();
    prev.disabled = i<=0;
    next.disabled = i>=slides.length-1;
    [].forEach.call(dots.children, function(b,n){ b.setAttribute('aria-current', n===i?'true':'false'); });
  }

  /* 메뉴의 #about 같은 링크를 가로 이동으로 다시 잇는다.
     문서 단위로 한 번만 건다 — 링크를 나중에 추가해도(예: '연락처') 같이 잡힌다.
     전에는 만들 때 한 번만 걸어서, 뒤에 생긴 메뉴가 동작하지 않았다. */
  function wireLinks(){
    if(document.documentElement.dataset.hsLinks) return;
    document.documentElement.dataset.hsLinks = '1';
    document.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if(!a || !document.body.classList.contains('hslides')) return;
      var id = a.getAttribute('href').slice(1);
      var t = id ? document.getElementById(id) : null;
      var slide = t ? t.closest('.hslide') : slides[0];
      if(!slide) return;
      e.preventDefault();
      go(slides.indexOf(slide));
      if(slide.scrollTop) slide.scrollTo({top:0, behavior:'smooth'});
    }, true);
  }

  /* 휠·키보드 — 세로로 굴려도 넘어가게. 단, 내용이 긴 슬라이드는 그 안에서
     세로로 다 읽은 뒤에 다음 화면으로 간다(읽던 내용을 건너뛰지 않게). */
  var lock=false;
  function onWheel(e){
    var s=slides[idx()]; if(!s) return;
    var canDown = s.scrollTop + s.clientHeight < s.scrollHeight - 2;
    var canUp = s.scrollTop > 2;
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;    // 트랙패드 가로는 그대로
    if(e.deltaY > 0 && canDown) return;
    if(e.deltaY < 0 && canUp) return;
    e.preventDefault();
    if(lock) return;
    lock=true; setTimeout(function(){ lock=false; }, 420);
    go(idx() + (e.deltaY>0 ? 1 : -1));
  }
  function onKey(e){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))) return;
    var map={ArrowRight:1,ArrowLeft:-1,PageDown:1,PageUp:-1};
    if(e.key in map){ e.preventDefault(); go(idx()+map[e.key]); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(slides.length-1); }
  }

  // 작은 화면은 세로 스크롤을 그대로 둔다. 좁은 화면에서는 어떤 슬라이드도 한 화면에
  // 안 들어가서, 가로로 넘기며 안에서 또 세로로 굴려야 한다 — 축이 둘이면 헷갈린다.
  function wantSlides(){ return window.innerWidth>=1024 && window.innerHeight>=640; }

  function start(){
    if(!wantSlides()) return;
    build();
    if(!built) return;
    window.addEventListener('wheel', onWheel, {passive:false});
    window.addEventListener('keydown', onKey);
    window.addEventListener('load', function(){ fit(); sync(); });
    // 언어 전환(버튼 클릭)에 맞춰 시안도 바꾼다 — SPA 가 다시 그린 뒤에 확인한다
    document.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('.language-switcher'))
        setTimeout(function(){ syncAboutImg(); fit(); sync(); }, 120);
    }, true);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit(); sync(); });
  }
  if(document.querySelector('main')) start();
  else {
    var root=document.getElementById('root');
    if(root && window.MutationObserver){
      var mo=new MutationObserver(function(){ if(document.querySelector('main')){ mo.disconnect(); start(); } });
      mo.observe(root,{childList:true,subtree:true});
    }
  }
})();
</script>
