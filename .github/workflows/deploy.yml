name: Deploy (가비아)

# 가비아 서버(glhac.co.kr)로 배포한다.
#
# 실제 절차는 scripts/deploy.sh 에 있고 여기서는 그것을 호출만 한다 —
# 맥에서 손으로 돌릴 때와 서버가 같은 길을 밟게 하려는 것이다. 한 곳만 고치면 된다.
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   GLHAC_SSH_KEY   배포용 개인키 전문(-----BEGIN … END----- 포함)
#   GLHAC_SSH_HOST  rocky@1.201.116.174
#
# 러너가 서버 22 번에 붙을 수 있어야 한다. 보안그룹이 막고 있으면 연결되지 않는다 —
# 그 경우엔 맥에서 `bash scripts/deploy.sh` 한 줄이 가장 빠르고 안전하다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "배포하려면 'deploy' 를 입력하세요"
        required: true
        default: ''

defaults:
  run:
    shell: bash

# CI 통과 확인 단계가 Actions 실행 기록을 읽는다.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 실수로 눌러 배포되는 일을 막고, main 만 배포한다 — 10/17 옛 계보 브랜치(codex/…)가 CI 실패
    # 상태로 이 워크플로를 통해 운영에 나가 깃과 운영이 갈라졌다.
    if: inputs.confirm == 'deploy' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: CI 통과 확인 (배포할 커밋 그대로)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이 커밋에 대한 CI 실행 중 가장 최근 것이 '완료·성공'이어야 한다. 실행 중이면 끝난 뒤 다시 누른다.
          read -r ci_status ci_conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --limit 1 --json status,conclusion \
            -q '.[0] | "\(.status // "none") \(.conclusion // "none")"')
          echo "CI($GITHUB_SHA): status=${ci_status:-none} conclusion=${ci_conclusion:-none}"
          if [ "${ci_status:-none}" = "none" ]; then
            echo "::error::이 커밋의 CI 실행 기록이 없습니다 — main 에 푸시해 CI 를 돌린 뒤 배포하세요"; exit 1
          fi
          if [ "$ci_status" != "completed" ]; then
            echo "::error::CI 가 아직 끝나지 않았습니다($ci_status) — 완료 후 다시 실행하세요"; exit 1
          fi
          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::CI 가 통과하지 않았습니다($ci_conclusion) — 깨진 코드는 배포하지 않습니다"; exit 1
          fi

      - name: 시크릿 확인
        env:
          KEY: ${{ secrets.GLHAC_SSH_KEY }}
          HOST: ${{ secrets.GLHAC_SSH_HOST }}
        run: |
          [ -n "$KEY" ]  || { echo "::error::GLHAC_SSH_KEY 가 없습니다"; exit 1; }
          [ -n "$HOST" ] || { echo "::error::GLHAC_SSH_HOST 가 없습니다"; exit 1; }

      - uses: actions/setup-python@v5
        # Production diagnostics below use only the remote system Python stdlib.
        with:
          python-version: '3.11'
          cache: pip

      - name: 운영 계정·메일 설정 점검 (읽기 전용)
        env:
          DEPLOY_KEY: ${{ secrets.GLHAC_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.GLHAC_SSH_HOST }}
        run: |
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H "${DEPLOY_HOST#*@}" > "$hosts_file" 2>/dev/null
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=15 \
            "$DEPLOY_HOST" python3 - < scripts/check_operations.py

      - name: 의존성
        run: |
          python -m pip install --upgrade pip
          sed 's/[[:space:]]*#.*$//' requirements.txt \
            | grep -vE '^[[:space:]]*$' | grep -viE '^paddle' > /tmp/req.txt
          pip install -r /tmp/req.txt "pytest>=8.0"

      # 깨진 코드를 서버에 올리지 않는다
      - name: 관리자 목록·페이징 회귀 검사
        run: node tests/test_adm_intake_ui.cjs

      - name: 테스트 (실패하면 배포하지 않는다)
        env:
          GLHAC_DEV: '1'
          GLHAC_RATE_LIMIT_PER_MIN: '0'
          GLHAC_SECRET: 'ci-test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        run: python -m pytest -q

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GLHAC_SSH_KEY }}" > ~/.ssh/glhac.pem
          chmod 600 ~/.ssh/glhac.pem
          # 다음 스텝의 env 로 넘길 때 '~' 는 셸이 아니라 문자로 전달된다 —
          # 그대로 두면 deploy.sh 가 '~/.ssh/glhac.pem' 이라는 이름의 파일을 찾다 실패한다.
          # 절대경로로 풀어 GITHUB_ENV 에 담는다.
          echo "SSH_KEY_PATH=$HOME/.ssh/glhac.pem" >> "$GITHUB_ENV"
          ssh-keyscan -H "$(echo '${{ secrets.GLHAC_SSH_HOST }}' | cut -d@ -f2)" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 배포 (백업 → 전송 → 재기동 → 헬스체크, 실패 시 자동 복구)
        env:
          GLHAC_SSH_KEY: ${{ env.SSH_KEY_PATH }}
          GLHAC_SSH_HOST: ${{ secrets.GLHAC_SSH_HOST }}
        run: bash scripts/deploy.sh --app-only

      - name: 배포 확인
        run: |
          for u in https://glhac.co.kr/ui/ https://glhac.co.kr/health; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' -m 20 "$u")
            echo "  $u → $code"
            [ "$code" = "200" ] || { echo "::error::$u 가 200 이 아닙니다"; exit 1; }
          done

      - name: 정리
        if: always()
        run: rm -f "$HOME/.ssh/glhac.pem"
