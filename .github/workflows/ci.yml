name: CI

# 단독 저장소용 — 모노레포에서는 glhac-ai-v3/** 경로로 걸렀지만 여기선 전부가 이 프로젝트다.
#
# 테스트는 파일별 독립 프로세스로 돌린다(tests/run_isolated.sh). 한 프로세스에서
# 전부 돌리면 앞 파일이 만든 모듈 전역·DB 상태가 뒤 파일에 새어 순서에 따라 결과가
# 달라진다 — 실제로 그렇게 깨진 적이 있다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GLHAC_DEV: '1'                         # 데모 계정 시드(테스트용)
  GLHAC_RATE_LIMIT_PER_MIN: '0'          # 레이트리밋 비활성 — 연속 호출 안전
  GLHAC_SECRET: 'ci-test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 (무거운 OCR 은 제외)
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 의 직접 의존에서 paddle* 만 빼고, 버전은 requirements.lock(운영 venv freeze)의
          # 정확한 값으로 고정한다 — 운영과 같은 버전으로 테스트. lock 에 없는 항목은 범위 선언 그대로
          # (목록을 손으로 적지 않는다: 새 의존 추가 시 CI 에서만 ModuleNotFoundError 나는 문제, 실측 segno).
          python scripts/pin_from_lock.py --skip paddle > /tmp/ci-reqs.txt
          echo "--- 설치 목록 ---"; cat /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt
          pip install -r requirements-dev.txt
          python -c "import fastapi, sqlalchemy, httpx, pydantic, fitz, openpyxl, docx, Crypto, PIL, segno; print('deps OK')"

      # e2e 는 HTTP 로 서버를 때린다. 대상이 없으면 run_isolated.sh 가 건너뛰므로
      # 여기서 격리 서버를 띄워 실제로 돌린다(임시 DB · 운영과 무관).
      - name: 테스트용 서버 기동
        env:
          GLHAC_DB_URL: sqlite:///${{ runner.temp }}/ci_e2e.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8899 \
            > "${{ runner.temp }}/server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/server.pid"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/health || echo 000)
            [ "$code" = "200" ] && { echo "기동 완료 (${i}s)"; exit 0; }
            sleep 1
          done
          echo "::error::서버가 60초 안에 뜨지 않았습니다"; cat "${{ runner.temp }}/server.log"; exit 1

      - name: 테스트 (파일별 격리)
        env:
          PYTHON: python
          GLHAC_COV: '1'
          GLHAC_E2E_BASE: http://127.0.0.1:8899
          GLHAC_DB_URL: sqlite:///${{ runner.temp }}/ci_e2e.db   # 위 서버와 같은 파일이어야 한다
          GLHAC_E2E_SKIP_OLLAMA: '1'                             # 러너에 Ollama 가 없다
        run: bash tests/run_isolated.sh

      # e2e_srs_cycle 은 정식 흐름(SRS) 전 과정이라 GLHAC_FORMAL_FLOW=1 서버가 필요하다(운영과 같은 조건).
      # 위 서버는 정식 흐름이 꺼져 있어 거기선 SKIP 되고, 여기서 정식 흐름 서버를 따로 띄워 돌린다.
      - name: 테스트 (정식 흐름 서버 · SRS 전 과정)
        env:
          GLHAC_FORMAL_FLOW: '1'
          GLHAC_DB_URL: sqlite:///${{ runner.temp }}/ci_formal.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8897 \
            > "${{ runner.temp }}/server_formal.log" 2>&1 &
          SPID=$!
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8897/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::정식 흐름 서버가 60초 안에 뜨지 않았습니다"; cat "${{ runner.temp }}/server_formal.log"; exit 1
          fi
          rc=0
          GLHAC_E2E_BASE=http://127.0.0.1:8897 GLHAC_E2E_FORMAL=1 GLHAC_E2E_SKIP_OLLAMA=1 \
            python tests/e2e_srs_cycle.py || rc=$?
          kill "$SPID" 2>/dev/null || true
          [ "$rc" = 0 ] || { echo "--- 정식 흐름 서버 로그(끝 80줄)"; tail -80 "${{ runner.temp }}/server_formal.log"; }
          exit $rc

      # 암호화 모드는 pytest 파일만 돈다 — e2e 대상 서버(8899)는 암호화가 꺼져 있고 DB 파일도 달라,
      # DB 를 직접 쓰는 e2e 시나리오(e2e_s13 등)가 엉뚱한 파일을 고치게 된다.
      - name: 테스트 (암호화 모드)
        env:
          PYTHON: python
          GLHAC_COV: '1'
          GLHAC_E2E_BASE: ''
          GLHAC_DB_URL: sqlite:///${{ runner.temp }}/ci_encrypted.db
          GLHAC_E2E_SKIP_OLLAMA: '1'
          GLHAC_ENCRYPTION: '1'
          GLHAC_ENC_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='  # base64 32바이트 고정값 (테스트용)
        run: bash tests/run_isolated.sh

      - name: 서버 로그 (실패 원인 추적)
        if: always()
        run: cat "${{ runner.temp }}/server.log" || true

      - name: 서버 종료
        if: always()
        run: kill "$(cat "${{ runner.temp }}/server.pid")" 2>/dev/null || true

      - name: 비밀키 누출 검사
        run: |
          # 바이너리 제외(-I) — PDF 압축 데이터가 UUID 패턴과 우연히 겹쳐 오탐이 난다
          if git grep -InE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo "::error::비밀키 패턴 발견"; exit 1
          fi
          echo "누출 없음"
